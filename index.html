<style>
/* ============================================
   VIÁTICOS — Sistema de control de gastos
   Estética: fintech moderna oscura
   ============================================ */

/* Fonts */
@import url("https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap");

:root {
  /* Colors — dark fintech */
  --bg: #0a0b0f;
  --bg-2: #101218;
  --surface: #14171f;
  --surface-2: #1a1e28;
  --surface-3: #232836;
  --border: #242a38;
  --border-2: #2e3548;
  --border-strong: #3a4358;

  --text: #e7eaf1;
  --text-2: #a4adc1;
  --text-3: #6f7891;
  --text-dim: #4f566b;

  /* Accent — verde lima fintech default */
  --accent: oklch(0.85 0.18 130);
  --accent-2: oklch(0.78 0.18 130);
  --accent-fg: #0a0b0f;
  --accent-soft: oklch(0.85 0.18 130 / 0.14);

  /* Semantic */
  --success: oklch(0.78 0.16 155);
  --success-soft: oklch(0.78 0.16 155 / 0.14);
  --warn: oklch(0.83 0.16 80);
  --warn-soft: oklch(0.83 0.16 80 / 0.14);
  --danger: oklch(0.72 0.18 25);
  --danger-soft: oklch(0.72 0.18 25 / 0.14);
  --info: oklch(0.78 0.14 240);
  --info-soft: oklch(0.78 0.14 240 / 0.14);

  /* Density */
  --row-h: 52px;
  --pad-card: 24px;
  --pad-cell: 14px 16px;

  /* Radii */
  --r-sm: 6px;
  --r: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* Type */
  --f-display: "Inter Tight", system-ui, sans-serif;
  --f-body: "Inter", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}

[data-density="compact"] {
  --row-h: 40px;
  --pad-card: 18px;
  --pad-cell: 8px 12px;
}

[data-theme="light"] {
  --bg: #f6f7f9;
  --bg-2: #eef0f4;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef0f4;
  --border: #e3e6ec;
  --border-2: #d6dae3;
  --border-strong: #b9c0cd;
  --text: #11131a;
  --text-2: #4a5269;
  --text-3: #6b7388;
  --text-dim: #9aa1b3;
  --accent-fg: #0a0b0f;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* Subtle starfield-y bg */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(1200px 600px at 80% -10%, oklch(0.85 0.18 130 / 0.04), transparent 60%),
    radial-gradient(900px 500px at -10% 100%, oklch(0.7 0.15 240 / 0.04), transparent 60%);
  z-index: 0;
}
[data-theme="light"] body::before {
  background:
    radial-gradient(1200px 600px at 80% -10%, oklch(0.85 0.18 130 / 0.08), transparent 60%),
    radial-gradient(900px 500px at -10% 100%, oklch(0.7 0.15 240 / 0.06), transparent 60%);
}

/* ============ APP SHELL ============ */
.app {
  display: grid;
  grid-template-columns: 244px 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 18px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--accent);
  display: grid; place-items: center;
  color: var(--accent-fg);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
}
.brand-name {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.02em;
}
.brand-sub {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 1px;
}

.nav-section {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  padding: 14px 10px 6px;
  font-weight: 600;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13.5px;
  color: var(--text-2);
  border: 1px solid transparent;
  user-select: none;
  transition: background 0.12s, color 0.12s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--text);
  border-color: oklch(from var(--accent) l c h / 0.22);
}
.nav-item .ico {
  width: 16px; height: 16px;
  flex-shrink: 0;
  opacity: 0.85;
}
.nav-item .badge {
  margin-left: auto;
  font-size: 10.5px;
  background: var(--accent);
  color: var(--accent-fg);
  padding: 1px 6px;
  border-radius: 99px;
  font-weight: 600;
  font-family: var(--f-mono);
}

/* Role pill in sidebar bottom */
.user-card {
  margin-top: auto;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), oklch(from var(--accent) calc(l - 0.15) c h));
  color: var(--accent-fg);
  display: grid; place-items: center;
  font-weight: 600;
  font-size: 12.5px;
  font-family: var(--f-display);
  flex-shrink: 0;
}
.avatar.lg { width: 40px; height: 40px; font-size: 14px; }
.avatar.sm { width: 26px; height: 26px; font-size: 10px; }
.user-card-name { font-weight: 500; font-size: 13px; }
.user-card-role { font-size: 11px; color: var(--text-3); text-transform: capitalize; }

/* ============ MAIN ============ */
.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 60px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in oklch, var(--bg) 70%, transparent);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 16px;
  position: sticky; top: 0;
  z-index: 10;
}
.crumbs {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-3);
}
.crumbs strong { color: var(--text); font-weight: 500; }
.crumbs .sep { color: var(--text-dim); }
.topbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
}

.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 7px 12px;
  width: 280px;
  font-size: 13px;
}
.search input {
  background: none;
  border: none;
  color: var(--text);
  flex: 1;
  font-family: inherit;
  font-size: 13px;
  outline: none;
}
.search input::placeholder { color: var(--text-dim); }
.kbd {
  font-family: var(--f-mono);
  font-size: 10.5px;
  border: 1px solid var(--border-2);
  background: var(--surface-2);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--text-3);
}

.content {
  padding: 28px;
  flex: 1;
  min-width: 0;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 16px;
  flex-wrap: wrap;
}
.page-title {
  font-family: var(--f-display);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.025em;
  margin: 0;
  line-height: 1.15;
}
.page-sub { color: var(--text-3); margin-top: 4px; font-size: 13.5px; }

/* ============ KPI CARDS ============ */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.kpi-label {
  font-size: 12px;
  color: var(--text-3);
  font-weight: 500;
  letter-spacing: 0.01em;
}
.kpi-value {
  font-family: var(--f-display);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.kpi-delta {
  font-size: 11.5px;
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--f-mono);
}
.kpi-delta.up { color: var(--success); }
.kpi-delta.down { color: var(--danger); }
.kpi-delta.neutral { color: var(--text-3); }
.kpi-spark {
  position: absolute;
  right: 16px; top: 18px;
  width: 80px; height: 36px;
  opacity: 0.75;
}

/* ============ CARDS ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--pad-card);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.card-title {
  font-family: var(--f-display);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
.card-sub { font-size: 12px; color: var(--text-3); }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--r);
  border: 1px solid var(--border-2);
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover { background: oklch(from var(--accent) calc(l - 0.04) c h); border-color: oklch(from var(--accent) calc(l - 0.04) c h); }
.btn.ghost { background: none; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger {
  background: var(--danger-soft);
  border-color: oklch(from var(--danger) l c h / 0.4);
  color: var(--danger);
}
.btn.danger:hover { background: oklch(from var(--danger) l c h / 0.22); }
.btn.success {
  background: var(--success-soft);
  border-color: oklch(from var(--success) l c h / 0.4);
  color: var(--success);
}
.btn.success:hover { background: oklch(from var(--success) l c h / 0.22); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.icon { padding: 8px; width: 34px; justify-content: center; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* ============ STATUS BADGES & STEPPER ============ */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 500;
  font-family: var(--f-body);
  border: 1px solid transparent;
  white-space: nowrap;
  letter-spacing: 0.005em;
}
.badge .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}
.badge.solicitado { background: var(--info-soft); color: var(--info); border-color: oklch(from var(--info) l c h / 0.3); }
.badge.autorizado { background: var(--warn-soft); color: var(--warn); border-color: oklch(from var(--warn) l c h / 0.3); }
.badge.liberado { background: var(--accent-soft); color: var(--accent); border-color: oklch(from var(--accent) l c h / 0.3); }
.badge.comprobado { background: var(--success-soft); color: var(--success); border-color: oklch(from var(--success) l c h / 0.3); }
.badge.rechazado { background: var(--danger-soft); color: var(--danger); border-color: oklch(from var(--danger) l c h / 0.3); }
.badge.parcial { background: oklch(from var(--text-3) l c h / 0.15); color: var(--text-2); border-color: oklch(from var(--text-3) l c h / 0.3); }
.badge.tipo { background: var(--surface-3); color: var(--text-2); border-color: var(--border-2); font-family: var(--f-mono); font-size: 10.5px; padding: 2px 7px; }

/* Stepper horizontal */
.stepper {
  display: flex;
  align-items: center;
  gap: 0;
  width: 100%;
}
.stepper .step {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  position: relative;
  padding: 6px 4px;
}
.stepper .dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1.5px solid var(--border-2);
  display: grid; place-items: center;
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  z-index: 2;
  position: relative;
  transition: all 0.2s;
}
.stepper .label {
  font-size: 11.5px;
  margin-top: 6px;
  color: var(--text-3);
  white-space: nowrap;
  font-weight: 500;
}
.stepper .meta {
  font-size: 10.5px;
  color: var(--text-dim);
  font-family: var(--f-mono);
  margin-top: 2px;
}
.stepper .step::after {
  content: "";
  position: absolute;
  height: 1.5px;
  background: var(--border-2);
  top: 20px;
  left: 50%;
  right: -50%;
  z-index: 1;
}
.stepper .step:last-child::after { display: none; }

.stepper .step.done .dot,
.stepper .step.active .dot {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
}
.stepper .step.done::after { background: var(--accent); }
.stepper .step.done .label,
.stepper .step.active .label { color: var(--text); }
.stepper .step.active .dot {
  box-shadow: 0 0 0 4px oklch(from var(--accent) l c h / 0.18);
  animation: pulse 1.8s ease-in-out infinite;
}
.stepper .step.rejected .dot {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}
.stepper .step.rejected .label { color: var(--danger); }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px oklch(from var(--accent) l c h / 0.18); }
  50% { box-shadow: 0 0 0 7px oklch(from var(--accent) l c h / 0.08); }
}

/* ============ TABLES ============ */
.table-wrap {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  overflow: hidden;
}
table.t {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.t thead th {
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  padding: 12px 16px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.t tbody td {
  padding: var(--pad-cell);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.t tbody tr:last-child td { border-bottom: none; }
.t tbody tr { transition: background 0.08s; cursor: pointer; }
.t tbody tr:hover { background: var(--surface-2); }
.t tbody tr.selected { background: var(--accent-soft); }
.t .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.t .id-cell { font-family: var(--f-mono); font-size: 12px; color: var(--text-2); }
.t .muted { color: var(--text-3); }
.t .right { text-align: right; }

/* Filter bar */
.filterbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.chip {
  padding: 6px 12px;
  border-radius: 99px;
  border: 1px solid var(--border-2);
  background: var(--surface);
  color: var(--text-2);
  font-size: 12.5px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.12s;
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
.chip .count {
  font-family: var(--f-mono);
  font-size: 11px;
  background: oklch(from var(--text) l c h / 0.08);
  padding: 0 6px;
  border-radius: 99px;
}
.chip.active .count { background: oklch(from var(--accent-fg) l c h / 0.15); }

/* ============ FORM ELEMENTS ============ */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label {
  font-size: 12px;
  color: var(--text-2);
  font-weight: 500;
}
.field .hint { font-size: 11px; color: var(--text-3); }
.input, .select, .textarea {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r);
  padding: 9px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 13.5px;
  outline: none;
  transition: border-color 0.12s, background 0.12s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  background: var(--surface);
}
.input::placeholder, .textarea::placeholder { color: var(--text-dim); }
.textarea { min-height: 80px; resize: vertical; font-family: inherit; }

.form-grid {
  display: grid;
  gap: 16px;
}
.form-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.form-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

/* ============ DROP ZONE ============ */
.dropzone {
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-lg);
  padding: 28px;
  text-align: center;
  background: var(--surface-2);
  transition: all 0.15s;
  cursor: pointer;
}
.dropzone:hover, .dropzone.drag {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.dropzone-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  margin: 0 auto 12px;
  display: grid; place-items: center;
  color: var(--accent);
}
.dropzone-title { font-weight: 600; font-size: 14px; }
.dropzone-sub { color: var(--text-3); font-size: 12px; margin-top: 4px; }

/* File chip */
.file-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  font-size: 12.5px;
}
.file-chip .icon-box {
  width: 30px; height: 30px;
  border-radius: 6px;
  background: var(--surface-3);
  display: grid; place-items: center;
  font-family: var(--f-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--accent);
  flex-shrink: 0;
}
.file-chip .meta { flex: 1; min-width: 0; }
.file-chip .name { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip .sz { color: var(--text-3); font-family: var(--f-mono); font-size: 11px; }

/* ============ TIMELINE ============ */
.timeline {
  display: flex;
  flex-direction: column;
  gap: 12px;

function verifyToken(correo, token) {
  const rec = window.AUTH_TOKENS[correo];
  if (!rec) return false;
  if (Date.now() > rec.expires) { delete window.AUTH_TOKENS[correo]; return false; }

}

// ── Supabase (Fase 1: auth + catálogos) ─────────────────────────────────────
const SUPABASE_URL = "https://zkeymkqzqjrgjgjbjdzi.supabase.co";

// Carga catálogos desde Supabase (centros, cuentas_contables, usuarios)
async function loadFromDB() {
  if (!supabase) { console.warn("Supabase no disponible — modo offline con datos locales"); return false; }

  // ── Caché local: mostrar datos previos instantáneamente ──────────────
  try {
    const cached = localStorage.getItem("viaticos_catalogs");
    if (cached) {
      const { centros, cuentas, usuarios } = JSON.parse(cached);
      if (centros)  { CENTROS.length=0;          centros.forEach(c=>CENTROS.push(c)); }
      if (cuentas)  { CATALOGO_GASTOS.length=0;  cuentas.forEach(c=>CATALOGO_GASTOS.push(c)); }
      if (usuarios) { USUARIOS.length=0;          usuarios.forEach(u=>USUARIOS.push(u)); }
      console.log("✓ Catálogos desde caché local");
    }
  } catch(e) {}

  try {
    const [centrosRes, cuentasRes, usuariosRes] = await Promise.all([
      supabase.from('centros').select('*').eq('activo', true),
      supabase.from('cuentas_contables').select('*').eq('activo', true),
      supabase.from('usuarios').select('*').eq('activo', true),
    ]);
    if (centrosRes.error)  throw centrosRes.error;
    if (cuentasRes.error)  throw cuentasRes.error;
    if (usuariosRes.error) throw usuariosRes.error;

    // Reemplaza arrays in-place para que existing components vean los nuevos datos
    CENTROS.length = 0;
    (centrosRes.data || []).forEach(c => CENTROS.push({
      id: c.id, nombre: c.nombre, depto: c.depto, division: c.division,
    }));

    CATALOGO_GASTOS.length = 0;
    (cuentasRes.data || []).forEach(c => CATALOGO_GASTOS.push({
      cuenta: c.cuenta, nombre: c.nombre, grupo: c.grupo,
    }));

    USUARIOS.length = 0;
    (usuariosRes.data || []).forEach(u => USUARIOS.push({
      id: u.id, nombre: u.nombre, correo: u.correo, rol: u.rol,
      centro: u.centro_id, gerente: u.gerente_id, iniciales: u.iniciales,
      division: u.division, clabe: u.clabe, banco: u.banco,
      password: null,  // ya no almacenamos pwd local
    }));

    console.log(`✓ Catálogos cargados: ${CENTROS.length} centros, ${CATALOGO_GASTOS.length} cuentas, ${USUARIOS.length} usuarios`);
    // Guardar en caché para la próxima carga
    try {
      localStorage.setItem("viaticos_catalogs", JSON.stringify({
        centros:  CENTROS,
        cuentas:  CATALOGO_GASTOS,
        usuarios: USUARIOS.map(u => ({...u, password: undefined})),
        ts: Date.now(), // timestamp para invalidar caché viejo
      }));
      // Invalidar caché de solicitudes si cambiaron los usuarios
      const cachedSols = localStorage.getItem("viaticos_solicitudes");
      if (cachedSols) {
        const sols = JSON.parse(cachedSols);
        const validIds = new Set(USUARIOS.map(u => u.id));
        const filtered = sols.filter(s => validIds.has(s.usuario));
        if (filtered.length !== sols.length) {
          localStorage.setItem("viaticos_solicitudes", JSON.stringify(filtered));
        }
      }
    } catch(e) {}
    return true;
  } catch (err) {
    console.error("Error cargando catálogos de Supabase:", err);
    return false;
  }
}

// Carga solicitudes desde Supabase (requiere sesión activa por RLS)
async function loadSolicitudes() {
  if (!supabase) return false;

  // Mostrar solicitudes cacheadas mientras carga Supabase
  try {
    const cached = localStorage.getItem("viaticos_solicitudes");
    const cacheTs = parseInt(localStorage.getItem("viaticos_solicitudes_ts") || "0");
    const cacheAge = Date.now() - cacheTs;
    if (cached && SOLICITUDES.length === 0 && cacheAge < 300000) { // 5 min max
      const parsed = JSON.parse(cached);
      // Solo cachear solicitudes de usuarios que existen en USUARIOS
      const validUserIds = new Set(USUARIOS.map(u => u.id));
      const valid = parsed.filter(s => validUserIds.has(s.usuario));
      valid.forEach(s => {
        SOLICITUDES.push({...s, fecha: new Date(s.fecha)});
      });
      console.log(`✓ Solicitudes desde caché: ${SOLICITUDES.length}`);
    }
  } catch(e) {}

  try {
    const { data, error } = await supabase
      .from('solicitudes')
      .select(`
        *,
        items:solicitud_items(*),
        cfdi:comprobantes_cfdi(*)
      `)
      .order('fecha', { ascending: false })
      .limit(500);

    if (error) throw error;

    SOLICITUDES.length = 0;
    (data || []).forEach(s => {
      // Fallback: si saldo_pendiente es null en Supabase y el anticipo está activo → usar monto
      // saldoPendiente: solo contar si está liberado/parcial (dinero ya salió)
      // Si saldo_pendiente es null en Supabase y está liberado → usar monto como fallback
      // Si está rechazado → siempre 0
      const saldoCalc = s.status === "rechazado" ? 0
        : (s.saldo_pendiente !== null && s.saldo_pendiente !== undefined)
          ? parseFloat(s.saldo_pendiente) || 0
          : (s.tipo === "anticipo" && ["liberado","parcial"].includes(s.status)
              ? parseFloat(s.monto) || 0 : 0);
      SOLICITUDES.push({
        id:             s.id,
        tipo:           s.tipo,
        concepto:       s.concepto,
        usuario:        s.usuario_id,
        monto:          parseFloat(s.monto) || 0,
        fecha:          new Date(s.fecha),
        status:         s.status,
        saldoPendiente: saldoCalc,
        anticipoRef:    s.anticipo_ref || null,
        motivoRechazo:  s.motivo_rechazo || null,
        updatedAt:      s.updated_at ? new Date(s.updated_at) : null,
        comprobantes:   s.comprobantes || 0,
        destino:        s.destino || null,
        notas:          s.notas || null,
        // Items del desglose estimado
        items: (s.items || []).map(i => ({
          cuenta: i.cuenta, desc: i.descripcion, monto: parseFloat(i.monto) || 0,
        })),
        // Facturas CFDI comprobadas
        cfdi: (s.cfdi || []).map(c => ({
          uuid:     c.uuid,
          emisor:   c.emisor,
          concepto: c.concepto,
          subtotal: parseFloat(c.subtotal) || 0,
          iva:      parseFloat(c.iva) || 0,
          total:    parseFloat(c.total) || 0,
          cuenta:   c.cuenta,
          confianza: parseFloat(c.confianza) || 0.9,
          archivo_xml_url: c.archivo_xml_url,
          archivo_pdf_url: c.archivo_pdf_url,
        })),
      });
    });

    // Recalcular saldos de anticipos cruzando comprobaciones
    SOLICITUDES.filter(s => s.tipo === 'anticipo').forEach(s => {
      if (typeof calcSaldo === 'function') calcSaldo(s.id);
    });

    console.log(`✓ Solicitudes cargadas: ${SOLICITUDES.length}`);
    // Guardar solicitudes recientes en caché (últimas 100)
    try {
      const toCache = SOLICITUDES.slice(0, 100).map(s => ({
        ...s,
        fecha: s.fecha instanceof Date ? s.fecha.toISOString() : s.fecha,
      }));
      localStorage.setItem("viaticos_solicitudes", JSON.stringify(toCache));
      localStorage.setItem("viaticos_solicitudes_ts", Date.now().toString());
    } catch(e) {}
    return true;
  } catch (err) {
    console.error("Error cargando solicitudes:", err);
    return false;
  }
}
window.loadSolicitudes = loadSolicitudes;

// Refresca solicitudes y fuerza re-render — llamar después de crear/actualizar solicitudes
window.refreshSolicitudes = async (callback) => {
  await loadSolicitudes();
  if (typeof callback === 'function') callback();
};

// Carga solicitudes de un usuario específico desde Supabase
window.loadUserSolicitudes = async (userId) => {
  if (!supabase || !userId) return [];
  try {
    const { data } = await supabase
      .from('solicitudes')
      .select('*, items:solicitud_items(*), cfdi:comprobantes_cfdi(*)')
      .eq('usuario_id', userId)
      .order('fecha', { ascending: false });
    if (!data) return [];
    return data.map(s => ({
      id: s.id, tipo: s.tipo, concepto: s.concepto,
      usuario: s.usuario_id, monto: parseFloat(s.monto)||0,
      fecha: new Date(s.fecha), status: s.status,
      saldoPendiente: s.status === 'rechazado' ? 0
        : (s.saldo_pendiente !== null ? parseFloat(s.saldo_pendiente)||0
          : (['liberado','parcial'].includes(s.status) ? parseFloat(s.monto)||0 : 0)),
      anticipoRef: s.anticipo_ref || null,
      motivoRechazo: s.motivo_rechazo || null,
      updatedAt: s.updated_at ? new Date(s.updated_at) : null,
      comprobantes: s.comprobantes || 0,
      items: (s.items||[]).map(i=>({cuenta:i.cuenta,desc:i.descripcion,monto:parseFloat(i.monto)||0})),
      cfdi: (s.cfdi||[]).map(c=>({
        id: c.id, uuid: c.uuid, uuidFull: c.uuid, emisor: c.emisor,
        concepto: c.concepto, subtotal: parseFloat(c.subtotal)||0,
        iva: parseFloat(c.iva)||0, total: parseFloat(c.total)||0,
        cuenta: c.cuenta, confianza: parseFloat(c.confianza)||0.9,
      })),
    }));
  } catch(e) { console.error('loadUserSolicitudes:', e); return []; }
};

// Login con Supabase Auth
async function sbLogin(correo, pwd) {
  if (!supabase) throw new Error("Supabase no inicializado");
  const { data, error } = await supabase.auth.signInWithPassword({ email: correo, password: pwd });
  if (error) throw error;
  // Carga el perfil del usuario desde public.usuarios
  const { data: perfil, error: pErr } = await supabase
    .from('usuarios').select('*').eq('id', data.user.id).single();
  if (pErr) throw pErr;
  return {
    id: perfil.id, nombre: perfil.nombre, correo: perfil.correo, rol: perfil.rol,
    centro: perfil.centro_id, gerente: perfil.gerente_id, iniciales: perfil.iniciales,
    division: perfil.division, clabe: perfil.clabe, banco: perfil.banco,
  };
}
window.sbLogin = sbLogin;

async function sbLogout() {
  if (!supabase) return;
  try { await supabase.auth.signOut(); } catch (e) { console.warn("logout:", e); }
}
window.sbLogout = sbLogout;

async function sbGetSession() {
  if (!supabase) return null;
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return null;
  const { data: perfil } = await supabase
    .from('usuarios').select('*').eq('id', session.user.id).single();
  if (!perfil) return null;
  return {
    id: perfil.id, nombre: perfil.nombre, correo: perfil.correo, rol: perfil.rol,
    centro: perfil.centro_id, gerente: perfil.gerente_id, iniciales: perfil.iniciales,
    division: perfil.division, clabe: perfil.clabe, banco: perfil.banco,
  };
}
window.sbGetSession = sbGetSession;


// ── Cálculo automático de saldo pendiente ──────────────────────────────────
// Recalcula saldoPendiente de un anticipo sumando sus comprobaciones aprobadas
// Retorna la cuenta de bancos según la división del usuario
function getBancosAccount(division) {
  const entry = CATALOGO_GASTOS.find(c => c.grupo === "Activo" && c.division === division);
  return entry ? entry.cuenta : (division === "4106" ? "1111102622" : "1111102604");
}

function calcSaldo(anticipoId) {
  const ant = SOLICITUDES.find(s => s.id === anticipoId);
  if (!ant || ant.tipo !== "anticipo") return;
  // Solo restar comprobaciones efectivamente liberadas por tesorería
  // (comprobado = tesorería ya las procesó)
  const comprobado = SOLICITUDES
    .filter(s => s.tipo === "comprobacion"
      && s.anticipoRef === anticipoId
      && ["liberado","comprobado"].includes(s.status))
    .reduce((a, s) => a + (s.monto || 0), 0);
  // Cierres (depósitos de reintegro) — comprobaciones especiales marcadas con CIERRE_DEPOSITO
  // Ya están incluidas en "comprobado" arriba, no hay que sumarlas dos veces
  ant.saldoPendiente = Math.max(0, Math.round((ant.monto - comprobado) * 100) / 100);
  if (ant.saldoPendiente <= 0) ant.status = "comprobado";
  else if (ant.saldoPendiente < ant.monto) ant.status = "parcial";
}

// Recalcular todos al cargar
SOLICITUDES.filter(s => s.tipo === "comprobacion" && s.anticipoRef)
  .forEach(s => calcSaldo(s.anticipoRef));

// ── Pólizas de liquidación ──────────────────────────────────────────────────
// Genera el asiento de liquidación cuando se libera una comprobación
// Cargo: cuentas de gasto  |  Abono: 1125 Deudores (cancela el anticipo)
function generarPolizaLiquidacion(comprobacion) {
  if (!comprobacion || comprobacion.tipo !== "comprobacion") return null;
  const ant = SOLICITUDES.find(s => s.id === comprobacion.anticipoRef);
  const u   = findUser(comprobacion.usuario);
  if (!ant || !u) return null;

  const items = (() => {
    if (comprobacion.cfdi && comprobacion.cfdi.length > 0)
      return comprobacion.cfdi.map(cf => ({ cuenta: cf.cuenta || "6121200001", desc: cf.concepto || cf.emisor || "—", monto: cf.total || 0 }));
    if (comprobacion.items && comprobacion.items.length > 0)
      return comprobacion.items.map(it => ({ cuenta: it.cuenta || "6121200001", desc: it.desc || "—", monto: it.monto || 0 }));
    return [{ cuenta: "6121200001", desc: comprobacion.concepto, monto: comprobacion.monto }];
  })();

  const totalComp = items.reduce((a, i) => a + i.monto, 0);
  const diff      = Math.round((ant.monto - totalComp) * 100) / 100; // + devuelve, - debe más

  const lineas = [];
  // Cargos: cuentas de gasto (el gasto real)
  items.forEach(it => {
    if (it.monto <= 0) return;
    const meta = findCuenta(it.cuenta) || { nombre: it.cuenta };
    lineas.push({ tipo:"C", cuenta: it.cuenta, nombre: meta.nombre, debe: it.monto, haber: 0, concepto: it.desc });
  });
  // Abono: 1125 Deudores (cancela el anticipo por el monto comprobado)
  lineas.push({ tipo:"A", cuenta:"1125", nombre:"Deudores Diversos / Anticipos a Empleados", debe: 0, haber: totalComp, concepto: `Liquidación anticipo ${ant.id} · ${u.nombre}` });
  // Si hay diferencia a favor: abono extra a Bancos (devuelven el sobrante)
  if (diff > 0.01) {
    lineas.push({ tipo:"C", cuenta:"1101", nombre:"Bancos", debe: 0, haber: 0,
      concepto: `Saldo a devolver ${window.fmtMXN(diff)} · pendiente de reintegro`, nota: true });
  }
  // Si el gasto excedió el anticipo: cargo adicional a 1125
  if (diff < -0.01) {
    lineas.push({ tipo:"C", cuenta:"1125", nombre:"Deudores Diversos / Anticipos a Empleados", debe: Math.abs(diff), haber: 0, concepto: `Diferencia por exceso sobre anticipo · ${u.nombre}` });
    lineas.push({ tipo:"A", cuenta:"6000000", nombre:"Proveedor Único Viáticos", debe: 0, haber: Math.abs(diff), concepto: `Reembolso diferencia a ${u.nombre}` });
  }

  return { anticipoId: ant.id, comprobacionId: comprobacion.id, usuario: u.nombre, fecha: comprobacion.fecha, totalComp, totalAnt: ant.monto, diff, lineas };
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// ── Motor de notificaciones ──────────────────────────────────────────────────
function generarNotificaciones(role, userId) {
  const hoy   = window.HOY;
  const msgs  = [];
  const SALDO_ALERTA   = 10000;  // saldo deudor que dispara alerta
  const DIAS_SIN_RESP  = 2;      // días sin respuesta = urgente
  const DIAS_VENCE_CMP = 10;     // días antes de vencer comprobación

  const todos = window.SOLICITUDES;

  if (role === "usuario" || role === "gerente") {
    const mias = todos.filter(s => s.usuario === userId);

    // ── 1. Anticipos por vencer el plazo de comprobación ──────────────────
    mias.filter(s =>
      s.tipo === "anticipo" &&
      ["liberado","parcial"].includes(s.status) &&
      (s.saldoPendiente || 0) > 0
    ).forEach(s => {
      const dias = Math.floor((hoy - s.fecha) / 86400000);
      const restantes = 15 - dias;  // política: 15 días hábiles
      if (restantes <= DIAS_VENCE_CMP && restantes > 0) {
        msgs.push({
          id:    "vence_" + s.id,
          tipo:  "warn",
          icon:  "clock",
          titulo: `Anticipo por vencer`,
          texto:  `${s.id} · ${s.concepto} — quedan ${restantes} día${restantes>1?"s":""} para comprobar`,
          folio:  s.id,
          ts:     hoy,
        });
      } else if (restantes <= 0) {
        msgs.push({
          id:    "vencido_" + s.id,
          tipo:  "danger",
          icon:  "flag",
          titulo: `Anticipo vencido`,
          texto:  `${s.id} · ${s.concepto} — vencido hace ${Math.abs(restantes)} día${Math.abs(restantes)>1?"s":""}`,
          folio:  s.id,
          ts:     hoy,
        });
      }
    });

    // ── 2. Solicitudes rechazadas sin revisar ─────────────────────────────
    mias.filter(s => s.status === "rechazado").forEach(s => {
      msgs.push({
        id:    "rechazado_" + s.id,
        tipo:  "danger",
        icon:  "x",
        titulo: `Solicitud rechazada`,
        texto:  `${s.id} — ${s.motivoRechazo || "Revisa el motivo y reenvía"}`,
        folio:  s.id,
        ts:     s.fecha,
      });
    });

    // ── 3. Solicitudes autorizadas listas para comprobar ──────────────────
    mias.filter(s => s.tipo === "anticipo" && s.status === "liberado" && (s.saldoPendiente||0) > 0)
      .forEach(s => {
        msgs.push({
          id:    "liberar_" + s.id,
          tipo:  "info",
          icon:  "check",
          titulo: `Anticipo liberado`,
          texto:  `${s.id} · ${window.fmtMXN(s.saldoPendiente)} pendiente de comprobar`,
          folio:  s.id,
          ts:     s.fecha,
        });
      });
  }

  if (role === "gerente") {
    const teamIds = window.USUARIOS.filter(u => u.gerente === userId).map(u => u.id);

    // ── 4. Solicitudes sin respuesta más de 48h ───────────────────────────
    todos.filter(s =>
      teamIds.includes(s.usuario) &&
      s.status === "solicitado"
    ).forEach(s => {
      const horas = Math.floor((hoy - s.fecha) / 3600000);
      if (horas >= DIAS_SIN_RESP * 24) {
        msgs.push({
          id:    "sin_resp_" + s.id,
          tipo:  "warn",
          icon:  "clock",
          titulo: `Sin respuesta ${Math.floor(horas/24)}d`,
          texto:  `${s.id} de ${window.findUser(s.usuario)?.nombre} · ${window.fmtMXN(s.monto)}`,
          folio:  s.id,
          ts:     s.fecha,
        });
      }
    });

    // ── 5. Saldo deudor alto en equipo ────────────────────────────────────
    teamIds.forEach(uid => {
      const saldo = todos.filter(s =>
        s.usuario === uid && s.tipo === "anticipo" && ["liberado","parcial"].includes(s.status) && (s.saldoPendiente||0) > 0
      ).reduce((a,s) => a + (s.saldoPendiente||0), 0);
      if (saldo >= SALDO_ALERTA) {
        const u = window.findUser(uid);
        msgs.push({
          id:    "saldo_" + uid,
          tipo:  "warn",
          icon:  "flag",
          titulo: `Saldo deudor alto`,
          texto:  `${u?.nombre} — ${window.fmtMXN(saldo)} sin comprobar`,
          folio:  null,
          ts:     hoy,
        });
      }
    });
  }

  if (role === "tesoreria" || role === "admin" || role === "contador") {
    // ── 6. Solicitudes autorizadas esperando liberación +48h ─────────────
    todos.filter(s => s.status === "autorizado").forEach(s => {
      const horas = Math.floor((hoy - s.fecha) / 3600000);
      if (horas >= DIAS_SIN_RESP * 24) {
        msgs.push({
          id:    "teso_" + s.id,
          tipo:  "info",
          icon:  "cash",
          titulo: `Pendiente de liberar`,
          texto:  `${s.id} · ${window.findUser(s.usuario)?.nombre} · ${window.fmtMXN(s.monto)}`,
          folio:  s.id,
          ts:     s.fecha,
        });
      }
    });

    // ── 7. Saldos deudores mayores al umbral ─────────────────────────────
    const porUser = {};
    todos.filter(s => s.tipo==="anticipo" && ["liberado","parcial"].includes(s.status) && (s.saldoPendiente||0)>0)
      .forEach(s => { porUser[s.usuario]=(porUser[s.usuario]||0)+(s.saldoPendiente||0); });
    Object.entries(porUser).filter(([,v])=>v>=SALDO_ALERTA).forEach(([uid,saldo])=>{
      const u = window.findUser(uid);
      msgs.push({
        id:    "deudor_" + uid,
        tipo:  "warn",
        icon:  "flag",
        titulo: `Deudor alto`,
        texto:  `${u?.nombre} — ${window.fmtMXN(saldo)} sin comprobar`,
        folio:  null,
        ts:     hoy,
      });
    });
  }

  // Deduplicar y ordenar por tipo (danger > warn > info)
  const unique = [...new Map(msgs.map(m => [m.id, m])).values()];
  const orden  = { danger:0, warn:1, info:2 };
  return unique.sort((a,b) => (orden[a.tipo]||2) - (orden[b.tipo]||2));
}

// Stepper component: status flow
function Stepper({ status, dates }) {
  const steps = [
    { key: "solicitado", label: "Solicitado" },
    { key: "autorizado", label: "Autorizado" },
    { key: "liberado", label: "Liberado" },
    { key: "comprobado", label: "Comprobado" },
  ];
  if (status === "rechazado") {
    return (
      <div className="stepper">
        <div className="step done"><div className="dot">1</div><div className="label">Solicitado</div></div>
        <div className="step rejected"><div className="dot">✕</div><div className="label">Rechazado</div></div>
      </div>
    );
  }
  const order = { solicitado: 0, autorizado: 1, liberado: 2, comprobado: 3, parcial: 2 };
  const cur = order[status] ?? 0;
  return (
    <div className="stepper">
      {steps.map((s, i) => {
        const cls = i < cur ? "done" : (i === cur ? "active" : "");
        return (
          <div key={s.key} className={`step ${cls}`}>
            <div className="dot">{i < cur ? "✓" : i + 1}</div>
            <div className="label">{s.label}</div>
            {dates && dates[s.key] && <div className="meta">{window.fmtFecha(dates[s.key])}</div>}
          </div>
        );
      })}
    </div>
  );
}

// Sparkline
function Spark({ values, color = "var(--accent)" }) {
  const w = 80, h = 36;
  const max = Math.max(...values), min = Math.min(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <polyline fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" points={pts} />
    </svg>
  );
}

function SolicitarAnticipo({ setPage, userId }) {

    concepto: "Visita comercial Monterrey - 3 días",
    centro: window.CENTROS[0]?.id || "",

    regreso: "16 may 2026",
    destino: "Monterrey, NL",
    monto: "8,500.00",
    notas: "Reuniones con cliente Aceros del Norte. Hospedaje 2 noches y vuelo redondo.",
  });
  const [desglose, setDesglose] = React.useState([
    { id: 1, nombre: "Pasajes (vuelo)", monto: 4800, cuenta: "6122900001" },
    { id: 2, nombre: "Hospedaje",       monto: 2400, cuenta: "6122900003" },
    { id: 3, nombre: "Comidas",         monto: 900,  cuenta: "6122900005" },
    { id: 4, nombre: "Transporte local",monto: 400,  cuenta: "6122900004" },
  ]);
  const updField = (k, v) => setForm({ ...form, [k]: v });
  const updDesg = (id, k, v) => setDesglose(desglose.map(d => d.id === id ? { ...d, [k]: v } : d));
  const addDesg = () => setDesglose([...desglose, { id: Date.now(), nombre: "Nuevo concepto", monto: 0, cuenta: "6122900005" }]);
  const delDesg = (id) => setDesglose(desglose.filter(d => d.id !== id));
  const totalDesg = desglose.reduce((a, d) => a + (parseFloat(d.monto) || 0), 0);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };
  window.BORRADORES = window.BORRADORES || [];

  const handleEnviar = async () => {
    if (!form.concepto.trim()) { showToast("⚠ Escribe un concepto para continuar"); return; }
    if (!form.destino.trim())  { showToast("⚠ Indica el destino del viaje"); return; }
    if (totalDesg <= 0)        { showToast("⚠ Agrega al menos un concepto con monto"); return; }
    const uid = userId || (window.USUARIOS[0]&&window.USUARIOS[0].id) || "U001";
    const u   = window.findUser(uid);
    const id  = "ANT-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-4);
    // Persistir en Supabase
    if (window.sb) {
      const row = {
        id, tipo:"anticipo", concepto: form.concepto.trim(),
        usuario_id: uid, monto: totalDesg,
        status:"solicitado", saldo_pendiente: totalDesg,
        centro_id: u&&u.centro ? u.centro : null,
        destino: form.destino.trim(), notas: form.notas||null,
        fecha: new Date().toISOString(),
      };
      const { error } = await window.sb.from("solicitudes").insert(row);
      if (error) { showToast("⚠ Error al guardar: " + error.message); return; }
      if (desglose.length > 0) {
        await window.sb.from("solicitud_items").insert(
          desglose.map((d,i)=>({ solicitud_id:id, cuenta:d.cuenta,
            descripcion:d.desc||d.concepto||"", monto:d.monto, orden:i }))
        );
      }
    }
    const nueva = {
      id, tipo:"anticipo", concepto: form.concepto.trim(),
      usuario: uid, monto: totalDesg, fecha: new Date(),
      status:"solicitado", saldoPendiente: totalDesg, comprobantes:0,
      destino: form.destino, notas: form.notas||null,
    };
    window.SOLICITUDES.unshift(nueva);
    showToast("✓ Anticipo " + id + " enviado a tu gerente");
    setTimeout(()=>setPage&&setPage("dash"),1400);
  };

    const id = `BOR-${Date.now().toString().slice(-6)}`;

    showToast(`✓ Borrador ${id} guardado · velo en "Mis anticipos"`);

    <>
      {toast && <div style={{position:"fixed", bottom:24, right:24, background:"var(--success-soft)", border:"1px solid oklch(from var(--success) l c h / 0.4)", color:"var(--success)", padding:"12px 18px", borderRadius:"var(--r-lg)", zIndex:100, fontWeight:500, fontSize:13}}>{toast}</div>}
      <div className="page-head">

      <div className="two-col">
        <div className="card">
          <h3 className="card-title" style={{marginBottom:18}}>Datos del anticipo</h3>
          <div className="form-grid cols-2">
            <div className="field"><label>Concepto / motivo</label><input className="input" value={form.concepto} onChange={e => updField("concepto", e.target.value)}/></div>
            <div className="field"><label>Centro de beneficio</label><select className="select" value={form.centro} onChange={e => updField("centro", e.target.value)}>{window.CENTROS.map(c => <option key={c.id} value={c.id}>{c.id} · {c.nombre}</option>)}</select></div>
            <div className="field"><label>Fecha salida</label><input className="input" type="date" value={form.salida} onChange={e => updField("salida", e.target.value)}/></div>
            <div className="field"><label>Fecha regreso</label><input className="input" type="date" min={form.salida||undefined} value={form.regreso} onChange={e => updField("regreso", e.target.value)}/></div>

          <div style={{display:"flex", flexDirection:"column", gap:8}}>

        <div>

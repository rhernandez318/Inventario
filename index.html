function CompUploader({ onAdd }) {
  const [files, setFiles] = React.useState([]);
  const [drag, setDrag] = React.useState(false);
  const inputRef = React.useRef(null);

  const processFiles = (fileList) => {
    Array.from(fileList).forEach(file => {
      if (!file.name.endsWith(".xml") && !file.name.endsWith(".XML")) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const parsed = parseCFDI(e.target.result);
        if (parsed) {
          const item = { ...parsed, id: parsed.uuidFull || (parsed.uuid + "-" + Date.now()) || ("item-" + Date.now()), file };
          setFiles(prev => [...prev, item]);
          if (onAdd) onAdd([item]);
        }
      };
      reader.readAsText(file);
    });
  };

  const onDrop = (e) => {
    e.preventDefault();
    setDrag(false);
    processFiles(e.dataTransfer.files);
  };

  const guessCuenta = (text) => {
    const n = (text || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const hasClave = (...keys) => keys.some(k => n.includes(k));
    // Vuelo / boleto aéreo — ANTES que aeropuerto genérico
    if (/(aeromexico|volaris|vivaaerobus|viva aerobus|magnicharter|aeromar|interjet|american airlines|united airlines|delta air|vuelo|boleto aereo|boleto de avion|pasaje aereo|transporte aereo|billete de pasaje)/.test(n)
        || hasClave("78101801","78101802","78101804","78101806")) return ["6122900001", 0.96];
    // TUA — siempre antes que hospedaje/aeropuerto genérico
    if (/(\btua\b|tarifa de uso de aeropuerto|asur|\baifa\b|\boma\b|gap aeropuertos|omaaero|aerostar|servicios aeroportuarios|derechos de aeropuerto)/.test(n)
        || hasClave("78101803")) return ["6122700001", 0.95];
    // Peaje / caseta
    if (/(caseta|peaje|capufe|autopista|cuota carretera|farac|concessia|viapass|iave|tag vial|televia)/.test(n)
        || hasClave("78111601")) return ["6122900002", 0.95];
    // Hospedaje
    if (/(hotel|hospedaje|posada|marriott|fiesta inn|holiday inn|city express|hilton|sheraton|camino real|best western|hampton inn|courtyard|aloft|novotel|ibis|westin|hyatt|noches de hospedaje|renta de cuarto|alojamiento)/.test(n)
        || hasClave("90111501","90111502","90111503")) return ["6122900003", 0.95];
    // Estacionamiento
    if (/(estacionamiento|parking|parquimetro|pension de auto|valet parking|cajones de estacionamiento)/.test(n)
        || hasClave("78112101")) return ["6122900004", 0.94];
    // Alimentos / comidas
    if (/(restaurante|restaurant|alimento|comida|desayuno|cena|almuerzo|cafeteria|consumo en |fonda |buffet|taqueria|mariscos|sushi|pizz|burger|kfc|mcdonalds|starbucks|vips|sanborns|italiannis)/.test(n)
        || hasClave("91111701","91111702")) return ["6122900005", 0.93];
    // Renta de vehículo
    if (/(hertz|sixt|avis|alamo|enterprise|budget|national car|renta de auto|arrendamiento de vehic|renta vehicular|renta de vehiculo|auto renta)/.test(n)
        || hasClave("78111801","78111802")) return ["6122900006", 0.94];
    // Gasolina / combustible
    if (/(pemex|\bbp\b|\bshell\b|gasolina|\bmagna\b|\bpremium\b|\bdiesel\b|combustible|litros de|lts de |estacion de servicio|gas lp)/.test(n)
        || hasClave("15101500","15101501","15101503","15101505")) return ["6120800001", 0.96];
    return ["6121200001", 0.50]; // No deducibles — requiere revisión manual
  };

  const parseCFDI = (xmlText) => {
    try {
      const doc = new DOMParser().parseFromString(xmlText, "application/xml");
      if (doc.querySelector("parsererror")) return null;

      // Helper: busca elemento ignorando prefijo de namespace (cfdi:, tfd:, etc.)
      const qn = (parent, localName) => {
        let el = parent.querySelector(localName);
        if (el) return el;
        const all = parent.getElementsByTagName("*");
        for (let i = 0; i < all.length; i++) {
          if (all[i].localName === localName) return all[i];
        }
        return null;
      };
      const qnAll = (parent, localName) => {
        const results = [];
        const all = parent.getElementsByTagName("*");
        for (let i = 0; i < all.length; i++) {
          if (all[i].localName === localName) results.push(all[i]);
        }
        return results;
      };
      const attr = (el, ...names) => {
        if (!el) return "";
        for (const n of names) {
          const v = el.getAttribute(n) || el.getAttribute(n.toLowerCase()) || el.getAttribute(n[0].toUpperCase()+n.slice(1));
          if (v) return v;
        }
        return "";
      };

      const comp = qn(doc, "Comprobante") || doc.documentElement;
      const total    = parseFloat(attr(comp, "Total", "total") || "0");
      const subtotal = parseFloat(attr(comp, "SubTotal", "Subtotal", "subtotal") || "0");
      const fechaAttr = attr(comp, "Fecha", "fecha");
      const fecha = fechaAttr ? new Date(fechaAttr) : new Date();

      const emisorEl = qn(doc, "Emisor");
      const emisor   = attr(emisorEl, "Nombre", "nombre") || attr(emisorEl, "Rfc", "rfc") || "";
      const rfc      = attr(emisorEl, "Rfc", "rfc") || "";

      const conceptoEls = qnAll(doc, "Concepto");
      const conceptos = conceptoEls.map(c => attr(c, "Descripcion", "descripcion")).filter(Boolean);
      const conceptoStr = conceptos.join(" · ").slice(0, 120) || "—";
      const claveProdServ = conceptoEls.map(c => attr(c, "ClaveProdServ", "claveProdServ", "claveprodserv")).filter(Boolean).join(" ");

      let iva = 0;
      qnAll(doc, "Traslado").forEach(t => {
        const imp = attr(t, "Impuesto", "impuesto");
        if (imp === "002" || imp.toUpperCase() === "IVA") {
          iva += parseFloat(attr(t, "Importe", "importe") || "0") || 0;
        }
      });
      if (!iva && total && subtotal) iva = Math.round((total - subtotal) * 100) / 100;

      const tfd = qn(doc, "TimbreFiscalDigital");
      let uuid = attr(tfd, "UUID", "uuid") || "";
      const uuidDisplay = uuid ? uuid.toUpperCase().slice(0, 18) + "…" : "Sin UUID";

      // Clasificar usando emisor + conceptos + claves SAT + RFC
      const matchText = (emisor + " " + conceptoStr + " " + claveProdServ + " " + rfc).toLowerCase();
      const [cuenta, conf] = guessCuenta(matchText);

      return {
        uuid: uuidDisplay,
        uuidFull: uuid.toUpperCase() || "",
        emisor: emisor || rfc || "Emisor desconocido",
        concepto: conceptoStr,
        subtotal: Math.round(subtotal * 100) / 100,
        iva: Math.round(iva * 100) / 100,
        total: Math.round(total * 100) / 100,
        fecha, cuenta, confianza: conf,
      };
    } catch (err) {
      console.error("CFDI parse error", err);
      return null;
    }
  };
  return (
    <>
      <div
        className={`dropzone ${drag ? "drag" : ""}`}
        onDragOver={e => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={onDrop}
        onClick={() => inputRef.current?.click()}
        style={{cursor:"pointer"}}
      >
        <div className="dropzone-icon"><Icon name="upload" size={20}/></div>
        <div className="dropzone-title">Arrastra XML + PDF de cada factura</div>
        <div className="dropzone-sub">El sistema extrae RFC, fecha, monto e IVA automáticamente · Acepta múltiples archivos</div>
        <div style={{marginTop:14}}>
          <button className="btn" onClick={(e) => { e.stopPropagation(); inputRef.current?.click(); }}>Seleccionar archivos</button>
        </div>
        <input ref={inputRef} type="file" multiple accept=".xml,.pdf,application/xml,application/pdf,text/xml"
          style={{display:"none"}}
          onChange={(e) => { if (e.target.files) processFiles(e.target.files); e.target.value = ""; }}
        />
      </div>
      {files.length > 0 && (
        <div style={{marginTop:14, display:"flex", gap:10, flexWrap:"wrap"}}>
          {files.map((f, i) => (
            <div key={i} className="file-chip" style={{flex:"1 1 240px"}}>
              <div className="icon-box">{f.type}</div>
              <div className="meta">
                <div className="name">{f.name}</div>
                <div className="sz">{(f.size/1024).toFixed(1)} KB · procesado</div>
              </div>
              <Icon name="check" size={14} style={{color:"var(--success)"}}/>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

function NuevaComprobacion({ setPage, userId = "U001" }) {
  const getPendientes = () => window.SOLICITUDES.filter(s =>
    s.tipo === "anticipo" && s.usuario === userId &&
    ["liberado","parcial"].includes(s.status) &&
    (s.saldoPendiente||0) > 0
  );
  const [pendientes, setPendientes] = React.useState(getPendientes);
  const [anticipoSel, setAnticipoSel] = React.useState(null);
  const [items, setItems] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [editId, setEditId]   = React.useState(null);
  const [toast, setToast]     = React.useState(null);
  const [enviado, setEnviado] = React.useState(false);

  // Recargar desde Supabase al montar — garantiza datos frescos
  React.useEffect(() => {
    setLoading(true);
    (async () => {
      if (window.sb) {
        const { data } = await window.sb.from("solicitudes")
          .select("*")
          .eq("usuario_id", userId)
          .eq("tipo", "anticipo")
          .in("status", ["liberado","parcial"]);
        // Nota: filtramos saldo_pendiente > 0 en JS porque puede ser null en Supabase
        if (data && data.length > 0) {
          const mapped = data
            .filter(s => (parseFloat(s.saldo_pendiente)||parseFloat(s.monto)||0) > 0)
            .map(s => ({
              id: s.id, tipo: s.tipo, concepto: s.concepto,
              usuario: s.usuario_id, monto: parseFloat(s.monto)||0,
              fecha: new Date(s.fecha), status: s.status,
              // Si saldo_pendiente es null usar monto completo
              saldoPendiente: parseFloat(s.saldo_pendiente) || parseFloat(s.monto) || 0,
            }));
          // Merge with SOLICITUDES
          mapped.forEach(m => {
            const idx = window.SOLICITUDES.findIndex(x => x.id === m.id);
            if (idx >= 0) Object.assign(window.SOLICITUDES[idx], m);
            else window.SOLICITUDES.unshift(m);
          });
          setPendientes(mapped);
        } else {
          setPendientes(getPendientes());
        }
      } else {
        setPendientes(getPendientes());
      }
      setLoading(false);
    })();
  }, [userId]);

  if (!anticipoSel) {
    return (
      <>
        <div className="page-head">
          <div>
            <h1 className="page-title">Comprobaciones</h1>
            <div className="page-sub">Selecciona el anticipo del que vas a comprobar gastos</div>
          </div>
          <button className="btn ghost" onClick={() => setPage && setPage("dash")}>Cancelar</button>
        </div>

        <div className="card" style={{marginBottom:14}}>
          <div className="card-head">
            <div>
              <h3 className="card-title">Anticipos pendientes de comprobar ({pendientes.length})</h3>
              <div className="card-sub">Anticipos autorizados o liberados con saldo abierto</div>
            </div>
          </div>
          {pendientes.length === 0 ? (
            <div className="muted" style={{fontSize:12.5, padding:"4px 0"}}>No tienes anticipos pendientes de comprobar.</div>
          ) : (
            <div className="table-wrap" style={{border:"none"}}>
              <table className="t">
                <thead><tr><th>Folio</th><th>Concepto</th><th>Fecha</th><th className="right">Anticipo</th><th className="right">Saldo</th><th>Status</th><th></th></tr></thead>
                <tbody>
                  {pendientes.map(a => (
                    <tr key={a.id} onClick={() => setAnticipoSel(a)}>
                      <td className="id-cell">{a.id}</td>
                      <td>{a.concepto}</td>
                      <td className="muted mono" style={{fontSize:12}}>{window.fmtFecha(a.fecha)}</td>
                      <td className="num">{window.fmtMXN(a.monto)}</td>
                      <td className="num"><strong>{window.fmtMXN(a.saldoPendiente)}</strong></td>
                      <td><StatusBadge status={a.status}/></td>
                      <td className="right" onClick={e=>e.stopPropagation()}>
                        <div style={{display:"inline-flex",gap:6}}>
                          {a.status === "parcial" && (
                            <button className="btn sm ghost" onClick={()=>{
                              window.CIERRE_ANT_ID = a.id;
                              setPage && setPage("cerrar-anticipo");
                            }}>
                              <Icon name="x" size={12}/> Cerrar
                            </button>
                          )}
                          <button className="btn sm primary" onClick={()=>setAnticipoSel(a)}>
                            Comprobar <Icon name="chevR" size={12}/>
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        <div className="card">
          <div className="card-head">
            <div>
              <h3 className="card-title">¿Sin anticipo previo?</h3>
              <div className="card-sub">Si pagaste de tu bolsa sin pedir anticipo, solicita un reembolso.</div>
            </div>
            <button className="btn" onClick={() => setPage && setPage("reembolsos")}><Icon name="refund" size={13}/> Ir a reembolsos</button>
          </div>
        </div>
      </>
    );
  }
  const updItem = (id, k, v) => setItems(items.map(i => i.id === id ? { ...i, [k]: k === "total" || k === "subtotal" || k === "iva" ? parseFloat(v) || 0 : v } : i));
  const delItem = (id) => setItems(items.filter(i => i.id !== id));
  const total = items.reduce((a,i) => a + i.total, 0);
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2500); };
  const handleEnviar = async () => {
    if (enviado) return;
    if (items.length === 0) { showToast("⚠ Agrega al menos un comprobante antes de enviar"); return; }
    const totalComp = items.reduce((a, i) => a + (i.total || 0), 0);
    const saldoActual = anticipoSel ? (anticipoSel.saldoPendiente || anticipoSel.monto) : 0;

    // Validar que no exceda el saldo disponible
    if (anticipoSel && totalComp > saldoActual + 0.01) {
      showToast(`⚠ El total ($${totalComp.toFixed(2)}) excede el saldo disponible ($${saldoActual.toFixed(2)})`);
      return;
    }

    const id = "CMP-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-4);
    // Saldo "disponible para comprobar" — descuenta también comprobaciones pendientes
    // pero el saldo CONTABLE del anticipo solo cambia cuando tesorería libera la comprobación
    const otrasComprobsPendientes = window.SOLICITUDES.filter(s =>
      s.tipo === "comprobacion" && s.anticipoRef === anticipoSel?.id &&
      s.id !== id && ["solicitado","autorizado"].includes(s.status)
    ).reduce((a,s) => a + s.monto, 0);
    const saldoDisponible = saldoActual - otrasComprobsPendientes;
    const restante = saldoDisponible - totalComp;

    // Persistir comprobación en Supabase
    if (window.sb) {
      const { error } = await window.sb.from("solicitudes").insert({
        id, tipo: "comprobacion",
        concepto: "Comprobación " + (anticipoSel ? anticipoSel.id : ""),
        usuario_id: userId, monto: totalComp,
        status: "solicitado",
        anticipo_ref: anticipoSel ? anticipoSel.id : null,
        comprobantes: items.length,
        saldo_pendiente: 0,
        fecha: new Date().toISOString(),
      });
      if (error) { showToast("⚠ Error al enviar: " + error.message); return; }

      // Guardar CFDIs
      if (items.length > 0) {
        await window.sb.from("comprobantes_cfdi").insert(
          items.map(it => ({
            solicitud_id: id,
            uuid: it.uuidFull || it.uuid || ("SIN-UUID-" + Date.now()),
            emisor: it.emisor, concepto: it.concepto,
            subtotal: it.subtotal||0, iva: it.iva||0, total: it.total||0,
            cuenta: it.cuenta, confianza: it.confianza||0.9,
          }))
        );
      }
      // NO actualizamos saldo_pendiente del anticipo padre aquí
      // Se actualizará cuando tesorería libere la comprobación
    }

    const nuevoSaldo = Math.max(0, restante);  // solo para UI local
    const nuevoStatus = "parcial";  // marca que hay comprobaciones en proceso

    // Actualizar en memoria local
    const nueva = {
      id, tipo: "comprobacion",
      concepto: "Comprobación " + (anticipoSel ? anticipoSel.id : ""),
      usuario: userId, monto: totalComp, fecha: new Date(),
      status: "solicitado", anticipoRef: anticipoSel ? anticipoSel.id : null,
      comprobantes: items.length, cfdi: items, saldoPendiente: 0,
    };
    window.SOLICITUDES.unshift(nueva);

    if (anticipoSel) {
      const ant = window.SOLICITUDES.find(s => s.id === anticipoSel.id);
      if (ant) {
        ant.saldoPendiente = nuevoSaldo;
        ant.status = nuevoStatus;
      }
      // Si queda saldo: actualizar pendientes con nuevo saldo; si no: remover
      if (nuevoSaldo > 0) {
        setPendientes(prev => prev.map(p =>
          p.id === anticipoSel.id ? {...p, saldoPendiente: nuevoSaldo, status: "parcial"} : p
        ));
        // Volver a la selección de anticipo para seguir comprobando
        setAnticipoSel(null);
        setItems([]);
        setEnviado(false);
        showToast("✓ Comprobación " + id + " enviada · Saldo restante: $" + nuevoSaldo.toFixed(2));
        return;
      } else {
        setPendientes(prev => prev.filter(p => p.id !== anticipoSel.id));
      }
    }

    setEnviado(true);
    showToast("✓ Comprobación " + id + " enviada · Anticipo comprobado al 100%");
    setTimeout(() => setPage && setPage("dash"), 1400);
  };
  const handleBorrador = () => {
    const id = `BOR-${Date.now().toString().slice(-6)}`;
    window.BORRADORES = window.BORRADORES || [];
    window.BORRADORES.push({ id, concepto: "Comprobación en captura", fecha: new Date(), tipo: "comprobacion", items });
    showToast(`✓ Borrador ${id} guardado · velo en "Comprobaciones"`);
  };
  const handleCancelar = () => setPage && setPage("dash");

  return (
    <>
      {toast && (
        <div style={{position:"fixed", bottom:24, right:24, background:"var(--success-soft)", border:"1px solid oklch(from var(--success) l c h / 0.4)", color:"var(--success)", padding:"12px 18px", borderRadius:"var(--r-lg)", zIndex:100, fontWeight:500, fontSize:13}}>
          {toast}
        </div>
      )}
      <div className="page-head">
        <div>
          <button className="btn sm ghost" onClick={() => setAnticipoSel(null)} style={{marginBottom:8}}><Icon name="chevR" size={11} style={{transform:"rotate(180deg)"}}/> Volver a anticipos</button>
          <h1 className="page-title">Comprobar {anticipoSel.id}</h1>
          <div className="page-sub">{anticipoSel.concepto} · saldo {window.fmtMXN(anticipoSel.saldoPendiente)}</div>
        </div>
        <div className="row">
          <button className="btn ghost" onClick={handleCancelar}>Cancelar</button>
          <button className="btn" onClick={handleBorrador}>Guardar borrador</button>
          <button className="btn primary" onClick={handleEnviar}>Enviar a autorización</button>
        </div>
      </div>

      <div className="two-col">
        <div>
          <div className="card" style={{marginBottom:14}}>
            <h3 className="card-title" style={{marginBottom:14}}>Sube tus comprobantes</h3>
            <CompUploader onAdd={(newItems) => { setItems(prev => [...prev, ...newItems]); showToast(`✓ ${newItems.length} archivo${newItems.length>1?"s":""} procesado${newItems.length>1?"s":""}`); }}/>
          </div>

          <div className="card">
            <div className="card-head">
              <div>
                <h3 className="card-title">Comprobantes detectados</h3>
                <div className="card-sub">{items.length} facturas · IVA y cuenta sugeridos automáticamente</div>
              </div>
              <div className="row">
                <span className="muted" style={{fontSize:12}}>Total comprobado</span>
                <strong className="mono" style={{fontSize:16}}>{window.fmtMXN(total)}</strong>
              </div>
            </div>
            <div className="table-wrap" style={{border:"none"}}>
              <table className="t">
                <thead>
                  <tr>
                    <th>UUID</th>
                    <th>Emisor</th>
                    <th>Concepto</th>
                    <th className="right">Total</th>
                    <th>Cuenta sugerida</th>
                    <th>Confianza</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {items.map(c => {
                    const cuenta = window.findCuenta(c.cuenta) || { cuenta: c.cuenta || "—", nombre: "Sin clasificar", grupo: "—" };
                    const editing = editId === c.id;
                    if (editing) {
                      return (
                        <tr key={c.id} style={{background:"var(--surface-2)"}}>
                          <td className="id-cell">{c.uuid}</td>
                          <td><input className="input" value={c.emisor} onChange={e => updItem(c.id, "emisor", e.target.value)}/></td>
                          <td><input className="input" value={c.concepto} onChange={e => updItem(c.id, "concepto", e.target.value)}/></td>
                          <td><input className="input mono" style={{textAlign:"right"}} value={c.total} onChange={e => updItem(c.id, "total", e.target.value)}/></td>
                          <td>
                            <select className="select" value={c.cuenta} onChange={e => updItem(c.id, "cuenta", e.target.value)}>
                              {window.CATALOGO_GASTOS.map(g => <option key={g.cuenta} value={g.cuenta}>{g.cuenta} · {g.nombre}</option>)}
                            </select>
                          </td>
                          <td><span className="muted" style={{fontSize:11}}>—</span></td>
                          <td className="right">
                            <div style={{display:"inline-flex", gap:4}}>
                              <button className="icon-btn" onClick={() => setEditId(null)} title="Guardar"><Icon name="check" size={13}/></button>
                              <button className="icon-btn" onClick={() => delItem(c.id)} title="Eliminar"><Icon name="x" size={13}/></button>
                            </div>
                          </td>
                        </tr>
                      );
                    }
                    return (
                      <tr key={c.id}>
                        <td className="id-cell">{c.uuid}</td>
                        <td>{c.emisor}</td>
                        <td className="muted">{c.concepto}</td>
                        <td className="num">{window.fmtMXN(c.total)}</td>
                        <td>
                          <div style={{display:"flex", flexDirection:"column", gap:2}}>
                            <span style={{fontSize:12.5}}>{cuenta.nombre}</span>
                            <span className="mono muted" style={{fontSize:11}}>{cuenta.cuenta}</span>
                          </div>
                        </td>
                        <td>
                          <div className={`conf ${c.confianza < 0.9 ? "warn" : ""}`}>
                            <div className="meter"><div className="fill" style={{width: `${c.confianza*100}%`}}></div></div>
                            {Math.round(c.confianza*100)}%
                          </div>
                        </td>
                        <td className="right">
                          <button className="icon-btn" onClick={() => setEditId(c.id)} title="Editar"><Icon name="settings" size={13}/></button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div>
          <div className="card" style={{marginBottom:14}}>
            <h3 className="card-title">Resumen</h3>
            <div className="divider" style={{margin:"12px 0"}}></div>
            <div className="spread"><span className="muted">Anticipo recibido</span><strong className="mono">{window.fmtMXN(anticipoSel.monto)}</strong></div>
            <div className="spread" style={{marginTop:8}}><span className="muted">Total comprobado</span><strong className="mono">{window.fmtMXN(total)}</strong></div>
            <div className="divider"></div>
            <div className="spread">
              <span style={{fontWeight:600}}>Saldo a devolver</span>
              <strong className="mono" style={{fontSize:18, color:"var(--accent)"}}>{window.fmtMXN(anticipoSel.monto - total)}</strong>
            </div>
            <div className="card-sub" style={{marginTop:6}}>El usuario debe depositar este monto a tesorería</div>
          </div>

          <div className="card">
            <h3 className="card-title">Por cuenta contable</h3>
            <div className="divider" style={{margin:"12px 0"}}></div>
            {(() => {
              const groups = {};
              items.forEach(c => { groups[c.cuenta] = (groups[c.cuenta] || 0) + c.total; });
              return Object.entries(groups).map(([cuenta, monto]) => {
                const meta = window.findCuenta(cuenta);
                return (
                  <div key={cuenta} className="spread" style={{padding:"6px 0"}}>
                    <div>
                      <div style={{fontSize:13}}>{meta.nombre}</div>
                      <div className="mono muted" style={{fontSize:11}}>{cuenta}</div>
                    </div>
                    <strong className="mono">{window.fmtMXN(monto)}</strong>
                  </div>
                );
              });
            })()}
          </div>
        </div>
      </div>
    </>
  );
}

function Reembolsos({ userId, setPage }) {
  const [, forceR] = React.useReducer(x=>x+1, 0);
  React.useEffect(() => {
    if (!userId || !window.loadUserSolicitudes) return;
    window.loadUserSolicitudes(userId).then(fresh => {
      fresh.forEach(m => {
        const ix = window.SOLICITUDES.findIndex(x => x.id === m.id);
        if (ix >= 0) Object.assign(window.SOLICITUDES[ix], m);
        else window.SOLICITUDES.unshift(m);
      });
      forceR();
    });
  }, [userId]);
  const mine = window.SOLICITUDES.filter(s => s.usuario === userId && s.tipo === "reembolso");
  const all = window.SOLICITUDES.filter(s => s.tipo === "reembolso");
  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">Reembolsos</h1>
          <div className="page-sub">Gastos que pagaste de tu bolsa sin anticipo previo</div>
        </div>
        <button className="btn primary" onClick={()=>setPage&&setPage("nuevo-reembolso")}><Icon name="plus" size={14}/> Nuevo reembolso</button>
      </div>

      {(() => {
        const enFlujo   = mine.filter(s => ["solicitado","autorizado","liberado"].includes(s.status));
        const pagados   = mine.filter(s => s.status === "liberado");
        const anio      = new Date().getFullYear();
        const pagadosAnio = mine.filter(s => s.status === "liberado" && s.fecha.getFullYear() === anio);
        const totalFlujo = enFlujo.reduce((a,s)=>a+s.monto,0);
        const totalPagado = pagadosAnio.reduce((a,s)=>a+s.monto,0);
        return (
          <div className="kpi-grid" style={{gridTemplateColumns:"repeat(3, 1fr)"}}>
            <div className="kpi">
              <div className="kpi-label">En flujo</div>
              <div className="kpi-value">{window.fmtMXN(totalFlujo)}</div>
              <div className="kpi-delta neutral">{enFlujo.length} solicitud{enFlujo.length!==1?"es":""}</div>
            </div>
            <div className="kpi">
              <div className="kpi-label">Reembolsado este año</div>
              <div className="kpi-value" style={{color:"var(--success)"}}>{window.fmtMXN(totalPagado)}</div>
              <div className="kpi-delta up">{pagadosAnio.length} solicitudes pagadas</div>
            </div>
            <div className="kpi">
              <div className="kpi-label">Total mis reembolsos</div>
              <div className="kpi-value">{mine.length}</div>
              <div className="kpi-delta neutral">historial completo</div>
            </div>
          </div>
        );
      })()}

      <div className="card">
        <div className="card-head">
          <h3 className="card-title">Mis reembolsos</h3>
          <div className="row">
            <button className="btn sm"><Icon name="filter" size={12}/> Filtros</button>
            <button className="btn sm"><Icon name="download" size={12}/> Exportar</button>
          </div>
        </div>
        <div className="table-wrap" style={{border:"none"}}>
          <table className="t">
            <thead>
              <tr>
                <th>Folio</th>
                <th>Concepto</th>
                <th>Fecha</th>
                <th className="right">Monto</th>
                <th>Status</th>
                <th>Comprobantes</th>
              </tr>
            </thead>
            <tbody>
              {all.map(r => (
                <tr key={r.id}>
                  <td className="id-cell">{r.id}</td>
                  <td>
                    <div>{r.concepto}</div>
                    {r.motivoRechazo && <div style={{color:"var(--danger)", fontSize:11.5, marginTop:2}}>⚠ {r.motivoRechazo}</div>}
                  </td>
                  <td className="muted mono" style={{fontSize:12}}>{window.fmtFecha(r.fecha)}</td>
                  <td className="num">{window.fmtMXN(r.monto)}</td>
                  <td><StatusBadge status={r.status}/></td>
                  <td className="muted mono" style={{fontSize:12}}>{r.comprobantes} archivos</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

function NuevoReembolso({ setPage, userId }) {
  const uid = userId || "U001";
  const [items, setItems] = React.useState([]);
  const [concepto, setConcepto] = React.useState("");
  const [toast, setToast] = React.useState(null);
  const [enviado, setEnviado] = React.useState(false);
  const showToast = (msg, ok=true) => { setToast({msg,ok}); setTimeout(()=>setToast(null),3000); };

  const handleEnviar = async () => {
    if (!concepto.trim()) { showToast("Agrega un concepto", false); return; }
    if (items.length === 0) { showToast("Agrega al menos un comprobante", false); return; }
    if (enviado) return;
    const total = items.reduce((a,i)=>a+(i.total||0),0);
    const id = "REM-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-4);
    const u = window.findUser(uid);
    // Persistir en Supabase
    if (window.sb) {
      const row = {
        id, tipo:"reembolso", concepto,
        usuario_id: uid, monto: total,
        status:"solicitado", saldo_pendiente:0,
        centro_id: u?.centro || null,
        comprobantes: items.length,
        fecha: new Date().toISOString(),
      };
      const { error } = await window.sb.from("solicitudes").insert(row);
      if (error) { showToast("Error al guardar: " + error.message, false); return; }
      // Guardar CFDIs
      if (items.length > 0) {
        const cfdiRows = items.map(it => ({
          solicitud_id: id, uuid: it.uuid||it.uuidFull||("SIN-UUID-"+Date.now()),
          emisor: it.emisor, concepto: it.concepto,
          subtotal: it.subtotal||0, iva: it.iva||0, total: it.total||0,
          cuenta: it.cuenta, confianza: it.confianza||0.9,
        }));
        await window.sb.from("comprobantes_cfdi").insert(cfdiRows);
      }
    }
    const nueva = {
      id, tipo:"reembolso", concepto, usuario:uid,
      monto:total, fecha:new Date(), status:"solicitado",
      comprobantes:items.length, cfdi:items, saldoPendiente:0,

      <div className="card" style={{marginBottom:14}}>
        <div className="card-head">
          <h3 className="card-title">Comprobantes (CFDI)</h3>

            <tfoot><tr>
              <td colSpan={3} style={{textAlign:"right",fontWeight:600,padding:"8px 10px"}}>Total</td>
              <td className="num" style={{fontWeight:700}}>{window.fmtMXN(items.reduce((a,i)=>a+(i.total||0),0))}</td>

          <Icon name="check" size={14}/> {enviado?"Enviando…":"Enviar reembolso"}
        </button>
      </div>
    </>
  );
}

function CierreAnticipo({ setPage, userId, anticipoId }) {
  const [anticipo, setAnticipo] = React.useState(null);
  const [file, setFile] = React.useState(null);
  const [fileUrl, setFileUrl] = React.useState(null);
  const [referencia, setReferencia] = React.useState("");
  const [fechaDeposito, setFechaDeposito] = React.useState(new Date().toISOString().slice(0,10));
  const [enviado, setEnviado] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const showToast = (msg, ok=true) => { setToast({msg,ok}); setTimeout(()=>setToast(null),3000); };

  React.useEffect(() => {
    const ant = window.SOLICITUDES.find(s => s.id === anticipoId);
    if (ant) setAnticipo(ant);
  }, [anticipoId]);

  const onFile = (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    setFile(f);
    setFileUrl(URL.createObjectURL(f));
  };

  const handleCerrar = async () => {
    if (!anticipo) return;
    if (!file) { showToast("⚠ Sube el comprobante de depósito", false); return; }
    if (!referencia.trim()) { showToast("⚠ Captura la referencia bancaria", false); return; }
    if (enviado) return;

    const saldo = anticipo.saldoPendiente || 0;
    const id = "DEP-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-4);
    const u = window.findUser(userId);

    setEnviado(true);

    // Subir archivo a Supabase Storage
    let archivoUrl = null;
    if (window.sb && file) {
      const ext = file.name.split(".").pop();
      const path = `cierres/${anticipoId}/${id}.${ext}`;
      const { error: upErr } = await window.sb.storage.from("comprobantes").upload(path, file);
      if (upErr) { showToast("Error subiendo archivo: "+upErr.message, false); setEnviado(false); return; }
      const { data: { publicUrl } } = window.sb.storage.from("comprobantes").getPublicUrl(path);
      archivoUrl = publicUrl;
    }

    // Crear solicitud tipo "deposito" en Supabase
    if (window.sb) {
      const { error } = await window.sb.from("solicitudes").insert({
        id, tipo: "comprobacion",
        concepto: `[CIERRE] Reintegro de saldo · ${anticipoId}`,
        usuario_id: userId, monto: saldo,
        status: "solicitado",
        anticipo_ref: anticipoId,
        centro_id: u?.centro || null,
        saldo_pendiente: 0,
        notas: `CIERRE_DEPOSITO · Ref: ${referencia.trim()} · Fecha: ${fechaDeposito}` + (archivoUrl ? ` · URL: ${archivoUrl}` : ""),
        fecha: new Date().toISOString(),
      });
      if (error) { showToast("Error: "+error.message, false); setEnviado(false); return; }
    }

    // Actualizar en memoria
    window.SOLICITUDES.unshift({
      id, tipo:"comprobacion",
      concepto: `[CIERRE] Reintegro de saldo · ${anticipoId}`,
      usuario: userId, monto: saldo, fecha: new Date(),
      status: "solicitado", anticipoRef: anticipoId,
      saldoPendiente: 0,
      notas: `CIERRE_DEPOSITO · Ref: ${referencia.trim()}`,
      archivoUrl,
      esCierre: true,
    });

    showToast("✓ Comprobante enviado. Pendiente de validación por tesorería");
    setTimeout(() => setPage && setPage("dash"), 1600);
  };

  if (!anticipo) return <div style={{padding:24}}>Cargando…</div>;

  return (
    <>
      {toast && <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",
        zIndex:999,background:toast.ok?"var(--success)":"var(--danger)",color:"#fff",
        padding:"8px 20px",borderRadius:20,fontSize:13,fontWeight:500,
        boxShadow:"0 4px 16px rgba(0,0,0,.3)",maxWidth:380,textAlign:"center"}}>{toast.msg}</div>}
      <div className="page-head">
        <div>
          <h1 className="page-title">Cerrar anticipo</h1>
          <div className="page-sub">Reintegra el saldo no comprobado con un depósito bancario</div>
        </div>
        <button className="btn ghost" onClick={()=>setPage&&setPage("comprobaciones")}>
          <Icon name="x" size={14}/> Cancelar
        </button>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div className="card-head">
          <h3 className="card-title">Resumen del anticipo</h3>
        </div>
        <div className="kpi-grid" style={{gridTemplateColumns:"repeat(3, 1fr)"}}>
          <div className="kpi">
            <div className="kpi-label">Folio</div>
            <div className="kpi-value" style={{fontSize:18}}>{anticipo.id}</div>
          </div>
          <div className="kpi">
            <div className="kpi-label">Monto original</div>
            <div className="kpi-value">{window.fmtMXN(anticipo.monto)}</div>
          </div>
          <div className="kpi">
            <div className="kpi-label">Saldo a reintegrar</div>
            <div className="kpi-value" style={{color:"var(--warn)"}}>{window.fmtMXN(anticipo.saldoPendiente)}</div>
          </div>
        </div>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div className="card-head">
          <h3 className="card-title">Datos del depósito</h3>
          <div className="card-sub">Captura los datos bancarios del reintegro</div>
        </div>
        <div className="form-grid cols-2" style={{gap:12}}>
          <div className="field">
            <label>Referencia bancaria</label>
            <input className="input" value={referencia} onChange={e=>setReferencia(e.target.value)}
              placeholder="No. de transferencia / referencia SPEI"/>
          </div>
          <div className="field">
            <label>Fecha del depósito</label>
            <input className="input" type="date" value={fechaDeposito} onChange={e=>setFechaDeposito(e.target.value)}/>
          </div>
        </div>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div className="card-head">
          <h3 className="card-title">Comprobante de depósito</h3>
          <div className="card-sub">Adjunta el ticket, captura del banco o XML de pago</div>
        </div>
        <div style={{padding:16, border:"2px dashed var(--border)", borderRadius:8, textAlign:"center"}}>
          {!file ? (
            <>
              <input type="file" id="file-deposito" style={{display:"none"}}
                accept="image/*,application/pdf,.xml"
                onChange={onFile}/>
              <label htmlFor="file-deposito" className="btn ghost" style={{cursor:"pointer"}}>
                <Icon name="upload" size={14}/> Subir comprobante
              </label>
              <div style={{fontSize:11, color:"var(--text-3)", marginTop:8}}>
                JPG, PNG, PDF o XML
              </div>
            </>
          ) : (
            <div>
              <div style={{display:"flex", alignItems:"center", gap:10, justifyContent:"center"}}>
                <Icon name="check" size={16} style={{color:"var(--success)"}}/>
                <span style={{fontSize:13}}>{file.name}</span>
                <button className="icon-btn" onClick={()=>{setFile(null); setFileUrl(null);}}>
                  <Icon name="x" size={12}/>
                </button>
              </div>
              {fileUrl && file.type.startsWith("image/") && (
                <img src={fileUrl} alt="preview" style={{maxWidth:"100%",maxHeight:200,marginTop:12,borderRadius:6}}/>
              )}
            </div>
          )}
        </div>
      </div>

      <div style={{display:"flex", justifyContent:"flex-end", gap:10}}>
        <button className="btn ghost" onClick={()=>setPage&&setPage("comprobaciones")}>Cancelar</button>
        <button className="btn primary" onClick={handleCerrar} disabled={enviado}>
          <Icon name="check" size={14}/> {enviado?"Enviando…":"Enviar comprobante y cerrar"}
        </button>
      </div>
    </>
  );
}

Object.assign(window, { UserDashboard, SolicitarAnticipo, NuevaComprobacion, Reembolsos, NuevoReembolso, CierreAnticipo });

function GerenteBandeja({ openDetail, userId, role }) {
  const CENTRO_ADMIN = "100010009";
  const userObj = userId ? window.findUser(userId) : null;
  const esAdmin = !role || role === "admin" ||
    (userObj && userObj.centro === CENTRO_ADMIN);
  const gerenteId = userId || "U101";
  const teamIds = esAdmin
    ? null  // admin de área ve todas las solicitudes
    : window.USUARIOS.filter(u => u.gerente === gerenteId).map(u => u.id);

  const [items, setItems] = React.useState(() =>
    window.SOLICITUDES.filter(s => s.status === "solicitado" && (teamIds === null || teamIds.includes(s.usuario)))
  );
  const [filtro, setFiltro]     = React.useState("todas");
  const [busqueda, setBusqueda] = React.useState("");
  const [toast, setToast]       = React.useState(null);
  const [rechazoModal, setRechazoModal] = React.useState(null);
  const [detalleRapido, setDetalleRapido] = React.useState(null);

  // Recargar pendientes desde Supabase al montar
  React.useEffect(() => {
    if (!window.sb) return;
    let query = window.sb.from("solicitudes").select("*").eq("status","solicitado");
    if (teamIds) query = query.in("usuario_id", teamIds);
    query.order("fecha",{ascending:false}).then(({data})=>{
      if (!data) return;
      const mapped = data.map(s=>({
        id:s.id, tipo:s.tipo, concepto:s.concepto, usuario:s.usuario_id,
        monto:parseFloat(s.monto)||0, fecha:new Date(s.fecha), status:s.status,
        saldoPendiente:parseFloat(s.saldo_pendiente)||0,
      }));
      mapped.forEach(m=>{
        const ix=window.SOLICITUDES.findIndex(x=>x.id===m.id);
        if(ix>=0) Object.assign(window.SOLICITUDES[ix],m);
        else window.SOLICITUDES.unshift(m);
      });
      setItems(mapped);
    });
  }, [userId]);

  const showToast = (msg, tipo = "ok") => {
    setToast({ msg, tipo });
    setTimeout(() => setToast(null), 3200);
  };

  // ── Aprobar ────────────────────────────────────────────────────────────
  const aprobar = async (id, e) => {
    e.stopPropagation();
    const s = window.SOLICITUDES.find(x => x.id === id);
    if (!s) return;
    if (window.sb) {
      const updateRow = { status: "autorizado" };
      if (s.tipo === "anticipo") updateRow.saldo_pendiente = s.monto;
      const { error, data } = await window.sb.from("solicitudes")
        .update(updateRow).eq("id", id).select();
      console.log("aprobar result:", data, error);
      if (error) { showToast("Error al autorizar: " + error.message); return; }
      if (!data || data.length === 0) {
        showToast("⚠ Sin permisos para autorizar esta solicitud (RLS)"); return;
      }
    }
    s.status = "autorizado";
    if (s.tipo === "anticipo") s.saldoPendiente = s.saldoPendiente || s.monto;
    setItems(prev => prev.filter(x => x.id !== id));
    showToast(`✓ ${id} autorizado y enviado a Tesorería`);
  };

  // ── Rechazo ────────────────────────────────────────────────────────────
  const abrirRechazo = (id, e) => {
    e.stopPropagation();
    setRechazoModal({ id, motivo: "" });
  };
  const confirmarRechazo = async () => {
    if (!rechazoModal.motivo.trim()) return;
    const sid = rechazoModal.id;
    const motivo = rechazoModal.motivo.trim();
    if (window.sb) {
      const { error } = await window.sb.from("solicitudes").update({
        status: "rechazado", motivo_rechazo: motivo, saldo_pendiente: 0
      }).eq("id", sid);
      if (error) { showToast("Error: " + error.message); return; }
    }
    const s = window.SOLICITUDES.find(x => x.id === sid);
    if (s) { s.status = "rechazado"; s.motivoRechazo = motivo; s.saldoPendiente = 0; }
    setItems(prev => prev.filter(x => x.id !== sid));
    showToast(`Solicitud ${sid} rechazada`, "warn");
    setRechazoModal(null);
  };

  // ── Exportar CSV ───────────────────────────────────────────────────────
  const exportar = () => {
    const rows = [["Folio","Tipo","Solicitante","Centro","Concepto","Fecha","Monto","Status"]];
    items.forEach(s => {
      const u = window.findUser(s.usuario);
      rows.push([s.id, s.tipo, u.nombre, u.centro, s.concepto,
        window.fmtFecha(s.fecha), s.monto, s.status]);
    });
    const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = `pendientes_gerente_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  // ── Filtrado ───────────────────────────────────────────────────────────
  const counts = {
    anticipo:     items.filter(s => s.tipo === "anticipo").length,
    comprobacion: items.filter(s => s.tipo === "comprobacion").length,
    reembolso:    items.filter(s => s.tipo === "reembolso").length,
  };
  const filtradas = items
    .filter(s => filtro === "todas" || s.tipo === filtro)
    .filter(s => {
      if (!busqueda.trim()) return true;
      const q = busqueda.toLowerCase();
      const u = window.findUser(s.usuario);
      return s.id.toLowerCase().includes(q) || s.concepto.toLowerCase().includes(q) || u.nombre.toLowerCase().includes(q);
    });

  return (
    <>
      {/* Toast */}
      {toast && (
        <div style={{position:"fixed",bottom:24,right:24,zIndex:300,padding:"12px 18px",
          borderRadius:"var(--r-lg)",fontWeight:500,fontSize:13,
          background: toast.tipo==="warn" ? "var(--danger-soft,#fef2f2)" : "var(--success-soft)",
          color: toast.tipo==="warn" ? "var(--danger)" : "var(--success)",
          border:`1px solid ${toast.tipo==="warn" ? "var(--danger)" : "var(--success)"}`,
          boxShadow:"0 4px 20px rgba(0,0,0,.15)"}}>
          {toast.msg}
        </div>
      )}

      {/* Modal rechazo */}
      {rechazoModal && (
        <div className="modal-overlay" onClick={() => setRechazoModal(null)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{maxWidth:480}}>
            <div className="modal-head">
              <div>
                <h2 className="modal-title">Rechazar solicitud</h2>
                <div className="card-sub" style={{marginTop:2}}>{rechazoModal.id}</div>
              </div>
              <div className="icon-btn" onClick={() => setRechazoModal(null)}><Icon name="x" size={14}/></div>
            </div>
            <div className="modal-body">
              <div style={{marginBottom:14,padding:"10px 14px",background:"var(--danger-soft,#fef2f2)",
                borderRadius:"var(--r-md)",fontSize:13,color:"var(--danger)",
                border:"1px solid var(--danger)"}}>
                El colaborador verá este motivo y podrá corregir y reenviar su solicitud.
              </div>
              <div className="field">
                <label>Motivo del rechazo *</label>
                <textarea className="input" style={{minHeight:90,resize:"vertical"}}
                  placeholder="Ej: Falta el XML de la factura de gasolina. Favor adjuntarlo y reenviar."
                  value={rechazoModal.motivo}
                  onChange={e => setRechazoModal({...rechazoModal, motivo: e.target.value})}
                />
                {!rechazoModal.motivo.trim() && (
                  <div style={{fontSize:12,color:"var(--danger)",marginTop:4}}>
                    El motivo es obligatorio para rechazar
                  </div>
                )}
              </div>
            </div>
            <div style={{padding:"14px 22px",borderTop:"1px solid var(--border)",
              display:"flex",justifyContent:"flex-end",gap:8}}>
              <button className="btn ghost" onClick={() => setRechazoModal(null)}>Cancelar</button>
              <button className="btn danger"
                style={{opacity: rechazoModal.motivo.trim() ? 1 : 0.4,
                        pointerEvents: rechazoModal.motivo.trim() ? "auto" : "none"}}
                onClick={confirmarRechazo}>
                <Icon name="x" size={13}/> Confirmar rechazo
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="page-head">
        <div>
          <h1 className="page-title">Por aprobar</h1>
          <div className="page-sub">Solicitudes de tu equipo esperando autorización</div>
        </div>
        <div className="row">
          <button className="btn" onClick={exportar}><Icon name="download" size={13}/> Exportar CSV</button>
        </div>
      </div>

      <div className="kpi-grid">
        <div className="kpi">
          <div className="kpi-label">Pendientes</div>
          <div className="kpi-value">{items.length}</div>
          <div className={`kpi-delta ${items.filter(s=>Math.floor((window.HOY-s.fecha)/86400000)>2).length>0?"down":"up"}`}>
            {items.filter(s=>Math.floor((window.HOY-s.fecha)/86400000)>2).length} con +48 h
          </div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Monto pendiente</div>
          <div className="kpi-value">{window.fmtMXN(items.reduce((a,s)=>a+s.monto,0))}</div>
          <div className="kpi-delta neutral">total a evaluar</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Anticipos</div>
          <div className="kpi-value">{counts.anticipo}</div>
          <div className="kpi-delta neutral">{counts.comprobacion} comprobaciones · {counts.reembolso} reembolsos</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Tiempo prom. respuesta</div>
          <div className="kpi-value">{(()=>{
            // Usar updated_at si está disponible, si no mostrar — (no tenemos timestamp de respuesta)
            const respondidas = window.SOLICITUDES.filter(s =>
              (teamIds ? teamIds.includes(s.usuario) : true) &&
              ["autorizado","rechazado"].includes(s.status) &&
              s.fecha && s.updatedAt
            );
            if (!respondidas.length) return "—";
            const avg = respondidas.reduce((a,s) => {
              const created = s.fecha instanceof Date ? s.fecha : new Date(s.fecha);
              const updated = s.updatedAt instanceof Date ? s.updatedAt : new Date(s.updatedAt);
              return a + Math.abs((updated - created) / 3600000);
            }, 0) / respondidas.length;
            return avg < 1 ? Math.round(avg*60)+" min" : avg.toFixed(1)+" h";
          })()}</div>
          <div className="kpi-delta up">SLA: 24 h</div>
        </div>
      </div>

      {/* Barra de filtros + búsqueda */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
        <div className="filterbar" style={{margin:0,flex:"1 1 auto"}}>
          {[
            {k:"todas",    label:"Todas"},
            {k:"anticipo", label:"Anticipos"},
            {k:"comprobacion",label:"Comprobaciones"},
            {k:"reembolso",label:"Reembolsos"},
          ].map(f => (
            <div key={f.k}
              className={`chip ${filtro===f.k?"active":""}`}
              onClick={() => setFiltro(f.k)}>
              {f.label}
              <span className="count">{f.k==="todas" ? items.length : counts[f.k]}</span>
            </div>
          ))}
        </div>
        <div className="search" style={{width:220}}>
          <Icon name="search" size={14}/>
          <input placeholder="Buscar folio, nombre…"
            value={busqueda}
            onChange={e => setBusqueda(e.target.value)}/>
        </div>
      </div>

      {filtradas.length === 0 ? (
        <div className="card">
          <div className="empty">
            <div className="empty-ic"><Icon name="check" size={20}/></div>
            <div style={{fontWeight:600,fontSize:14,color:"var(--text)"}}>
              {busqueda ? "Sin resultados" : "Todo al día"}
            </div>
            <div style={{marginTop:4}}>
              {busqueda
                ? `No hay solicitudes que coincidan con "${busqueda}"`

function TesoreriaBandeja({ openDetail }) {
  const getAutorizados = () => window.SOLICITUDES.filter(s => s.status === "autorizado");
  const [items, setItems] = React.useState(getAutorizados);
  const [selected, setSelected] = React.useState(() => new Set(getAutorizados().map(s => s.id)));
  const [toast, setToast] = React.useState(null);

  // Recargar desde Supabase al montar
  React.useEffect(() => {
    (async () => {
      if (!window.sb) return;
      const { data } = await window.sb.from("solicitudes")
        .select("*, items:solicitud_items(*)")
        .eq("status", "autorizado")
        .order("fecha", { ascending: false });
      // Filtrar los que ya se liberaron localmente
      // Excluir los que ya se procesaron localmente (liberados, rechazados, etc.)
      const yaProcessed = new Set(
        window.SOLICITUDES.filter(s => s.status !== "autorizado").map(s => s.id)
      );
      if (data) {
        const mapped = data
          .filter(s => !yaProcessed.has(s.id) && s.status === "autorizado")
          .map(s => ({
            id: s.id, tipo: s.tipo, concepto: s.concepto,
            usuario: s.usuario_id, monto: parseFloat(s.monto)||0,
            fecha: new Date(s.fecha), status: s.status,
            saldoPendiente: parseFloat(s.saldo_pendiente)||parseFloat(s.monto)||0,
          }));
        // Update SOLICITUDES
        mapped.forEach(m => {
          const idx = window.SOLICITUDES.findIndex(x => x.id === m.id);
          if (idx >= 0) Object.assign(window.SOLICITUDES[idx], m);
          else window.SOLICITUDES.unshift(m);
        });
        setItems(mapped);
        setSelected(new Set(mapped.map(s => s.id)));
      }
    })();
  }, []);

  const liberar = async (ids) => {
    const idsArr = Array.isArray(ids) ? ids : [ids];
    for (const id of idsArr) {
      const s = window.SOLICITUDES.find(x => x.id === id);
      if (!s) return;

      if (s.tipo === "comprobacion") {
        // Comprobación liberada = comprobado
        s.status = "comprobado";
        // Recalcular saldo del anticipo padre y marcarlo como comprobado si aplica
        if (s.anticipoRef) {
          window.calcSaldo(s.anticipoRef);
          const ant = window.SOLICITUDES.find(x => x.id === s.anticipoRef);
          if (ant && (ant.saldoPendiente || 0) <= 0) {
            ant.status = "comprobado";
          }
        }
      } else if (s.tipo === "reembolso") {
        s.status = "liberado";
      } else if (s.tipo === "anticipo") {
        s.status = "liberado";
        s.saldoPendiente = s.monto;
      } else {
        s.status = "liberado";
      }
      // Persistir en Supabase
      if (window.sb) {
        const updateData = { status: s.status };
        if (s.tipo === "anticipo") {
          updateData.saldo_pendiente = s.saldoPendiente || s.monto;
        }
        if (s.tipo === "comprobacion") updateData.saldo_pendiente = 0;
        await window.sb.from("solicitudes").update(updateData).eq("id", id);
        // Si es comprobacion, actualizar anticipo padre también
        if (s.tipo === "comprobacion" && s.anticipoRef) {
          const ant = window.SOLICITUDES.find(x => x.id === s.anticipoRef);
          if (ant) await window.sb.from("solicitudes").update({
            status: ant.status, saldo_pendiente: ant.saldoPendiente
          }).eq("id", s.anticipoRef);
        }
      }
    }
    // Actualizar estado local de items liberados en window.SOLICITUDES
    idsArr.forEach(id => {
      const sol = window.SOLICITUDES.find(x => x.id === id);
      if (sol && sol.status === "autorizado") sol.status = "liberado";
    });
    // Recargar desde Supabase para sincronía
    if (window.sb) {
      window.sb.from("solicitudes").select("*").eq("status","autorizado")
        .order("fecha",{ascending:false})
        .then(({data}) => {
          if (!data) return;
          const mapped = data.map(s=>({
            id:s.id, tipo:s.tipo, concepto:s.concepto, usuario:s.usuario_id,
            monto:parseFloat(s.monto)||0, fecha:new Date(s.fecha), status:s.status,
            saldoPendiente:parseFloat(s.saldo_pendiente)||0,
          }));
          mapped.forEach(m=>{
            const ix=window.SOLICITUDES.findIndex(x=>x.id===m.id);
            if(ix>=0) Object.assign(window.SOLICITUDES[ix],m);
            else window.SOLICITUDES.unshift(m);
          });
          setItems(mapped);
          setSelected(new Set(mapped.map(s=>s.id)));
        });
    } else {
      setItems(prev => prev.filter(i => !idsArr.includes(i.id)));
    }
    const newSel = new Set(selected);
    idsArr.forEach(id => newSel.delete(id));
    setSelected(newSel);
    const total = idsArr.reduce((a, id) => {
      const s = window.SOLICITUDES.find(x => x.id === id);
      return a + (s ? s.monto : 0);
    }, 0);
    setToast(`✓ ${idsArr.length} solicitud${idsArr.length > 1 ? "es" : ""} liberada${idsArr.length > 1 ? "s" : ""} · ${window.fmtMXN(total)} dispersados`);
    setTimeout(() => setToast(null), 3500);
  };

  const toggle = (id) => {
    const ns = new Set(selected);
    if (ns.has(id)) ns.delete(id); else ns.add(id);
    setSelected(ns);
  };

  const toggleAll = () => {
    if (selected.size === items.length) setSelected(new Set());
    else setSelected(new Set(items.map(i => i.id)));
  };

  const [filtroTeso, setFiltroTeso] = React.useState("todas");
  const [busquedaTeso, setBusquedaTeso] = React.useState("");

  const exportarSPEI = () => {
    const sel = items.filter(i => selected.has(i.id));
    const rows = [["Folio","Beneficiario","CLABE","Banco","Monto","Concepto"]];
    sel.forEach(s => {
      const u = window.findUser(s.usuario);
      rows.push([s.id, u.nombre, "••••4392", "BBVA", s.monto, s.concepto]);
    });
    const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = `layout_spei_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  const countsTeso = {
    anticipo:     items.filter(s=>s.tipo==="anticipo").length,
    comprobacion: items.filter(s=>s.tipo==="comprobacion").length,
    reembolso:    items.filter(s=>s.tipo==="reembolso").length,
  };
  const itemsFiltrados = items
    .filter(s => filtroTeso==="todas" || s.tipo===filtroTeso)
    .filter(s => {
      if (!busquedaTeso.trim()) return true;
      const q = busquedaTeso.toLowerCase();
      const u = window.findUser(s.usuario);
      return s.id.toLowerCase().includes(q) || u.nombre.toLowerCase().includes(q) || s.concepto.toLowerCase().includes(q);
    });

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">Por liberar</h1>
          <div className="page-sub">Solicitudes autorizadas listas para dispersión</div>
        </div>
        <div className="row">
          <button className="btn" onClick={exportarSPEI} disabled={selected.size===0}>
            <Icon name="download" size={13}/> Layout SPEI ({selected.size})
          </button>
          <button className="btn primary" disabled={selected.size === 0} onClick={() => liberar([...selected])}>
            <Icon name="cash" size={13}/> Liberar lote ({selected.size})
          </button>
        </div>
      </div>

      {toast && (
        <div style={{position:"fixed", bottom:24, right:24, background:"var(--success-soft)", border:"1px solid oklch(from var(--success) l c h / 0.4)", color:"var(--success)", padding:"12px 18px", borderRadius:"var(--r-lg)", zIndex:100, fontWeight:500, fontSize:13}}>
          {toast}
        </div>
      )}

      <div className="kpi-grid">
        <div className="kpi"><div className="kpi-label">Por liberar</div><div className="kpi-value">{items.length}</div><div className="kpi-delta neutral">solicitudes</div></div>
        <div className="kpi"><div className="kpi-label">Monto total</div><div className="kpi-value">{window.fmtMXN(items.reduce((a,s)=>a+s.monto,0))}</div><div className="kpi-delta up">listo para SPEI</div></div>
        <div className="kpi"><div className="kpi-label">Liberado hoy</div>{(()=>{
  const hoy=new Date().toDateString();
  const liberadosHoy=window.SOLICITUDES.filter(s=>{
    const f=s.fecha instanceof Date?s.fecha:new Date(s.fecha);
    return ["liberado","comprobado"].includes(s.status)&&f.toDateString()===hoy;
  });
  return <>
    <div className="kpi-value">{window.fmtMXN(liberadosHoy.reduce((a,s)=>a+s.monto,0))}</div>
    <div className="kpi-delta up">{liberadosHoy.length} transferencias hoy</div>
  </>;
})()}</div>
        <div className="kpi"><div className="kpi-label">Saldos abiertos</div><div className="kpi-value">{window.fmtMXN(window.SOLICITUDES.filter(s=>s.tipo==="anticipo"&&["liberado","parcial"].includes(s.status)&&(s.saldoPendiente||0)>0).reduce((a,s)=>a+(s.saldoPendiente||0),0))}</div><div className="kpi-delta down">{window.SOLICITUDES.filter(s=>s.tipo==="anticipo"&&["liberado","parcial"].includes(s.status)&&(s.saldoPendiente||0)>0).length} anticipo(s) sin comprobar</div></div>
      </div>

      {/* Filter bar */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
        <div className="filterbar" style={{margin:0,flex:"1 1 auto"}}>
          {[
            {k:"todas",label:"Todas"},
            {k:"anticipo",label:"Anticipos"},
            {k:"comprobacion",label:"Comprobaciones"},
            {k:"reembolso",label:"Reembolsos"},
          ].map(f=>(
            <div key={f.k} className={`chip ${filtroTeso===f.k?"active":""}`} onClick={()=>setFiltroTeso(f.k)}>
              {f.label} <span className="count">{f.k==="todas"?items.length:countsTeso[f.k]}</span>
            </div>
          ))}
        </div>
        <div className="search" style={{width:220}}>
          <Icon name="search" size={14}/>
          <input placeholder="Buscar folio, nombre…" value={busquedaTeso} onChange={e=>setBusquedaTeso(e.target.value)}/>
        </div>
      </div>

      {items.length === 0 ? (
        <div className="card"><div className="empty"><div className="empty-ic"><Icon name="check" size={20}/></div><div style={{fontWeight:600, fontSize:14, color:"var(--text)"}}>Todo liberado</div><div style={{marginTop:4}}>No hay solicitudes pendientes de dispersión</div></div></div>
      ) : itemsFiltrados.length === 0 ? (
        <div className="card"><div className="empty"><div className="empty-ic"><Icon name="search" size={20}/></div><div style={{fontWeight:600,fontSize:14,color:"var(--text)"}}>Sin resultados</div><div style={{marginTop:4}}>Ajusta los filtros de búsqueda</div></div></div>
      ) : (
        <div className="card" style={{padding:0}}>
          <table className="t">
            <thead>
              <tr>
                <th style={{width:30}}><input type="checkbox" checked={selected.size === items.length} onChange={toggleAll}/></th>
                <th></th><th>Folio</th><th>Beneficiario</th><th>Centro</th><th>Concepto</th><th className="right">Monto</th><th>CLABE</th><th></th>
              </tr>
            </thead>
            <tbody>
              {itemsFiltrados.map(s => {
                const u = window.findUser(s.usuario);
                const c = window.findCentro(u.centro);
                return (
                  <tr key={s.id} onClick={() => openDetail(s.id)}>
                    <td onClick={e => e.stopPropagation()}><input type="checkbox" checked={selected.has(s.id)} onChange={() => toggle(s.id)}/></td>
                    <td><TipoBadge tipo={s.tipo}/></td>
                    <td className="id-cell">{s.id}</td>
                    <td>{u.nombre}</td>
                    <td className="mono muted" style={{fontSize:12}}>{c ? c.id : u.centro}</td>
                    <td className="muted">{s.concepto}</td>
                    <td className="num">{window.fmtMXN(s.monto)}</td>
                    <td className="mono muted" style={{fontSize:11}}>•••• 4392</td>
                    <td className="right" onClick={e=>e.stopPropagation()}>
                      <button className="btn sm primary" onClick={() => liberar(s.id)}><Icon name="cash" size={12}/> Liberar</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </>
  );
}

function EditModal({ title, fields, onClose, onSave, onDelete, onBlock, blocked, isNew }) {
  const [vals, setVals] = React.useState(() => Object.fromEntries(fields.map(f => [f.key, f.value ?? ""])));
  const [confirmDelete, setConfirmDelete] = React.useState(false);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:560}}>
        <div className="modal-head">
          <h2 className="modal-title">{title}</h2>
          <div className="icon-btn" onClick={onClose}><Icon name="x" size={14}/></div>
        </div>
        <div className="modal-body">
          <div className="form-grid cols-2">
            {fields.map(f => (
              <div className="field" key={f.key} style={f.full ? {gridColumn:"1 / -1"} : null}>
                <label>{f.label}</label>
                {f.type === "select" ? (
                  <select className="select" value={vals[f.key]} onChange={e => setVals({...vals, [f.key]: e.target.value})}>
                    {f.options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                  </select>
                ) : (
                  <input className="input"
                    type={f.type || "text"}
                    placeholder={f.placeholder || ""}
                    value={vals[f.key]}
                    onChange={e => setVals({...vals, [f.key]: e.target.value})}/>
                )}
                {f.hint && <div className="hint">{f.hint}</div>}
              </div>
            ))}
          </div>
        </div>
        <div style={{padding:"14px 22px", borderTop:"1px solid var(--border)", display:"flex", justifyContent:"space-between", alignItems:"center", gap:8, flexWrap:"wrap"}}>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            {!isNew && onBlock && (
              <button className="btn" style={blocked ? {color:"var(--success)"} : {color:"var(--warn)"}}
                onClick={() => { onBlock(!blocked); onClose(); }}>
                <Icon name={blocked ? "check" : "lock"} size={13}/>
                {blocked ? "Desbloquear" : "Bloquear"}
              </button>
            )}
            {!isNew && onDelete && (
              confirmDelete ? (
                <button className="btn" style={{background:"var(--danger,#e35858)", color:"#fff", borderColor:"var(--danger,#e35858)"}}
                  onClick={() => { onDelete(); onClose(); }}>
                  <Icon name="x" size={13}/> Confirmar eliminar
                </button>
              ) : (
                <button className="btn" style={{color:"var(--danger,#e35858)"}}
                  onClick={() => setConfirmDelete(true)}>
                  <Icon name="trash" size={13}/> Eliminar
                </button>
              )
            )}
          </div>
          <div style={{display:"flex", gap:8}}>
            <button className="btn ghost" onClick={onClose}>Cancelar</button>
            <button className="btn primary" onClick={() => { onSave(vals); onClose(); }}>Guardar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function AdminUsuarios() {
  const [users, setUsers]   = React.useState(window.USUARIOS);
  const [editing, setEditing] = React.useState(null);
  const [filtro, setFiltro]   = React.useState("todos");
  const [busqueda, setBusqueda] = React.useState("");

  const openEdit = (u) => {
    if (!u && (!window.CENTROS || window.CENTROS.length === 0)) {
      alert("Primero crea al menos un centro de beneficio antes de agregar usuarios.");
      return;
    }
    setEditing(u || {
      id:"", nombre:"", correo:"", rol:"usuario",
      centro: window.CENTROS[0]?.id || "", gerente: null, iniciales:""
    });
  };

  const [toastU, setToastU] = React.useState(null);
  const showToastU = (msg, ok=true) => {
    setToastU({msg, ok});
    setTimeout(() => setToastU(null), 4000);
  };

  const WORKER_URL = "https://viaticos-admin.rhernandez-e52.workers.dev";

  const callWorker = async (action, payload) => {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, payload }),
    });
    if (!res.ok) throw new Error("Worker " + res.status);
    return res.json();
  };

  const save = async (vals) => {
    const iniciales = (vals.nombre||"").split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
    const exists = users.find(u => u.id === editing.id);
    const toApply = {...vals, iniciales};
    try {
      if (exists) {
        // Editar: actualizar perfil directo en Supabase
        if (window.sb) {
          const row = { nombre: toApply.nombre, rol: toApply.rol,
            centro_id: toApply.centro||null, gerente_id: toApply.gerente||null,
            division: toApply.division||"4105", clabe: toApply.clabe||null,
            banco: toApply.banco||null, iniciales };
          const { error } = await window.sb.from("usuarios").update(row).eq("id", editing.id);
          if (error) { showToastU("Error: " + error.message, false); return; }
          if (toApply.password && toApply.password.trim())
            await callWorker("resetPassword", { id: editing.id, password: toApply.password.trim() });
        }
        const updated = users.map(u => u.id===editing.id ? {...u,...toApply} : u);
        const wu = window.USUARIOS.find(u => u.id===editing.id);
        if (wu) Object.assign(wu, toApply);
        setUsers(updated); window.USUARIOS = updated;
        showToastU("Usuario actualizado ✓");
      } else {
        // Nuevo usuario vía Worker
        if (!toApply.correo?.trim()) { showToastU("Correo obligatorio", false); return; }
        showToastU("Creando usuario…");
        const data = await callWorker("createUser", {
          correo: toApply.correo.trim(),
          password: toApply.password?.trim() || "Temporal1234!",
          nombre: toApply.nombre, rol: toApply.rol,
          centro: toApply.centro||null, gerente: toApply.gerente||null,
          division: toApply.division||"4105",
        });
        if (!data.id) { showToastU("Error: " + (data.message||"No se pudo crear"), false); return; }
        const newUser = {...toApply, id: data.id, iniciales, activo: true};
        const updated = [...users, newUser];
        window.USUARIOS.push(newUser);
        setUsers(updated); window.USUARIOS = updated;
        showToastU("Usuario creado ✓ · Contraseña temporal: " + (toApply.password||"Temporal1234!"));
      }
    } catch(err) { showToastU("Error: " + err.message, false); return; }
    setEditing(null);
  };

  const toggleBlock = (block) => {
    const updated = users.map(u => u.id === editing.id ? { ...u, activo: !block } : u);
    setUsers(updated);
    window.USUARIOS = updated;
  };

  const deleteUser = async () => {
    try {
      await callWorker("deleteUser", { id: editing.id });
    } catch(e) {
      if (window.sb) await window.sb.from("usuarios").update({activo:false}).eq("id",editing.id);
    }
    const updated = users.filter(u => u.id !== editing.id);
    setUsers(updated); window.USUARIOS = updated;
    setEditing(null);
    showToastU("Usuario dado de baja ✓");
  };

  const exportar = (lista) => {
    const rows = [["ID","Nombre","Correo","Rol","Centro","Reporta a"]];
    lista.forEach(u => {
      const g = u.gerente ? window.findUser(u.gerente) : null;
      rows.push([u.id, u.nombre, u.correo, u.rol, u.centro, g ? g.nombre : "—"]);
    });
    const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = `usuarios_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  };

  const conteos = {
    todos:     users.length,
    usuario:   users.filter(u=>u.rol==="usuario").length,
    gerente:   users.filter(u=>u.rol==="gerente").length,
    tesoreria: users.filter(u=>u.rol==="tesoreria").length,

    ahoraSaldos.sort((a,b)=>a.fecha-b.fecha).forEach(s=>{

function MAdminUsuarios() {
  const [users, setUsers] = React.useState(window.USUARIOS);
  const [editing, setEditing] = React.useState(null);
  const [busqueda, setBusqueda] = React.useState("");

  const openEdit = (u) => {
    if (!u && (!window.CENTROS || window.CENTROS.length === 0)) {
      alert("Primero crea al menos un centro de beneficio antes de agregar usuarios.");
      return;
    }
    setEditing(u || {
      id:"", nombre:"", correo:"", rol:"usuario",
      centro: window.CENTROS[0]?.id || "", gerente:"", iniciales:"", _isNew:true,
    });
  };

  const save = (vals) => {
    if (!vals.nombre?.trim()) { alert("Falta el nombre del usuario"); return; }
    if (!vals.correo?.trim()) { alert("Falta el correo del usuario"); return; }
    const iniciales = vals.nombre.trim().split(/\s+/).map(p=>p[0]||"").slice(0,2).join("").toUpperCase();
    const isNew = !!editing._isNew;
    const targetId = isNew ? (vals.id?.trim() || `U${Date.now()}`) : editing.id;
    const record = {
      id: targetId,
      nombre: vals.nombre.trim(),
      correo: vals.correo.trim(),
      rol: vals.rol,
      centro: vals.centro,
      gerente: vals.gerente || null,
      iniciales,
    };
    if (isNew) {
      record.password = vals.password?.trim() || "1234";
      record.activo = true;
    } else if (vals.password?.trim()) {
      record.password = vals.password.trim();
    }
    const updated = isNew
      ? [...users, record]
      : users.map(u => u.id === editing.id ? { ...u, ...record } : u);
    setUsers(updated);
    window.USUARIOS = updated;
    setEditing(null);
  };

  const toggleBlock = (block) => {
    const updated = users.map(u => u.id === editing.id ? { ...u, activo: !block } : u);
    setUsers(updated);
    window.USUARIOS = updated;
  };

  const deleteUser = async () => {
    try {
      await callWorker("deleteUser", { id: editing.id });
    } catch(e) {
      if (window.sb) await window.sb.from("usuarios").update({activo:false}).eq("id",editing.id);
    }
    const updated = users.filter(u => u.id !== editing.id);
    setUsers(updated); window.USUARIOS = updated;
    setEditing(null);
    showToastU("Usuario dado de baja ✓");
  };

  const filtrados = users.filter(u => {
    if (!busqueda.trim()) return true;
    const q = busqueda.toLowerCase();
    return u.nombre.toLowerCase().includes(q) || u.correo.toLowerCase().includes(q) || u.id.toLowerCase().includes(q);
  });

  return (
    <div className="m-pad">
      <div style={{display:"flex", gap:8, marginBottom:10}}>
        <div className="search" style={{flex:1}}>
          <Icon name="search" size={14}/>
          <input placeholder="Buscar nombre, correo, ID…" value={busqueda} onChange={e=>setBusqueda(e.target.value)}/>
        </div>
        <button className="btn sm primary" style={{flexShrink:0}} onClick={() => openEdit(null)}><Icon name="plus" size={12}/></button>
      </div>

      {filtrados.map(u => {
        const c = window.findCentro(u.centro);
        return (
          <div key={u.id} className="m-card" style={{display:"flex", alignItems:"center", gap:12, cursor:"pointer", opacity: u.activo === false ? 0.55 : 1}} onClick={() => openEdit(u)}>
            <div className="avatar sm" style={{width:38, height:38, fontSize:13}}>{u.iniciales}</div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:13, fontWeight:500, display:"flex", alignItems:"center", gap:6}}>
                {u.nombre}
                {u.activo === false && <span style={{background:"var(--warn-soft)",color:"var(--warn)",fontSize:9,padding:"1px 5px",borderRadius:6,textTransform:"uppercase",letterSpacing:"0.05em",fontWeight:600}}>Bloq</span>}
              </div>
              <div className="muted" style={{fontSize:11}}>{u.correo}</div>
              <div style={{marginTop:4, display:"flex", gap:6}}>
                <span className="badge tipo" style={{fontSize:9.5, textTransform:"capitalize"}}>{u.rol}</span>
                {c && <span className="muted mono" style={{fontSize:10}}>{c.id}</span>}
              </div>
            </div>
            <Icon name="chevR" size={14} style={{color:"var(--text-3)"}}/>
          </div>
        );
      })}

      {editing && (
        <EditModal
          title={editing._isNew ? "Nuevo usuario" : "Editar usuario"}

            { key:"nombre", label:"Nombre completo",    value:editing.nombre, full:true },
            { key:"correo", label:"Correo electrónico", value:editing.correo, full:true },
            { key:"rol",    label:"Rol",                value:editing.rol, type:"select", options:[
              { value:"usuario",   label:"Usuario" },
              { value:"gerente",   label:"Gerente" },
              { value:"tesoreria", label:"Tesorería" },
              { value:"contador",  label:"Contador" },
              { value:"admin",     label:"Admin" },
            ]},
            { key:"centro", label:"Centro de beneficio", value:editing.centro, type:"select",
              options: window.CENTROS.map(c => ({ value:c.id, label:`${c.id} · ${c.nombre}` })) },

function MNuevoAnticipo({ userId, onDone, showSnack }) {
  const [form, setForm] = React.useState({
    concepto: "", centro: window.CENTROS[0]?.id || "",
    salida: "", regreso: "", destino: "", notas: "",
  });
  const [lineas, setLineas] = React.useState([
    { id: 1, nombre: "Pasajes", monto: 0, cuenta: "6122900001" },
  ]);
  const upd = (k, v) => setForm({...form, [k]: v});
  const updL = (id, k, v) => setLineas(lineas.map(l => l.id === id ? { ...l, [k]: v } : l));
  const addL = () => setLineas([...lineas, { id: Date.now(), nombre: "", monto: 0, cuenta: "6122900005" }]);
  const delL = (id) => setLineas(lineas.filter(l => l.id !== id));
  const total = lineas.reduce((a, l) => a + (parseFloat(l.monto) || 0), 0);

  const enviar = async () => {
    if (!form.concepto.trim()) { showSnack("⚠ Escribe un concepto"); return; }
    if (!form.destino.trim())  { showSnack("⚠ Indica el destino"); return; }
    if (total <= 0)            { showSnack("⚠ Agrega al menos un monto"); return; }
    const id = "ANT-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-4);
    const u = window.findUser(userId);
    // Persistir en Supabase
    if (window.sb) {
      const { error } = await window.sb.from("solicitudes").insert({
        id, tipo:"anticipo", concepto: form.concepto.trim(),
        usuario_id: userId, monto: total,
        status:"solicitado", saldo_pendiente: total,
        centro_id: u && u.centro ? u.centro : null,
        destino: form.destino.trim(),
        fecha_salida: form.salida || null,
        fecha_regreso: form.regreso || null,
        notas: form.notas||null,
        fecha: new Date().toISOString(),
      });
      if (error) { showSnack("⚠ Error: " + error.message); return; }
      if (lineas.length > 0) {
        await window.sb.from("solicitud_items").insert(
          lineas.map((l,i)=>({ solicitud_id:id, cuenta:l.cuenta,
            descripcion:l.desc||l.concepto||"", monto:parseFloat(l.monto)||0, orden:i }))
        );
      }
    }
    window.SOLICITUDES.unshift({
      id, tipo:"anticipo", concepto: form.concepto.trim(),
      usuario: userId, monto: total, fecha: new Date(),
      status: "solicitado", saldoPendiente: total, comprobantes: 0,
      destino: form.destino, salida: form.salida, regreso: form.regreso,
      notas: form.notas, items: lineas,
    });
    showSnack(`✓ ${id} enviado a tu gerente`);
    setTimeout(onDone, 1000);
  };
  const guardarBorrador = () => {
    const id = `BOR-${Date.now().toString().slice(-6)}`;
    window.BORRADORES = window.BORRADORES || [];
    window.BORRADORES.push({ id, ...form, lineas, fecha: new Date(), tipo: "anticipo" });
    showSnack(`✓ Borrador ${id} guardado`);
  };

  return (
    <div className="m-pad">
      <div className="m-balance" style={{padding:14, marginBottom:14}}>
        <div className="m-balance-l">Monto total estimado</div>
        <div className="m-balance-v">{window.fmtMXN(total)}</div>
        <div style={{fontSize:11.5, opacity:0.75, marginTop:6}}>{lineas.length} concepto{lineas.length !== 1 ? "s" : ""}</div>
      </div>

      <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text-3)", margin:"4px 4px 10px", fontWeight:600}}>Datos del viaje</div>
      <div className="m-card" style={{margin:"0 0 14px"}}>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11, color:"var(--text-3)", fontWeight:500, display:"block", marginBottom:4}}>Concepto / motivo</label>
          <input className="input" placeholder="Ej. Visita comercial Monterrey" style={{width:"100%"}} value={form.concepto} onChange={e => upd("concepto", e.target.value)}/>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11, color:"var(--text-3)", fontWeight:500, display:"block", marginBottom:4}}>Centro de beneficio</label>
          <select className="select" style={{width:"100%"}} value={form.centro} onChange={e => upd("centro", e.target.value)}>
            {window.CENTROS.map(c => <option key={c.id} value={c.id}>{c.id} · {c.nombre}</option>)}
          </select>
        </div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:12}}>
          <div>
            <label style={{fontSize:11, color:"var(--text-3)", fontWeight:500, display:"block", marginBottom:4}}>Salida</label>
            <input className="input" type="date" style={{width:"100%"}} value={form.salida} onChange={e => upd("salida", e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:11, color:"var(--text-3)", fontWeight:500, display:"block", marginBottom:4}}>Regreso</label>
            <input className="input" type="date" min={form.salida||undefined} style={{width:"100%"}} value={form.regreso} onChange={e => upd("regreso", e.target.value)}/>
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11, color:"var(--text-3)", fontWeight:500, display:"block", marginBottom:4}}>Destino</label>

      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8, padding:"0 4px"}}>

            <button className="icon-btn" style={{flexShrink:0}} onClick={() => delL(l.id)}><Icon name="x" size={12}/></button>
          </div>
          <input className="input mono" style={{width:"100%", textAlign:"right"}} placeholder="0.00" value={l.monto} onChange={e => updL(l.id, "monto", e.target.value)}/>

function MNuevaComprobacion({ userId, onDone, showSnack }) {
  const pendientes = window.SOLICITUDES.filter(s => s.tipo === "anticipo" && s.usuario === userId && ["liberado","parcial"].includes(s.status) && (s.saldoPendiente || 0) > 0);
  const [sel, setSel] = React.useState(null);
  const [facturas, setFacturas] = React.useState([]);

  // Paso 1: seleccionar anticipo
  if (!sel) {
    return (
      <div className="m-pad">
        <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text-3)", margin:"4px 4px 10px", fontWeight:600}}>
          Selecciona un anticipo
        </div>
        {pendientes.length === 0 && <M_Empty icon="check" title="Sin anticipos por comprobar" sub="Cuando tengas un anticipo liberado aparecerá aquí"/>}
        {pendientes.map(a => (
          <div key={a.id} className="m-card" style={{cursor:"pointer"}} onClick={() => setSel(a)}>
            <div className="spread" style={{marginBottom:6}}>
              <span className="mono" style={{fontSize:11, color:"var(--text-3)"}}>{a.id}</span>
              <StatusBadge status={a.status}/>
            </div>
            <div style={{fontSize:13, fontWeight:500, marginBottom:6}}>{a.concepto}</div>
            <div className="spread">
              <span className="muted" style={{fontSize:11}}>Anticipo · {window.fmtMXN(a.monto)}</span>
              <span className="mono" style={{fontSize:13, fontWeight:600, color:"var(--warn)"}}>Saldo {window.fmtMXN(a.saldoPendiente)}</span>
            </div>
          </div>
        ))}
      </div>
    );
  }

  // Paso 2: capturar facturas para el anticipo seleccionado
  const totalComp = facturas.reduce((a, f) => a + (f.total || 0), 0);
  const saldoFinal = sel.monto - totalComp;

  const handleFile = (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      if (!file.name.toLowerCase().endsWith(".xml")) {
        setFacturas(prev => [...prev, { nombre: file.name, emisor: file.name, concepto: file.name, total: 0, cuenta: "6121200001", confianza: 0, isCFDI: false }]);
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const txt = ev.target.result;
        try {
          const doc = new DOMParser().parseFromString(txt, "application/xml");
          if (doc.querySelector("parsererror")) { showSnack("XML inválido: " + file.name); return; }
          const qn = (parent, ln) => { let el = parent.querySelector(ln); if (el) return el; const all = parent.getElementsByTagName("*"); for (let i = 0; i < all.length; i++) if (all[i].localName === ln) return all[i]; return null; };
          const attr = (el, ...names) => { if (!el) return ""; for (const n of names) { const v = el.getAttribute(n) || el.getAttribute(n.toLowerCase()) || el.getAttribute(n[0].toUpperCase()+n.slice(1)); if (v) return v; } return ""; };
          const comp = qn(doc, "Comprobante") || doc.documentElement;
          const total = parseFloat(attr(comp, "Total","total") || "0");
          const subtotal = parseFloat(attr(comp, "SubTotal","Subtotal","subtotal") || "0");
          const emisorEl = qn(doc, "Emisor");
          const emisor = attr(emisorEl, "Nombre","nombre") || attr(emisorEl, "Rfc","rfc") || "";
          const conceptoEls = Array.from(doc.getElementsByTagName("*")).filter(e => e.localName === "Concepto");
          const conceptoStr = conceptoEls.map(c => attr(c, "Descripcion","descripcion")).filter(Boolean).join(" · ").slice(0, 80) || "—";
          const tfd = Array.from(doc.getElementsByTagName("*")).find(e => e.localName === "TimbreFiscalDigital");
          const uuid = tfd ? (attr(tfd, "UUID","uuid") || "").toUpperCase() : "";
          let iva = 0;
          Array.from(doc.getElementsByTagName("*")).filter(e => e.localName === "Traslado").forEach(t => {
            const imp = attr(t, "Impuesto","impuesto");
            if (imp === "002" || imp.toUpperCase() === "IVA") iva += parseFloat(attr(t, "Importe","importe") || "0") || 0;
          });
          if (!iva && total && subtotal) iva = Math.round((total - subtotal) * 100) / 100;
          const text = (emisor + " " + conceptoStr).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
          let cuenta = "6121200001", confianza = 0.5;
          if (/(pemex|gasolina|magna|premium|diesel|combustible)/.test(text)) { cuenta = "6120800001"; confianza = 0.96; }
          else if (/(aeromexico|volaris|vivaaerobus|vuelo|pasaje aereo|boleto)/.test(text)) { cuenta = "6122900001"; confianza = 0.96; }
          else if (/(tua|asur|aifa|oma|gap aeropuertos)/.test(text)) { cuenta = "6122700001"; confianza = 0.95; }
          else if (/(hotel|hospedaje|marriott|fiesta inn|holiday|city express|camino real|hilton)/.test(text)) { cuenta = "6122900003"; confianza = 0.95; }
          else if (/(restaurante|comida|alimento|cafeteria|cena|desayuno)/.test(text)) { cuenta = "6122900005"; confianza = 0.93; }
          else if (/(caseta|peaje|capufe|autopista)/.test(text)) { cuenta = "6122900002"; confianza = 0.95; }
          else if (/(estacionamiento|parking)/.test(text)) { cuenta = "6122900004"; confianza = 0.94; }
          else if (/(hertz|sixt|avis|alamo|renta de auto|renta vehicular)/.test(text)) { cuenta = "6122900006"; confianza = 0.94; }
          const meta = window.findCuenta(cuenta) || { nombre: cuenta };
          setFacturas(prev => [...prev, {
            nombre: file.name, uuid: uuid.slice(0,18) + (uuid.length > 18 ? "…" : ""),
            emisor, concepto: conceptoStr, subtotal: Math.round(subtotal*100)/100,
            iva: Math.round(iva*100)/100, total: Math.round(total*100)/100,
            cuenta, nombreCuenta: meta.nombre, confianza, isCFDI: true,
          }]);
        } catch (err) { showSnack("Error al leer: " + file.name); }
      };
      reader.readAsText(file, "utf-8");
    });
    e.target.value = "";
  };

  const enviar = async () => {
    if (facturas.length === 0) { showSnack("⚠ Sube al menos una factura"); return; }
    const saldoActual = sel.saldoPendiente || sel.monto;
    if (totalComp > saldoActual + 0.01) {
      showSnack(`⚠ Excede el saldo disponible ($${saldoActual.toFixed(2)})`); return;
    }
    const id = "CMP-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-4);
    const nuevoSaldo = Math.max(0, saldoActual - totalComp);
    const nuevoStatusAnt = nuevoSaldo === 0 ? "comprobado" : "parcial";

    // Persistir comprobación en Supabase
    if (window.sb) {
      const { error } = await window.sb.from("solicitudes").insert({
        id, tipo:"comprobacion", concepto: `Comprobación ${sel.id}`,
        usuario_id: userId, monto: totalComp,
        status:"solicitado", anticipo_ref: sel.id,
        comprobantes: facturas.length, saldo_pendiente: 0,
        fecha: new Date().toISOString(),
      });
      if (error) { showSnack("⚠ Error: " + error.message); return; }
      if (facturas.length > 0) {
        await window.sb.from("comprobantes_cfdi").insert(
          facturas.map(it=>({
            solicitud_id: id,
            uuid: it.uuidFull || it.uuid || ("SIN-UUID-"+Date.now()),
            emisor: it.emisor, concepto: it.concepto,
            subtotal: it.subtotal||0, iva: it.iva||0, total: it.total||0,
            cuenta: it.cuenta, confianza: it.confianza||0.9,
          }))
        );
      }
      // Actualizar saldo del anticipo padre
      await window.sb.from("solicitudes").update({
        saldo_pendiente: nuevoSaldo, status: nuevoStatusAnt,
      }).eq("id", sel.id);
    }

    window.SOLICITUDES.unshift({
      id, tipo: "comprobacion", concepto: `Comprobación ${sel.id}`,
      usuario: userId, monto: totalComp, fecha: new Date(),
      status: "solicitado", anticipoRef: sel.id, comprobantes: facturas.length, cfdi: facturas,
      saldoPendiente: 0,
    });
    const ant = window.SOLICITUDES.find(s => s.id === sel.id);
    if (ant) {
      ant.saldoPendiente = nuevoSaldo;
      ant.comprobantes = (ant.comprobantes || 0) + facturas.length;
      ant.status = nuevoStatusAnt;
    }
    showSnack(`✓ Comprobación ${id} enviada`);
    setTimeout(onDone, 1100);
  };

  return (
    <div className="m-pad">
      {/* Card del anticipo seleccionado */}
      <div className="m-card" style={{margin:"0 0 12px", background:"var(--accent-soft)", border:"1px solid oklch(from var(--accent) l c h / 0.3)"}}>
        <div className="spread" style={{marginBottom:4}}>
          <span className="mono" style={{fontSize:11, color:"var(--accent)"}}>{sel.id}</span>
          <button className="btn sm ghost" onClick={() => setSel(null)} style={{padding:"2px 8px", fontSize:11}}>Cambiar</button>
        </div>
        <div style={{fontSize:13, fontWeight:500}}>{sel.concepto}</div>
        <div className="spread" style={{marginTop:8}}>
          <span className="muted" style={{fontSize:11}}>Anticipo {window.fmtMXN(sel.monto)}</span>
          <span className="mono" style={{fontSize:12, fontWeight:600}}>Saldo {window.fmtMXN(sel.saldoPendiente)}</span>
        </div>
      </div>

      {/* Drop zone */}
      <div className="dropzone" style={{padding:22, marginBottom:12, cursor:"pointer"}} onClick={() => document.getElementById("mc-file-input").click()}>
        <div className="dropzone-icon"><Icon name="upload" size={20}/></div>
        <div className="dropzone-title" style={{fontSize:13}}>Sube XML + PDF de cada factura</div>
        <div className="dropzone-sub" style={{fontSize:11}}>Auto-extraemos RFC, total e IVA</div>
      </div>
      <input id="mc-file-input" type="file" multiple accept=".xml,.pdf,.jpg,.jpeg,.png" style={{display:"none"}} onChange={handleFile}/>

      {/* Facturas */}
      {facturas.map((f, i) => (
        <div key={i} className="m-card" style={{margin:"0 0 8px"}}>
          <div className="spread" style={{marginBottom:6}}>
            <div style={{fontSize:12, fontWeight:600, flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", marginRight:8}}>{f.nombre}</div>
            <button onClick={() => setFacturas(prev => prev.filter((_, j) => j !== i))} style={{background:"none", border:"none", color:"var(--text-3)", cursor:"pointer", fontSize:16, lineHeight:1}}>×</button>
          </div>
          {f.isCFDI ? (
            <>
              <div className="spread" style={{padding:"2px 0"}}><span className="muted" style={{fontSize:11}}>Emisor</span><strong style={{fontSize:12}}>{f.emisor || "—"}</strong></div>
              <div className="spread" style={{padding:"2px 0"}}><span className="muted" style={{fontSize:11}}>Total</span><strong className="mono" style={{fontSize:13}}>{window.fmtMXN(f.total)}</strong></div>
              <div style={{marginTop:6, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
                <div>
                  <div style={{fontSize:11, fontWeight:600}}>{f.nombreCuenta}</div>
                  <div className="mono" style={{fontSize:10, color:"var(--text-3)"}}>{f.cuenta}</div>
                </div>
                <span style={{padding:"2px 8px", borderRadius:20, fontSize:10, fontWeight:500, background:f.confianza >= 0.85 ? "var(--success-soft)" : "var(--warn-soft)", color:f.confianza >= 0.85 ? "var(--success)" : "var(--warn)"}}>
                  {Math.round(f.confianza*100)}% {f.confianza >= 0.85 ? "✓" : "revisar"}
                </span>
              </div>
            </>
          ) : <div className="muted" style={{fontSize:12}}>Archivo adjunto (no XML)</div>}
        </div>
      ))}

      {facturas.length > 0 && (
        <>
          <div className="m-card" style={{margin:"12px 0", padding:14}}>
            <div className="spread" style={{padding:"4px 0"}}><span className="muted">Anticipo</span><strong className="mono">{window.fmtMXN(sel.monto)}</strong></div>
            <div className="spread" style={{padding:"4px 0"}}><span className="muted">Comprobado</span><strong className="mono">{window.fmtMXN(totalComp)}</strong></div>
            <div className="divider" style={{margin:"8px 0"}}></div>
            <div className="spread">
              <span style={{fontWeight:600}}>{saldoFinal >= 0 ? "A devolver" : "Excedente"}</span>
              <strong className="mono" style={{fontSize:18, color:saldoFinal === 0 ? "var(--success)" : "var(--accent)"}}>{window.fmtMXN(Math.abs(saldoFinal))}</strong>
            </div>
          </div>
          <button className="btn primary" style={{width:"100%", justifyContent:"center", marginBottom:8}} onClick={enviar}>
            <Icon name="arrowR" size={13}/> Enviar comprobación
          </button>
          <button className="btn" style={{width:"100%", justifyContent:"center"}} onClick={() => setFacturas([])}>Limpiar</button>
        </>
      )}
    </div>
  );
}

// ───────────────────────── Reportes (tesorería / admin) ─────────────────────────

function MReportes({ role, userId }) {
  const [anio, setAnio] = React.useState("2026");
  const [centro, setCentro] = React.useState("todos");
  const [tab, setTab] = React.useState("kpi");

  const data = window.SOLICITUDES.filter(s => {
    if (String(s.fecha.getFullYear()) !== anio) return false;
    const u = window.findUser(s.usuario);
    if (!u) return false;
    if (centro !== "todos" && u.centro !== centro) return false;
    return true;
  });

  const totalGasto = data.filter(s=>["liberado","comprobado","parcial"].includes(s.status)).reduce((a,s) => a + s.monto, 0);
  const totalDeudor = data.filter(s => s.tipo === "anticipo" && ["liberado","parcial"].includes(s.status) && (s.saldoPendiente||0) > 0).reduce((a,s) => a + (s.saldoPendiente||0), 0);
  const totalPend = data.filter(s => ["solicitado","autorizado"].includes(s.status)).reduce((a,s) => a + s.monto, 0);
  const compRate = totalGasto > 0 ? Math.round((totalGasto - totalDeudor) / totalGasto * 100) : 100;

  // Antigüedad
  const saldos = data.filter(s => s.tipo === "anticipo" && ["liberado","parcial"].includes(s.status) && (s.saldoPendiente||0) > 0);
  const buckets = {"0-15":[],"16-30":[],"31-60":[],"60+":[]};
  saldos.forEach(s => {
    const d = Math.floor((window.HOY - s.fecha)/(1000*60*60*24));
    if (d <= 15) buckets["0-15"].push(s);
    else if (d <= 30) buckets["16-30"].push(s);
    else if (d <= 60) buckets["31-60"].push(s);
    else buckets["60+"].push(s);
  });
  const sumB = (k) => buckets[k].reduce((a,s) => a + s.saldoPendiente, 0);

  // Top deudores
  const grouped = {};
  saldos.forEach(s => { grouped[s.usuario] = (grouped[s.usuario] || 0) + s.saldoPendiente; });
  const topDeu = Object.entries(grouped).sort((a,b) => b[1] - a[1]).slice(0, 5)
    .map(([uid, m]) => ({ u: window.findUser(uid), monto: m }));

  // Por centro (solo dinero efectivamente liberado)
  const porCentro = {};
  data.filter(s => ["liberado","comprobado","parcial"].includes(s.status)).forEach(s => {
    const u = window.findUser(s.usuario); if (!u) return;
    const c = window.findCentro(u.centro); if (!c) return;
    porCentro[c.nombre] = (porCentro[c.nombre] || 0) + s.monto;
  });
  const centroList = Object.entries(porCentro).sort((a,b) => b[1] - a[1]);
  const centroMax = Math.max(...centroList.map(([,v]) => v), 1);

  // Por tipo de gasto (cuenta contable)
  const porTipo = {};
  data.filter(s => ["liberado","comprobado","parcial"].includes(s.status)).forEach(s => {
    const items = s.cfdi && s.cfdi.length > 0 ? s.cfdi
      : s.items && s.items.length > 0 ? s.items.map(i => ({cuenta:i.cuenta, total:i.monto||0}))
      : [{cuenta:"6121200001", total:s.monto}];
    items.forEach(it => {
      const m = window.findCuenta(it.cuenta);
      const nombre = m ? m.nombre : "Otros";
      porTipo[nombre] = (porTipo[nombre] || 0) + (it.total || 0);
    });
  });
  const tipoList = Object.entries(porTipo).sort((a,b) => b[1] - a[1]).slice(0, 6);
  const tipoMax = Math.max(...tipoList.map(([,v]) => v), 1);

  // Gasto mensual
  const meses = ["E","F","M","A","M","J","J","A","S","O","N","D"];
  const mensual = Array(12).fill(0);
  data.filter(s=>["liberado","comprobado","parcial"].includes(s.status)).forEach(s => { mensual[s.fecha.getMonth()] += s.monto; });
  const mesMax = Math.max(...mensual, 1);

  // Status
  const byStatus = {solicitado:0, autorizado:0, liberado:0, comprobado:0, rechazado:0};
  data.forEach(s => { byStatus[s.status] = (byStatus[s.status] || 0) + 1; });

  const statusColors = {
    solicitado: "var(--info)", autorizado: "var(--warn)",
    liberado: "var(--accent)", comprobado: "var(--success)", rechazado: "var(--danger)",
  };

  return (
    <div className="m-pad">
      {/* Header con filtros */}
      <div style={{paddingTop:4, marginBottom:14}}>
        <div style={{fontSize:11, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.06em"}}>{role === "admin" ? "Admin" : "Tesorería"}</div>
        <div style={{fontFamily:"var(--f-display)", fontSize:22, fontWeight:600, letterSpacing:"-0.02em"}}>Reportes</div>
      </div>
      <div style={{display:"flex", gap:8, marginBottom:12}}>
        <select className="select" style={{flex:1, fontSize:12.5, padding:"7px 10px"}} value={anio} onChange={e => setAnio(e.target.value)}>
          <option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option>
        </select>
        <select className="select" style={{flex:2, fontSize:12.5, padding:"7px 10px"}} value={centro} onChange={e => setCentro(e.target.value)}>
          <option value="todos">Todos los centros</option>
          {window.CENTROS.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
        </select>
      </div>

      {/* Tabs horizontales */}
      <div style={{display:"flex", gap:6, overflowX:"auto", paddingBottom:10, marginBottom:4}}>
        {[
          {k:"kpi", l:"Resumen"},
          {k:"aging", l:"Antigüedad"},
          {k:"top", l:"Deudores"},
          {k:"centro", l:"Por área"},
          {k:"tipo", l:"Por gasto"},
          {k:"mes", l:"Mensual"},
        ].map(t => (
          <div key={t.k} className={`chip ${tab === t.k ? "active" : ""}`} onClick={() => setTab(t.k)} style={{flexShrink:0, fontSize:11.5}}>{t.l}</div>
        ))}
      </div>

      {/* Tab: Resumen / KPIs */}
      {tab === "kpi" && (
        <>
          <div className="m-card" style={{margin:0, marginBottom:8, padding:14}}>
            <div style={{fontSize:10.5, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600}}>Gasto total {anio}</div>
            <div style={{fontFamily:"var(--f-display)", fontSize:24, fontWeight:600, marginTop:2}}>{window.fmtMXN(totalGasto)}</div>
            <div style={{fontSize:11, color:"var(--text-3)", marginTop:4}}>{data.length} solicitudes</div>
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8}}>
            <div className="m-card" style={{margin:0, padding:12}}>
              <div style={{fontSize:10.5, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600}}>Saldo abierto</div>
              <div style={{fontFamily:"var(--f-display)", fontSize:17, fontWeight:600, color:"var(--danger)", marginTop:2}}>{window.fmtMXN(totalDeudor)}</div>
              <div style={{fontSize:10.5, color:"var(--text-3)", marginTop:2}}>{saldos.length} deudores</div>
            </div>
            <div className="m-card" style={{margin:0, padding:12}}>
              <div style={{fontSize:10.5, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600}}>Pendiente flujo</div>
              <div style={{fontFamily:"var(--f-display)", fontSize:17, fontWeight:600, color:"var(--warn)", marginTop:2}}>{window.fmtMXN(totalPend)}</div>
            </div>
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14}}>
            <div className="m-card" style={{margin:0, padding:12}}>
              <div style={{fontSize:10.5, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600}}>Tasa compr.</div>
              <div style={{fontFamily:"var(--f-display)", fontSize:17, fontWeight:600, color:compRate >= 85 ? "var(--success)" : "var(--warn)", marginTop:2}}>{compRate}%</div>
            </div>
            <div className="m-card" style={{margin:0, padding:12}}>
              <div style={{fontSize:10.5, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600}}>Ticket prom.</div>
              <div style={{fontFamily:"var(--f-display)", fontSize:17, fontWeight:600, marginTop:2}}>{window.fmtMXN(data.length > 0 ? totalGasto / data.length : 0)}</div>
            </div>
          </div>

          <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text-3)", margin:"4px 4px 8px", fontWeight:600}}>Status</div>
          <div className="m-card" style={{margin:0}}>
            {[
              {k:"solicitado", l:"Solicitado"},
              {k:"autorizado", l:"Autorizado"},
              {k:"liberado", l:"Liberado"},
              {k:"comprobado", l:"Comprobado"},
              {k:"rechazado", l:"Rechazado"},
            ].map(s => {
              const cnt = byStatus[s.k] || 0;
              const pct = data.length > 0 ? Math.round(cnt/data.length*100) : 0;
              return (
                <div key={s.k} style={{display:"flex", alignItems:"center", gap:10, padding:"6px 0"}}>
                  <div style={{width:8, height:8, borderRadius:"50%", background:statusColors[s.k]}}/>
                  <div style={{flex:1, fontSize:12.5}}>{s.l}</div>
                  <div className="mono" style={{fontSize:12.5, fontWeight:600}}>{cnt}</div>
                  <div className="mono muted" style={{fontSize:11, width:38, textAlign:"right"}}>{pct}%</div>
                </div>
              );
            })}
          </div>
        </>
      )}

      {/* Tab: Antigüedad */}
      {tab === "aging" && (
        <>
          <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text-3)", margin:"4px 4px 8px", fontWeight:600}}>Antigüedad de saldos abiertos</div>
          {[
            {k:"0-15", l:"0 a 15 días", color:"var(--accent)", danger:false},
            {k:"16-30", l:"16 a 30 días", color:"var(--info)", danger:false},
            {k:"31-60", l:"31 a 60 días", color:"var(--warn)", danger:true},
            {k:"60+", l:"60+ días", color:"var(--danger)", danger:true},
          ].map(b => {
            const monto = sumB(b.k);
            const cnt = buckets[b.k].length;
            const pct = totalDeudor > 0 ? Math.round(monto/totalDeudor*100) : 0;
            return (
              <div key={b.k} className="m-card" style={{margin:"0 0 8px", padding:14}}>
                <div className="spread" style={{marginBottom:6}}>
                  <span style={{fontSize:12, fontWeight:500}}>{b.l}</span>
                  <span className="muted" style={{fontSize:11}}>{cnt} anticipos · {pct}%</span>
                </div>
                <div style={{fontFamily:"var(--f-display)", fontSize:20, fontWeight:600, color:b.danger ? b.color : undefined, marginBottom:8}}>{window.fmtMXN(monto)}</div>
                <div style={{height:4, background:"var(--surface-3)", borderRadius:2, overflow:"hidden"}}>
                  <div style={{height:"100%", width:`${pct}%`, background:b.color, borderRadius:2}}/>
                </div>
              </div>
            );
          })}
        </>
      )}

      {/* Tab: Top deudores */}
      {tab === "top" && (
        <>
          <div className="m-card" style={{margin:"0 0 10px", background:"linear-gradient(135deg, var(--danger), oklch(from var(--danger) calc(l - 0.2) c h))", color:"#fff", border:"none", padding:14}}>
            <div style={{fontSize:11.5, opacity:0.7, textTransform:"uppercase", letterSpacing:"0.06em", fontWeight:600}}>Total deudor</div>
            <div style={{fontFamily:"var(--f-display)", fontSize:26, fontWeight:700, marginTop:2}}>{window.fmtMXN(totalDeudor)}</div>
          </div>
          {topDeu.length === 0 && <M_Empty icon="check" title="Sin deudores" sub="Todo está al corriente"/>}
          {topDeu.map((d, i) => (
            <div key={d.u.id} className="m-card" style={{display:"flex", alignItems:"center", gap:12}}>
              <div className="mono" style={{fontSize:14, fontWeight:600, color:"var(--text-3)", width:18}}>{i+1}</div>
              <div className="avatar sm">{d.u.iniciales}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13, fontWeight:500}}>{d.u.nombre}</div>

              <div key={nombre} className="m-card" style={{margin:"0 0 8px"}}>

                </div>
              </div>
            );
          })}
          {centroList.length === 0 && <M_Empty title="Sin datos" sub="No hay gasto registrado"/>}
        </>
      )}

      {/* Tab: Por tipo de gasto */}
      {tab === "tipo" && (
        <>
          <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text-3)", margin:"4px 4px 8px", fontWeight:600}}>Por cuenta contable</div>
          {tipoList.map(([nombre, monto]) => {
            const pct = Math.round(monto/tipoMax*100);
            const pctTotal = totalGasto > 0 ? Math.round(monto/totalGasto*100) : 0;
            return (
              <div key={nombre} className="m-card" style={{margin:"0 0 8px"}}>
                <div className="spread" style={{marginBottom:6}}>
                  <span style={{fontSize:12.5, fontWeight:500}}>{nombre}</span>

                </div>

            );
          })}
          {tipoList.length === 0 && <M_Empty title="Sin datos" sub="No hay gasto registrado"/>}
        </>
      )}

      {/* Tab: Gasto mensual */}
      {tab === "mes" && (
        <>
          <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text-3)", margin:"4px 4px 8px", fontWeight:600}}>Gasto mensual {anio}</div>
          <div className="m-card" style={{margin:0}}>
            <div style={{display:"flex", alignItems:"flex-end", gap:4, height:140, padding:"0 4px"}}>
              {mensual.map((v, i) => {
                const pct = mesMax > 0 ? v/mesMax : 0;
                const h = Math.max(pct * 130, v > 0 ? 4 : 0);
                const isCurrent = i === window.HOY.getMonth() && anio === "2026";
                return (
                  <div key={i} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:3, height:"100%", justifyContent:"flex-end"}}>
                    <div style={{width:"100%", height:h, borderRadius:"3px 3px 0 0", background:isCurrent ? "var(--accent)" : "var(--accent-soft)"}}/>

  );

function MobileApp({ userId, role, onLogout, setPage, openDetail }) {
  const [tab, setTab] = React.useState("home");
  const [stack, setStack] = React.useState([]);
  const [snack, setSnack] = React.useState(null);

  const push = (s) => setStack(prev => [...prev, s]);
  const pop = () => setStack(prev => prev.slice(0, -1));
  const showSnack = (msg) => { setSnack(msg); setTimeout(() => setSnack(null), 2500); };

  // Reset cuando cambia rol o usuario
  React.useEffect(() => { setTab("home"); setStack([]); }, [role, userId]);

  const goToPage = (page) => { if (setPage) setPage(page); };

  // ── Render screen del stack ──
  const current = stack[stack.length - 1];
  let body, headerTitle, headerSub, headerBack;

  if (current) {
    headerBack = pop;
    if (current.name === "detalle") {
      const s = window.SOLICITUDES.find(x => x.id === current.id);
      headerTitle = s ? s.id : "Detalle";
      headerSub = s ? s.concepto.slice(0, 30) + (s.concepto.length > 30 ? "…" : "") : null;
      body = <MDetalle id={current.id}/>;
    } else if (current.name === "admin-usuarios") {
      headerTitle = "Usuarios";
      headerSub = `${window.USUARIOS.length} registrados`;
      body = <MAdminUsuarios/>;
    } else if (current.name === "admin-centros") {
      headerTitle = "Centros de beneficio";
      headerSub = `${window.CENTROS.length} unidades`;
      body = <MAdminCentros/>;
    } else if (current.name === "admin-catalogo") {
      headerTitle = "Catálogo de gastos";
      headerSub = `${window.CATALOGO_GASTOS.length} cuentas`;
      body = <MContadorCatalogo/>;
    } else if (current.name === "nuevo-anticipo") {
      headerTitle = "Nuevo anticipo";
      headerSub = "Solicita un viaje o gasto";
      body = <MNuevoAnticipo userId={userId} onDone={() => { setStack([]); setTab("home"); }} showSnack={showSnack}/>;
    } else if (current.name === "nuevo-reembolso") {
      headerTitle = "Nuevo reembolso";
      headerSub = "Gasto pagado de tu bolsa";
      body = <MNuevoReembolso userId={userId} onDone={() => { setStack([]); setTab("home"); }}/>;
    } else if (current.name === "nueva-comprobacion") {
      headerTitle = "Nueva comprobación";
      headerSub = "Comprueba un anticipo";
      body = <MNuevaComprobacion userId={userId} onDone={() => { setStack([]); setTab("home"); }} showSnack={showSnack}/>;
    }
  } else {
    // ── Render tab home del rol ──
    if (role === "usuario") {
      if (tab === "home")    body = <MUserHome userId={userId} push={push} setTab={setTab}/>;
      if (tab === "scan")    { headerTitle = "Subir factura"; body = <div className="m-pad"><MobileScan userId={userId} onDone={() => setTab("home")}/></div>; }
      if (tab === "list")    { headerTitle = "Mis solicitudes"; body = <MUserList userId={userId} push={push}/>; }
      if (tab === "profile") { headerTitle = "Mi perfil"; body = <MProfile userId={userId} onLogout={onLogout}/>; }
    } else if (role === "gerente") {
      if (tab === "home")    body = <MGerenteBandeja userId={userId} push={push} showSnack={showSnack}/>;
      if (tab === "mio")     body = <MUserHome userId={userId} push={push} setTab={setTab}/>;
      if (tab === "equipo")  { headerTitle = "Mi equipo"; body = <MGerenteEquipo userId={userId} push={push}/>; }
      if (tab === "hist")    { headerTitle = "Historial"; body = <MGerenteHistorial userId={userId} push={push}/>; }
      if (tab === "profile") { headerTitle = "Mi perfil"; body = <MProfile userId={userId} onLogout={onLogout}/>; }
    } else if (role === "tesoreria") {
      if (tab === "home")     body = <MTesoreriaLiberar push={push} showSnack={showSnack}/>;
      if (tab === "pagados")  { headerTitle = "Pagados"; body = <MTesoreriaPagados push={push}/>; }
      if (tab === "deudores") { headerTitle = "Deudores"; body = <MTesoreriaDeudores push={push}/>; }
      if (tab === "reportes") { body = <MReportes role={role} userId={userId}/>; }
      if (tab === "profile")  { headerTitle = "Mi perfil"; body = <MProfile userId={userId} onLogout={onLogout}/>; }
    } else if (role === "contador") {
      if (tab === "home")     body = <MContadorPolizas push={push} showSnack={showSnack}/>;
      if (tab === "catalogo") { headerTitle = "Catálogo de gastos"; body = <MContadorCatalogo/>; }
      if (tab === "profile")  { headerTitle = "Mi perfil"; body = <MProfile userId={userId} onLogout={onLogout}/>; }
    } else if (role === "admin") {
      if (tab === "home")     body = <MAdminHome push={push} goToPage={goToPage} setTab={setTab}/>;
      if (tab === "bandeja")  { headerTitle = "Aprobaciones"; body = <MGerenteBandeja userId={userId} push={push} showSnack={showSnack}/>; }
      if (tab === "usuarios") { headerTitle = "Usuarios"; body = <MAdminUsuarios/>; }
      if (tab === "centros")  { headerTitle = "Centros"; body = <MAdminCentros/>; }
      if (tab === "reportes") { body = <MReportes role={role} userId={userId}/>; }
      if (tab === "profile")  { headerTitle = "Mi perfil"; body = <MProfile userId={userId} onLogout={onLogout}/>; }
    }
  }

  const tabs = M_TABS[role] || M_TABS.usuario;

  return (
    <div className="phone-wrap">
      <div className="phone">
        <div className="phone-notch"></div>
        <M_Status/>
        <div className="phone-screen">
          {(headerTitle || headerBack) && <M_Header title={headerTitle} sub={headerSub} onBack={headerBack}/>}
          <div style={{flex:1, overflowY:"auto"}}>
            {body}
          </div>
          <M_Snack msg={snack}/>
        </div>
        {!current && <M_Tabs items={tabs} current={tab} onChange={setTab}/>}
      </div>
    </div>
  );
}

function applyTokens(t) {
  const root = document.documentElement;
  const a = ACCENTS[t.accent] || ACCENTS.lime;
  root.style.setProperty("--accent", a.v);
  root.style.setProperty("--accent-2", a.v2);
  root.style.setProperty("--accent-soft", a.soft);
  root.style.setProperty("--accent-fg", a.fg);
  root.dataset.density = t.density;
  root.dataset.theme = t.theme;
}

  if (role === "usuario") {
    if (page === "dash")           return <UserDashboard userId={userId} openDetail={setDetailId} setPage={setPage}/>;
    if (page === "anticipos")      return <SolicitarAnticipo setPage={setPage} userId={userId}/>;
    if (page === "comprobaciones") return <NuevaComprobacion setPage={setPage} userId={userId}/>;
    if (page === "reembolsos")     return <Reembolsos userId={userId} setPage={setPage}/>;
    if (page === "nuevo-reembolso") return <NuevoReembolso setPage={setPage} userId={userId}/>;
    if (page === "cerrar-anticipo") return <CierreAnticipo setPage={setPage} userId={userId} anticipoId={window.CIERRE_ANT_ID}/>;

    return <UserDashboard userId={userId} openDetail={setDetailId} setPage={setPage}/>;

  if (role === "gerente") {
    if (page === "bandeja")          return <GerenteBandeja openDetail={setDetailId} userId={userId} role={role}/>;
    if (page === "reportes")         return <Reportes role={role} userId={userId}/>;
    if (page === "equipo")           return <GerenteEquipo userId={userId}/>;
    if (page === "historial")        return <GerenteHistorial openDetail={setDetailId} userId={userId}/>;
    if (page === "mis-solicitudes")  return <UserDashboard userId={userId} openDetail={setDetailId} setPage={setPage}/>;
    if (page === "anticipos")        return <SolicitarAnticipo setPage={setPage} userId={userId}/>;
    if (page === "reembolsos")       return <Reembolsos userId={userId} setPage={setPage}/>;
    if (page === "nuevo-reembolso")  return <NuevoReembolso setPage={setPage} userId={userId}/>;
    if (page === "cerrar-anticipo")  return <CierreAnticipo setPage={setPage} userId={userId} anticipoId={window.CIERRE_ANT_ID}/>;

    return <GerenteBandeja openDetail={setDetailId} userId={userId} role={role}/>;
  }

  if (role === "tesoreria") {
    if (page === "liberacion") return <TesoreriaBandeja openDetail={setDetailId}/>;
    if (page === "pagados")    return <TesoreriaPagados openDetail={setDetailId}/>;
    if (page === "deudores")   return <Deudores role={role} userId={userId}/>;
    if (page === "reportes")   return <Reportes role={role} userId={userId}/>;
    return <TesoreriaBandeja openDetail={setDetailId}/>;

  if (role === "admin") {
    // Admin páginas propias
    if (page === "usuarios")  return <AdminUsuarios/>;
    if (page === "centros")   return <AdminCentros/>;
    if (page === "catalogo")  return <AdminCatalogo/>;
    if (page === "reportes")  return <Reportes role={role} userId={userId}/>;
    if (page === "ajustes")   return <AdminAjustes/>;
    // Admin operando como tesorería
    if (page === "liberacion") return <TesoreriaBandeja openDetail={setDetailId}/>;
    if (page === "pagados")    return <TesoreriaPagados openDetail={setDetailId}/>;
    if (page === "deudores")   return <Deudores role={role} userId={userId}/>;
    // Admin operando como gerente
    if (page === "bandeja")         return <GerenteBandeja openDetail={setDetailId} userId={userId} role={role}/>;
    if (page === "equipo")          return <GerenteEquipo userId={userId}/>;
    if (page === "historial")       return <GerenteHistorial openDetail={setDetailId} userId={userId}/>;
    // Admin operando como usuario
    if (page === "dash")            return <UserDashboard userId={userId} openDetail={setDetailId} setPage={setPage}/>;
    if (page === "anticipos")       return <SolicitarAnticipo setPage={setPage} userId={userId}/>;

function TesoreriaPagados({ openDetail }) {
  const [, forceTP] = React.useReducer(x=>x+1, 0);
  React.useEffect(() => {
    if (!window.sb) return;
    window.sb.from("solicitudes").select("*")
      .in("status",["liberado","comprobado"])
      .order("fecha",{ascending:false}).limit(200)
      .then(({data})=>{
        if (!data) return;
        data.forEach(s=>{
          const m={id:s.id,tipo:s.tipo,concepto:s.concepto,usuario:s.usuario_id,
            monto:parseFloat(s.monto)||0,fecha:new Date(s.fecha),status:s.status,
            saldoPendiente:parseFloat(s.saldo_pendiente)||0};
          const ix=window.SOLICITUDES.findIndex(x=>x.id===m.id);
          if(ix>=0) Object.assign(window.SOLICITUDES[ix],m);
          else window.SOLICITUDES.unshift(m);
        });
        forceTP();
      });
  }, []);
  const pagados = window.SOLICITUDES.filter(s => ["liberado","comprobado"].includes(s.status));
  const [busqueda, setBusqueda] = React.useState("");
  const filtrados = pagados.filter(s => {
    if (!busqueda.trim()) return true;
    const q=busqueda.toLowerCase();
    const u=window.findUser(s.usuario);
    return s.id.toLowerCase().includes(q)||u.nombre.toLowerCase().includes(q)||s.concepto.toLowerCase().includes(q);
  });
  const exportar = () => {
    const rows=[["Folio","Tipo","Beneficiario","Concepto","Fecha","Monto"]];
    filtrados.forEach(s=>{const u=window.findUser(s.usuario);rows.push([s.id,s.tipo,u.nombre,s.concepto,window.fmtFecha(s.fecha),s.monto]);});
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download=`pagados_${new Date().toISOString().slice(0,10)}.csv`;a.click();
  };
  return (
    <>
      <div className="page-head">
        <div><h1 className="page-title">Pagados</h1>
          <div className="page-sub">Solicitudes liberadas · {pagados.length} registros · {window.fmtMXN(pagados.reduce((a,s)=>a+s.monto,0))}</div>
        </div>
        <button className="btn" onClick={exportar}><Icon name="download" size={13}/> Exportar</button>
      </div>
      <div className="card" style={{padding:0}}>
        <div style={{padding:"12px 16px 0",display:"flex",gap:10}}>
          <div className="search" style={{width:260}}>
            <Icon name="search" size={14}/>
            <input placeholder="Buscar folio, nombre…" value={busqueda} onChange={e=>setBusqueda(e.target.value)}/>
          </div>
        </div>
        <table className="t">
          <thead><tr><th></th><th>Folio</th><th>Beneficiario</th><th>Concepto</th><th>Fecha</th><th className="right">Monto</th></tr></thead>
          <tbody>
            {filtrados.length===0
              ? <tr><td colSpan={6} style={{textAlign:"center",padding:"24px",color:"var(--text-3)"}}>Sin resultados</td></tr>
              : filtrados.map(s=>{
                const u=window.findUser(s.usuario);
                return (
                  <tr key={s.id} onClick={()=>openDetail(s.id)} style={{cursor:"pointer"}}>
                    <td><TipoBadge tipo={s.tipo}/></td>
                    <td className="id-cell">{s.id}</td>
                    <td><div className="row"><div className="avatar sm">{u.iniciales}</div><span style={{fontSize:13}}>{u.nombre}</span></div></td>
                    <td className="muted">{s.concepto}</td>
                    <td className="muted mono" style={{fontSize:12}}>{window.fmtFecha(s.fecha)}</td>
                    <td className="num">{window.fmtMXN(s.monto)}</td>
                  </tr>
                );
              })
            }
          </tbody>
        </table>
      </div>
    </>
  );
}

function LoginScreen({ onLogin }) {
  const [correo, setCorreo]   = React.useState("");
  const [pwd, setPwd]         = React.useState("");
  const [error, setError]     = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [showPwd, setShowPwd] = React.useState(false);
  const [screen, setScreen]   = React.useState("login"); // "login" | "recovery" | "token" | "newpwd"
  const [recCorreo, setRecCorreo] = React.useState("");
  const [recToken, setRecToken]   = React.useState("");
  const [recPwd, setRecPwd]       = React.useState("");
  const [recPwd2, setRecPwd2]     = React.useState("");
  const [recMsg, setRecMsg]       = React.useState("");
  const [sentToken, setSentToken] = React.useState("");

  const handleLogin = async (e) => {
    e.preventDefault();
    setError("");
    if (!correo.trim() || !pwd) { setError("Ingresa tu correo y contraseña"); return; }
    setLoading(true);
    try {
      const user = await window.sbLogin(correo.trim(), pwd);
      onLogin(user);
    } catch (err) {
      const msg = err && err.message ? err.message : "Error al iniciar sesión";
      setError(/invalid|credentials/i.test(msg) ? "Correo o contraseña incorrectos" : msg);
      setLoading(false);
    }
  };

  const handleSendToken = async (e) => {
    e.preventDefault();
    setRecMsg("");
    if (!recCorreo.trim()) { setRecMsg("Ingresa tu correo"); return; }
    try {
      const { error } = await window.sb.auth.resetPasswordForEmail(recCorreo.trim(), {
        redirectTo: window.location.origin + window.location.pathname,
      });
      if (error) throw error;
      setScreen("sent");
    } catch (err) {
      setRecMsg(err.message || "No se pudo enviar el correo de recuperación");
    }
  };

  const handleVerifyToken = (e) => {
    // Ya no se usa — Supabase maneja la verificación con link de email
    e.preventDefault();
    setScreen("login");
  };

  const handleNewPwd = async (e) => {
    e.preventDefault();
    if (recPwd.length < 6) { setRecMsg("La contraseña debe tener al menos 6 caracteres"); return; }
    if (recPwd !== recPwd2) { setRecMsg("Las contraseñas no coinciden"); return; }
    try {
      const { error } = await window.sb.auth.updateUser({ password: recPwd });
      if (error) throw error;
      setRecMsg("ok");
      setTimeout(() => { setScreen("login"); setRecMsg(""); setRecCorreo(""); setRecPwd(""); setRecPwd2(""); }, 1800);
    } catch (err) {
      setRecMsg(err.message || "No se pudo actualizar la contraseña");

    width: 400, background: "var(--color-bg, var(--surface-1, #18191c))",

    position:"fixed", inset:0, display:"flex", alignItems:"center", justifyContent:"center",
    background:"var(--surface-0,#111214)", zIndex:500

              <input style={inputStyle} type="password" placeholder="Nueva contraseña (mín. 6 caracteres)"
                value={recPwd} onChange={e=>setRecPwd(e.target.value)} autoFocus/>
              <input style={inputStyle} type="password" placeholder="Confirmar contraseña"
                value={recPwd2} onChange={e=>setRecPwd2(e.target.value)}/>
              {recMsg === "ok"
                ? <div style={{fontSize:13,color:"var(--success,#1d9e75)",fontWeight:500}}>✓ Contraseña actualizada. Iniciando sesión…</div>
                : recMsg && <div style={{fontSize:12,color:"var(--danger,#e24b4a)"}}>{recMsg}</div>
              }
              <button style={btnStyle} type="submit">Guardar contraseña</button>
            </form>
          )}

          <div style={{marginTop:20,textAlign:"center"}}>
            <button style={linkStyle} onClick={()=>{setScreen("login");setRecMsg("");}}>← Volver al inicio de sesión</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={wrapStyle}>
      <div style={cardStyle}>
        <div style={{marginBottom:32}}>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",color:"var(--accent)",marginBottom:8}}>ZAPATA CAMIONES</div>
          <h1 style={{fontSize:26,fontWeight:700,margin:"0 0 6px",letterSpacing:"-0.03em"}}>Viáticos</h1>
          <p style={{fontSize:13,color:"var(--text-2,rgba(255,255,255,.5))",margin:0}}>Control de gastos de viaje</p>
        </div>

        <form onSubmit={handleLogin} style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <label style={{fontSize:12,fontWeight:500,color:"var(--text-2,rgba(255,255,255,.6))"}}>Correo electrónico</label>
            <input style={inputStyle} type="email" placeholder="tu@casazapata.mx"
              value={correo} onChange={e=>{setCorreo(e.target.value);setError("");}}
              autoComplete="email" autoFocus/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
              <label style={{fontSize:12,fontWeight:500,color:"var(--text-2,rgba(255,255,255,.6))"}}>Contraseña</label>
              <button type="button" style={linkStyle}
                onClick={()=>{setScreen("recovery");setRecCorreo(correo);}}>
                ¿Olvidaste tu contraseña?
              </button>
            </div>
            <div style={{position:"relative"}}>
              <input style={{...inputStyle,paddingRight:40}}
                type={showPwd?"text":"password"} placeholder="••••••••"
                value={pwd} onChange={e=>{setPwd(e.target.value);setError("");}}
                autoComplete="current-password"/>
              <button type="button"
                onClick={()=>setShowPwd(v=>!v)}
                style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",
                  background:"none",border:"none",color:"var(--text-3,rgba(255,255,255,.35))",cursor:"pointer",padding:4}}>
                <Icon name={showPwd?"eye":"eye"} size={15}/>
              </button>
            </div>
          </div>

          {error && (
            <div style={{padding:"8px 12px",background:"rgba(226,75,74,.12)",border:"1px solid rgba(226,75,74,.4)",
              borderRadius:8,fontSize:13,color:"#e24b4a"}}>
              {error}
            </div>
          )}

          <button style={{...btnStyle,opacity:loading?0.7:1}} type="submit" disabled={loading}>
            {loading ? "Verificando…" : "Iniciar sesión"}
          </button>
        </form>

        <div style={{marginTop:24,padding:"14px 0 0",borderTop:"1px solid var(--border)",
          fontSize:11,color:"var(--text-3,rgba(255,255,255,.3))",textAlign:"center"}}>
          Contraseña inicial: <span style={{fontFamily:"monospace",color:"var(--text-2,rgba(255,255,255,.5))"}}>1234</span>
        </div>
      </div>
    </div>
  );
}

// ── PasswordResetScreen: cuando el usuario llega desde el link de email ──────
function PasswordResetScreen({ onDone }) {
  const [pwd, setPwd]   = React.useState("");
  const [pwd2, setPwd2] = React.useState("");
  const [msg, setMsg]   = React.useState("");
  const [done, setDone] = React.useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (pwd.length < 6)  { setMsg("La contraseña debe tener al menos 6 caracteres"); return; }
    if (pwd !== pwd2)    { setMsg("Las contraseñas no coinciden"); return; }
    try {
      const { error } = await window.sb.auth.updateUser({ password: pwd });
      if (error) throw error;
      setDone(true);
      setMsg("");
      // Cierra sesión de recuperación y regresa al login
      setTimeout(async () => {
        await window.sb.auth.signOut();
        onDone();
      }, 1800);
    } catch (err) {
      setMsg(err.message || "No se pudo actualizar la contraseña");
    }
  };

  const cardStyle = {
    width: 400, background: "var(--surface)", border: "1px solid var(--border)",
    borderRadius: 16, padding: "36px 40px", boxShadow: "0 24px 64px rgba(0,0,0,.45)"
  };
  const inputStyle = {
    width:"100%", padding:"10px 12px", fontSize:14,
    border:"1px solid var(--border)", borderRadius:8,
    background:"var(--surface-2)", color:"var(--text)",
    fontFamily:"inherit", outline:"none", boxSizing:"border-box"
  };
  const btnStyle = {
    width:"100%", padding:"11px", fontSize:14, fontWeight:600, cursor:"pointer",
    border:"none", borderRadius:8, background:"var(--accent)", color:"var(--accent-fg,#0a0b0f)",
    fontFamily:"inherit", marginTop:4
  };

  return (
    <div style={{position:"fixed", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)", zIndex:500, padding:20}}>
      <div style={cardStyle}>
        <div style={{marginBottom:28}}>
          <div style={{fontSize:11, fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", color:"var(--accent)", marginBottom:6}}>Viáticos</div>
          <h1 style={{fontSize:22, fontWeight:700, margin:"0 0 4px", letterSpacing:"-0.02em"}}>Nueva contraseña</h1>
          <p style={{fontSize:13, color:"var(--text-3)", margin:0}}>Establece tu nueva contraseña para continuar</p>
        </div>
        {done ? (
          <div style={{padding:"14px 16px", background:"rgba(29,158,117,.12)", border:"1px solid rgba(29,158,117,.4)", borderRadius:8, fontSize:13, color:"var(--success)"}}>
            ✓ Contraseña actualizada. Te redirigimos al inicio de sesión…
          </div>
        ) : (
          <form onSubmit={handleSubmit} style={{display:"flex", flexDirection:"column", gap:14}}>
            <input style={inputStyle} type="password" placeholder="Nueva contraseña (mín. 6 caracteres)"
              value={pwd} onChange={e => setPwd(e.target.value)} autoFocus/>
            <input style={inputStyle} type="password" placeholder="Confirmar contraseña"
              value={pwd2} onChange={e => setPwd2(e.target.value)}/>
            {msg && <div style={{fontSize:12, color:"var(--danger)"}}>{msg}</div>}
            <button style={btnStyle} type="submit">Guardar contraseña</button>
          </form>
        )}
      </div>
    </div>
  );
}

// ── Modal: cambiar contraseña desde el perfil (usuario logueado) ─────────────
function CambiarPasswordModal({ onClose }) {
  const [pwd, setPwd]     = React.useState("");
  const [pwd2, setPwd2]   = React.useState("");
  const [msg, setMsg]     = React.useState("");
  const [loading, setLoading] = React.useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setMsg("");
    if (pwd.length < 6) { setMsg("La contraseña debe tener al menos 6 caracteres"); return; }
    if (pwd !== pwd2)   { setMsg("Las contraseñas no coinciden"); return; }
    setLoading(true);
    try {
      const { error } = await window.sb.auth.updateUser({ password: pwd });
      if (error) throw error;
      setMsg("ok");
      setTimeout(onClose, 1500);
    } catch (err) {
      setMsg(err.message || "No se pudo actualizar la contraseña");
      setLoading(false);
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{maxWidth:440}}>
        <div className="modal-head">
          <h2 className="modal-title">Cambiar contraseña</h2>
          <div className="icon-btn" onClick={onClose}><Icon name="x" size={14}/></div>
        </div>
        <div className="modal-body">
          <form onSubmit={handleSubmit} style={{display:"flex", flexDirection:"column", gap:12}}>
            <div className="field">
              <label>Nueva contraseña</label>
              <input className="input" type="password" placeholder="Mínimo 6 caracteres"
                value={pwd} onChange={e => setPwd(e.target.value)} autoFocus/>
            </div>
            <div className="field">
              <label>Confirmar contraseña</label>
              <input className="input" type="password" placeholder="Repítela"
                value={pwd2} onChange={e => setPwd2(e.target.value)}/>
            </div>
            {msg === "ok" && <div style={{fontSize:13, color:"var(--success)", fontWeight:500}}>✓ Contraseña actualizada</div>}
            {msg && msg !== "ok" && <div style={{fontSize:12, color:"var(--danger)"}}>{msg}</div>}
            <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:8}}>
              <button type="button" className="btn ghost" onClick={onClose}>Cancelar</button>
              <button type="submit" className="btn primary" disabled={loading}>{loading ? "Guardando…" : "Guardar"}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [t, setTweak]       = window.useTweaks(TWEAK_DEFAULTS);
  const [detailId, setDetailId] = React.useState(null);
  const [session, setSession]   = React.useState(null); // { user } | null
  const [booting, setBooting]   = React.useState(true);
  const [recoveryMode, setRecoveryMode] = React.useState(false);

  const [page, setPage] = React.useState(() => DEFAULT_PAGE[TWEAK_DEFAULTS.role] || "dash");

  // ── Bootstrap: carga catálogos y verifica sesión existente ────────────────
  const [dbLoaded, setDbLoaded] = React.useState(false);

  React.useEffect(() => {
    (async () => {
      // 1. Verificar sesión existente primero (es rápido — solo JWT local)
      const existing = await window.sbGetSession();
      if (existing) {
        // Mostrar UI inmediatamente con datos locales/seed
        setSession({ user: existing });
        const role = existing.rol;
        setPage(DEFAULT_PAGE[role] || "dash");
        setTweak("role", role);
        setBooting(false);  // ← mostrar UI YA, sin esperar Supabase

        // 2. Cargar datos reales en background sin bloquear UI
        await window.loadFromDB();
        await window.loadSolicitudes();
        setDbLoaded(true);  // ← fuerza re-render con datos reales
      } else {
        // Sin sesión: cargar catálogos y mostrar login
        await window.loadFromDB();
        setBooting(false);
      }
    })();
  }, []);

  // ── Detectar evento PASSWORD_RECOVERY (link de email) ─────────────────────
  React.useEffect(() => {
    if (!window.sb) return;
    const { data: sub } = window.sb.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        setRecoveryMode(true);
        setSession(null);
      } else if (event === "SIGNED_OUT") {
        setRecoveryMode(false);
      }
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  React.useEffect(() => { applyTokens(t); }, [t]);

  // Auto-detectar móvil real y forzar vista móvil al cargar
  React.useEffect(() => {
    const mobileUA = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const narrowScreen = window.innerWidth < 768;
    if ((mobileUA || narrowScreen) && t.density !== "mobile") {
      setTweak("density", "mobile");
    }
  }, []); // solo en mount

  // ── Login / logout ────────────────────────────────────────────────────────
  const handleLogin = (user) => {
    const roleMap = { usuario:"usuario", gerente:"gerente", tesoreria:"tesoreria", admin:"admin", contador:"contador" };
    const role = roleMap[user.rol] || "usuario";
    setSession({ user });
    setPage(DEFAULT_PAGE[role] || "dash");
    setTweak("role", role);
    // Cargar solicitudes en background — UI ya visible
    window.loadSolicitudes().then(() => setDbLoaded(d => !d));
  };

  // Desde la vista móvil: navegar a un formulario y salir del modo móvil
  const setPageFromMobile = (page) => {
    setTweak("density", "comfortable");
    setPage(page);
  };

  const handleLogout = async () => {
    await window.sbLogout();
    setSession(null);
    setPage("dash");
  };

  if (booting) {
    return (
      <div style={{position:"fixed", inset:0, display:"grid", placeItems:"center", background:"var(--bg)", color:"var(--text)"}}>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"var(--f-display)", fontSize:28, fontWeight:700, letterSpacing:"-0.03em", marginBottom:8}}>Viáticos</div>
          <div style={{fontSize:13, color:"var(--text-3)", marginBottom:20}}>ZAPATA CAMIONES</div>
          <div style={{width:32, height:32, border:"3px solid var(--border)", borderTopColor:"var(--accent)",
            borderRadius:"50%", margin:"0 auto", animation:"spin 0.8s linear infinite"}}/>
        </div>
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    );
  }

  if (recoveryMode) {
    return <PasswordResetScreen onDone={() => { setRecoveryMode(false); window.location.hash = ""; }}/>;
  }

  if (!session) {
    return <LoginScreen onLogin={handleLogin}/>;
  }

  // Rol SIEMPRE viene del usuario logueado — no se puede cambiar desde la UI
  const role   = session.user.rol;   // "usuario" | "gerente" | "tesoreria" | "admin"
  const userId = session.user.id;
  const isAdmin = role === "admin";
  const isMobileView = t.density === "mobile";

  // Admin puede operar como cualquier rol; los demás usan su rol fijo
  const activeRole = isAdmin ? (t.role || role) : role;

  // Cuando admin opera como otro rol, usar las páginas válidas de ese rol
  const validPages = VALID_PAGES[activeRole] || VALID_PAGES[role] || [];
  const activePage = validPages.includes(page) ? page : DEFAULT_PAGE[activeRole] || DEFAULT_PAGE[role];

  const PAGE_LABELS = {
    dash:"Mi resumen", anticipos:"Mis anticipos", comprobaciones:"Comprobaciones", reembolsos:"Reembolsos",
    bandeja:"Por aprobar", equipo:"Mi equipo", historial:"Historial", reportes:"Reportes",
    liberacion:"Por liberar", pagados:"Pagados", deudores:"Deudores",
    usuarios:"Usuarios", centros:"Centros de beneficio", catalogo:"Catálogo de gastos", ajustes:"Ajustes",
    perfil:"Mi perfil",
  };
  const crumbs = ["Viáticos", window.ROLE_LABELS[role], PAGE_LABELS[activePage] || activePage];

  // Solo admin puede cambiar de perspectiva (para soporte / supervisión)
  const handleSetRole = (r) => {
    if (!isAdmin) return;  // solo admin puede cambiar de perspectiva
    setPage(DEFAULT_PAGE[r] || "dash");
    setTweak("role", r);
  };

  // Admin puede operar como cualquier rol; los demás usan su rol fijo
  // (activeRole ya está declarado arriba)

  const content = resolveContent(activeRole, activePage, userId, setDetailId, setPage, handleLogout);

  return (
    <>
      {isMobileView ? (
        <MobileApp userId={userId} role={activeRole} onLogout={handleLogout} setPage={setPageFromMobile} openDetail={setDetailId}/>
      ) : (
        <div className="app">
          <Sidebar role={activeRole} page={activePage} setPage={setPage} onLogout={handleLogout} userId={userId} dbLoaded={dbLoaded}/>
          <div className="main">
            <Topbar role={activeRole} setRole={handleSetRole} crumbs={crumbs} isAdmin={isAdmin}
              userId={userId}
              onOpenDetail={setDetailId}
              onNew={(activeRole === "usuario" || activeRole === "gerente" || activeRole === "admin") ? () => setPage("anticipos") : null}/>
            <div className="content">{content}</div>
          </div>
        </div>
      )}

      {detailId && <DetalleModal id={detailId} onClose={() => setDetailId(null)}/>}

      {/* TweaksPanel: siempre en DEV_MODE, solo admin en producción */}
      <ThemePanel
        theme={t.theme} onTheme={v=>setTweak("theme",v)}
        accent={t.accent} onAccent={v=>setTweak("accent",v)}
        density={t.density} onDensity={v=>setTweak("density",v)}
        isAdmin={isAdmin}
        role={activeRole}
        onRole={isAdmin ? handleSetRole : null}
      />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>

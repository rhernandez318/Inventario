      const dias=Math.floor((hoy-s.fecha)/86400000);
      const bk=dias<=15?"0-15":dias<=30?"16-30":dias<=60?"31-60":"60+";
      rows.push([s.id,s.concepto,u.nombre,u.centro,s.saldoPendiente,dias,bk]);
    });
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join('\n');
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download="deudores_"+anio+".csv"; a.click();
  };

  const TABS = [
    {k:"aging",   label:"Antigüedad de saldos"},
    {k:"top",     label:"Top deudores"},
    {k:"centro",  label:"Por área (centro)"},
    {k:"mensual", label:"Gasto mensual"},
  ];

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">Deudores</h1>
          <div className="page-sub">Antigüedad de saldos · anticipos sin comprobar</div>
        </div>
        <div className="row">
          <select className="select" value={anio} onChange={e=>{setAnio(e.target.value);}}>
            {AÑOS.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
          <select className="select" value={centro} onChange={e=>{setCentro(e.target.value);}}>
            <option value="todos">Todos los centros</option>
            {window.CENTROS.map(c=><option key={c.id} value={c.id}>{c.id} · {c.nombre}</option>)}
          </select>
          <button className="btn" onClick={exportar}><Icon name="download" size={13}/> Exportar</button>
        </div>
      </div>

      {/* KPIs de saldo */}
      <div className="kpi-grid" style={{gridTemplateColumns:"repeat(4,1fr)",marginBottom:14}}>
        {[
          {k:"0-15",  label:"0–15 días",  color:"var(--success,#1d9e75)"},
          {k:"16-30", label:"16–30 días", color:"var(--warn,#ef9f27)"},
          {k:"31-60", label:"31–60 días", color:"#e88a27"},
          {k:"60+",   label:"+60 días",   color:"var(--danger,#e24b4a)"},
        ].map(({k,label,color})=>(
          <div key={k} className="kpi" style={{borderLeft:"3px solid "+color}}>
            <div className="kpi-label">{label}</div>
            <div className="kpi-value" style={{color}}>{window.fmtMXN(sumB(k))}</div>
            <div className="kpi-delta neutral">{buckets[k].length} anticipo{buckets[k].length!==1?"s":""}</div>
          </div>
        ))}
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:0,borderBottom:"1px solid var(--border)",marginBottom:16}}>
        {TABS.map(t=>(
          <div key={t.k} onClick={()=>setTab(t.k)}
            style={{padding:"8px 18px",cursor:"pointer",fontSize:13,fontWeight:500,
              borderBottom:tab===t.k?"2px solid var(--accent)":"2px solid transparent",
              color:tab===t.k?"var(--text)":"var(--text-3)",transition:"all .15s"}}>
            {t.label}
          </div>
        ))}
      </div>

      {/* Tab: Antigüedad de saldos */}
      {tab==="aging" && (
        <div className="card" style={{padding:0}}>
          <div className="card-head" style={{padding:"14px 16px 10px"}}>
            <h3 className="card-title">Antigüedad de saldos</h3>
            <div className="card-sub">Anticipos sin comprobar · {anio}</div>
          </div>
          <table className="t">
            <thead><tr><th>Folio</th><th>Concepto</th><th>Usuario</th><th className="right">Saldo</th><th>Días</th><th>Bucket</th></tr></thead>
            <tbody>
              {ahoraSaldos.length===0
                ? <tr><td colSpan={6} style={{textAlign:"center",padding:"24px",color:"var(--text-3)"}}>Sin saldos pendientes para este filtro</td></tr>
                : ahoraSaldos.sort((a,b)=>a.fecha-b.fecha).map(s=>{
                    const u=window.findUser(s.usuario);
                    const dias=Math.floor((hoy-s.fecha)/86400000);
                    const bk=dias<=15?"0-15":dias<=30?"16-30":dias<=60?"31-60":"60+";
                    const col=dias>60?"var(--danger)":dias>30?"#e88a27":dias>15?"var(--warn)":"var(--success)";
                    return (
                      <tr key={s.id}>
                        <td className="id-cell">{s.id}</td>
                        <td style={{maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.concepto}</td>
                        <td><div className="row"><div className="avatar sm">{u.iniciales}</div><span style={{fontSize:13}}>{u.nombre}</span></div></td>
                        <td className="num" style={{fontWeight:600,color:col}}>{window.fmtMXN(s.saldoPendiente)}</td>
                        <td style={{fontWeight:600,color:col}}>{dias}d</td>
                        <td><span className="badge" style={{background:col+"22",color:col,border:"none"}}>{bk} días</span></td>
                      </tr>
                    );
                  })
              }
            </tbody>
          </table>
        </div>
      )}

      {/* Tab: Top deudores */}
      {tab==="top" && (
        <div className="card">
          <div className="card-head">
            <h3 className="card-title">Top deudores</h3>
            <div className="card-sub">Saldo total: {window.fmtMXN(totalSaldos)}</div>
          </div>
          {topDeudores.length===0
            ? <div className="empty"><div className="empty-ic"><Icon name="check" size={20}/></div><div style={{fontWeight:600,color:"var(--text)"}}>Sin deudores</div></div>
            : (
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                {topDeudores.map((d,i)=>{
                  const pct=totalSaldos>0?Math.round(d.monto/totalSaldos*100):0;
                  const c=window.findCentro(d.u.centro);
                  const diasMax=Math.max(...ahoraSaldos.filter(s=>s.usuario===d.u.id).map(s=>Math.floor((hoy-s.fecha)/86400000)),0);
                  const barColor=diasMax>60?"var(--danger)":diasMax>30?"#e88a27":diasMax>15?"var(--warn)":"var(--success)";
                  return (
                    <div key={d.u.id} style={{display:"grid",gridTemplateColumns:"200px 1fr 130px 80px",gap:12,alignItems:"center"}}>
                      <div className="row" style={{gap:8}}>
                        <div style={{width:18,height:18,borderRadius:"50%",background:"var(--surface-3)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:600,flexShrink:0,color:"var(--text-3)"}}>{i+1}</div>
                        <div className="avatar sm">{d.u.iniciales}</div>
                        <div>
                          <div style={{fontSize:13,fontWeight:500}}>{d.u.nombre}</div>
                          <div className="muted mono" style={{fontSize:10}}>{c?c.id:d.u.centro}</div>
                        </div>
                      </div>
                      <div>
                        <div style={{height:6,background:"var(--surface-3,rgba(255,255,255,.08))",borderRadius:3,overflow:"hidden"}}>
                          <div style={{height:"100%",width:pct+"%",background:barColor,borderRadius:3,transition:"width .3s"}}/>
                        </div>
                      </div>
                      <div className="num" style={{fontWeight:600,color:barColor}}>{window.fmtMXN(d.monto)}</div>
                      <div className="muted" style={{fontSize:11,textAlign:"right"}}>{diasMax}d máx</div>
                    </div>
                  );
                })}
              </div>
            )
          }
        </div>
      )}

      {/* Tab: Por área */}
      {tab==="centro" && (
        <div className="card" style={{padding:0}}>
          <div className="card-head" style={{padding:"14px 16px 10px"}}>
            <h3 className="card-title">Por área / centro de beneficio</h3>
            <div className="card-sub">Gasto ejercido {anio} · total {window.fmtMXN(totalGasto)}</div>
          </div>
          {Object.keys(porCentro).length===0
            ? <div style={{padding:"24px",textAlign:"center",color:"var(--text-3)",fontSize:12.5}}>Sin datos para este filtro</div>
            : (
              <table className="t">
                <thead><tr><th>Centro de beneficio</th><th>Clave</th><th className="right">Solicitudes</th><th className="right">Gasto total</th><th style={{width:160}}>Participación</th></tr></thead>
                <tbody>
                  {Object.entries(porCentro).sort((a,b)=>b[1]-a[1]).map(([nombre,monto])=>{
                    const pct=Math.round(monto/centroMax*100);
                    const pctTotal=Math.round(monto/Math.max(totalGasto,1)*100);
                    const cnt=solicsFilt.filter(s=>{const u=window.findUser(s.usuario);const c=u&&window.findCentro(u.centro);return c?c.nombre===nombre:false;}).length;
                    return (
                      <tr key={nombre}>
                        <td style={{fontWeight:500}}>{nombre}</td>
                        <td className="mono muted" style={{fontSize:11}}>
                          {(window.CENTROS.find(c=>c.nombre===nombre)||{}).id||"—"}
                        </td>
                        <td className="num">{cnt}</td>
                        <td className="num" style={{fontWeight:600}}>{window.fmtMXN(monto)}</td>
                        <td>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{flex:1,height:6,background:"var(--surface-3,rgba(255,255,255,.08))",borderRadius:3,overflow:"hidden"}}>
                              <div style={{height:"100%",width:pct+"%",background:"var(--accent)",borderRadius:3}}/>
                            </div>
                            <span style={{fontSize:11,color:"var(--text-3)",width:30,textAlign:"right"}}>{pctTotal}%</span>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )
          }
        </div>
      )}

      {/* Tab: Gasto mensual */}
      {tab==="mensual" && (
        <div className="card">
          <div className="card-head">
            <h3 className="card-title">Gasto mensual {anio}</h3>
            <div className="card-sub">Total de solicitudes por mes</div>
          </div>
          {mesFiltro !== null && (
            <div style={{marginBottom:10,padding:"6px 12px",background:"var(--accent-soft,rgba(197,242,77,.12))",
              borderRadius:8,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontSize:12,color:"var(--accent)",fontWeight:500}}>
                Filtrando: {meses[mesFiltro]} {anio}
              </span>
              <button onClick={()=>setMesFiltro(null)}
                style={{background:"none",border:"1px solid var(--accent)",color:"var(--accent)",
                  borderRadius:6,padding:"2px 8px",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                × Quitar filtro
              </button>
            </div>
          )}
          <div style={{display:"flex",alignItems:"flex-end",gap:4,height:BAR_H,padding:"0 4px"}}>
            {gastoMensual.map((v,i)=>{
              const pct=mesMax>0?v/mesMax:0;
              const barH=Math.max(pct*BAR_H,v>0?4:0);
              const isSelected=mesFiltro===i;
              const isCurrent=i===hoy.getMonth()&&anio==="2026"&&mesFiltro===null;
              const opacity=mesFiltro!==null&&!isSelected?0.35:1;
              return (
                <div key={i} onClick={()=>setMesFiltro(mesFiltro===i?null:i)}
                  style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,height:"100%",
                    justifyContent:"flex-end",cursor:"pointer",opacity,transition:"opacity .2s"}}>
                  {v>0&&<div style={{fontSize:9,color:isSelected?"var(--accent)":"var(--text-3)",whiteSpace:"nowrap",fontWeight:isSelected?600:400}}>
                    {window.fmtMXN(v).replace(/\.00$/,"").slice(0,9)}
                  </div>}
                  <div style={{width:"100%",height:barH,borderRadius:"3px 3px 0 0",
                    background:isSelected?"var(--accent)":isCurrent?"var(--accent)":"var(--accent-soft,rgba(197,242,77,.3))",
                    transition:"all .25s",boxShadow:isSelected?"0 0 8px var(--accent)":"none"}}/>
                  <div style={{fontSize:10,
                    color:isSelected?"var(--accent)":isCurrent?"var(--accent)":"var(--text-3)",
                    fontWeight:isSelected||isCurrent?600:400}}>{meses[i]}</div>
                </div>
              );
            })}
          </div>
          <div style={{fontSize:11,color:"var(--text-3)",marginTop:8,textAlign:"center"}}>
            Clic en una barra para filtrar todas las vistas por ese mes
          </div>
        </div>
      )}
    </>
  );
}


function Reportes({ role, userId }) {
  const hoy  = window.HOY;

  // Determinar el alcance del gerente:
  // Admin y el gerente de Administración (centro 100010009) ven todo.
  // Los demás gerentes solo ven su equipo.
  const CENTRO_ADMIN = "100010009";
  const userObj   = userId ? window.findUser(userId) : null;
  const esGerenteAdmin = role === "admin" ||
    (role === "gerente" && userObj && userObj.centro === CENTRO_ADMIN);
  // IDs del equipo del gerente (para filtrar si no es gerente admin)
  const teamIds = (!esGerenteAdmin && role === "gerente" && userId)
    ? window.USUARIOS.filter(u => u.gerente === userId).map(u => u.id)
    : null; // null = sin restricción
  const AÑOS = ["2026","2025","2024"];
  const [anio,        setAnio]        = React.useState("2026");
  const [centro,      setCentro]      = React.useState("todos");
  const [mesFiltro,   setMesFiltro]   = React.useState(null);
  const [statusFiltro,setStatusFiltro]= React.useState(null);
  const [tipoFiltro,  setTipoFiltro]  = React.useState(null);
  const [, forceRep] = React.useReducer(x=>x+1, 0);

  React.useEffect(() => {
    if (!window.loadSolicitudes) return;
    window.loadSolicitudes().then(()=>forceRep());
  }, []);

  const solicsFilt = React.useMemo(() => window.SOLICITUDES.filter(s => {
    const u = window.findUser(s.usuario);
    if (!u) return false;
    // Restricción de equipo para gerentes que no son de Administración
    if (teamIds && !teamIds.includes(s.usuario)) return false;
    if (String(s.fecha.getFullYear()) !== anio) return false;
    if (centro !== "todos" && u.centro !== centro) return false;
    if (mesFiltro !== null && s.fecha.getMonth() !== mesFiltro) return false;
    return true;
  }), [anio, centro, mesFiltro, teamIds]);

  // Sub-filtrado para la lista detallada (status y tipo no afectan KPIs ni gráficas)
  const solicsFiltradas = React.useMemo(() => solicsFilt.filter(s =>
    (!statusFiltro || s.status === statusFiltro) &&
    (!tipoFiltro   || s.tipo   === tipoFiltro)
  ), [solicsFilt, statusFiltro, tipoFiltro]);

  const totalGasto    = solicsFilt.filter(s=>["liberado","comprobado","parcial"].includes(s.status)).reduce((a,s)=>a+s.monto,0);
  const totalLiberado = solicsFilt.filter(s=>["liberado","comprobado"].includes(s.status)).reduce((a,s)=>a+s.monto,0);
  const totalDeudor   = solicsFilt.filter(s=>s.tipo==="anticipo"&&["liberado","parcial"].includes(s.status)&&(s.saldoPendiente||0)>0).reduce((a,s)=>a+(s.saldoPendiente||0),0);
  const totalPend     = solicsFilt.filter(s=>["solicitado","autorizado"].includes(s.status)).reduce((a,s)=>a+s.monto,0);
  const compRate      = totalGasto>0 ? Math.round((totalGasto-totalDeudor)/totalGasto*100) : 100;
  const solicsValidas = solicsFilt.filter(s=>s.status!=="rechazado");
  const avgTicket     = solicsValidas.length>0 ? Math.round(totalGasto/solicsValidas.length) : 0;

  // Por cuenta contable (tipo de gasto)
  const porTipoGasto = {};
  solicsFilt.filter(s=>["liberado","comprobado","parcial"].includes(s.status)).forEach(s => {
    const items = s.cfdi&&s.cfdi.length>0 ? s.cfdi
      : s.items&&s.items.length>0 ? s.items.map(i=>({cuenta:i.cuenta,total:i.monto||0}))
      : [{cuenta:"6121200001",total:s.monto}];
    items.forEach(it => {
      const meta = window.findCuenta(it.cuenta||"6121200001")||{nombre:"Otros",cuenta:"6121200001"};
      const k = meta.nombre;
      porTipoGasto[k] = (porTipoGasto[k]||0) + (it.total||it.monto||0);
    });
  });
  const tipoMax = Math.max(...Object.values(porTipoGasto),1);
  const tipoTotal = Object.values(porTipoGasto).reduce((a,v)=>a+v,0)||1;

  // Por centro de beneficio
  const porCentro = {};
  solicsFilt.filter(s=>["liberado","comprobado","parcial"].includes(s.status)).forEach(s => {
    const u=window.findUser(s.usuario);if(!u)return;
    const c=window.findCentro(u.centro);
    const k=c?c.nombre:u.centro;
    porCentro[k]=(porCentro[k]||0)+s.monto;
  });
  const centroMax = Math.max(...Object.values(porCentro),1);

  // Gasto mensual (últimos 6 meses del año seleccionado)
  const meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const gastoMensual = Array(12).fill(0);
  solicsFilt.filter(s=>["liberado","comprobado","parcial"].includes(s.status)).forEach(s => { gastoMensual[s.fecha.getMonth()] += s.monto; });
  const mesMax = Math.max(...gastoMensual,1);

  // Status breakdown
  const byStatus={solicitado:0,autorizado:0,liberado:0,comprobado:0,rechazado:0};
  solicsFilt.forEach(s=>{byStatus[s.status]=(byStatus[s.status]||0)+1;});

  const exportar = () => {
    const rows=[["Tipo de gasto","Monto","% del total"]];
    Object.entries(porTipoGasto).sort((a,b)=>b[1]-a[1])
      .forEach(([k,v])=>rows.push([k,v,Math.round(v/tipoTotal*100)+"%"]));
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join('\n');
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download="reporte_gastos_"+anio+".csv";a.click();
  };

  const BAR_H = 180; // height of bar charts

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">Reportes</h1>
          <div className="page-sub">KPIs · distribución de gasto · tendencia mensual</div>
        </div>
        <div className="row">
          <select className="select" value={anio} onChange={e=>setAnio(e.target.value)}>
            {AÑOS.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
          <select className="select" value={centro} onChange={e=>setCentro(e.target.value)}>
            <option value="todos">Todos los centros</option>
            {window.CENTROS.map(c=><option key={c.id} value={c.id}>{c.id} · {c.nombre}</option>)}
          </select>
          <button className="btn" onClick={exportar}><Icon name="download" size={13}/> Exportar</button>
        </div>
      </div>

      {/* ── KPIs principales ── */}
      <div className="kpi-grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))"}}>
        <div className="kpi">
          <div className="kpi-label">Gasto total {anio}</div>
          <div className="kpi-value">{window.fmtMXN(totalGasto)}</div>
          <div className="kpi-delta neutral">{solicsFilt.length} solicitudes</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Liberado / pagado</div>
          <div className="kpi-value" style={{color:"var(--success)"}}>{window.fmtMXN(totalLiberado)}</div>
          <div className="kpi-delta up">{totalGasto>0?Math.round(totalLiberado/totalGasto*100):0}% del total</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Saldo deudor abierto</div>
          <div className="kpi-value" style={{color:totalDeudor>0?"var(--warn)":"var(--success)"}}>{window.fmtMXN(totalDeudor)}</div>
          <div className={`kpi-delta ${totalDeudor>0?"down":"up"}`}>{totalDeudor>0?"anticipos sin comprobar":"todo comprobado"}</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">En proceso</div>
          <div className="kpi-value">{window.fmtMXN(totalPend)}</div>
          <div className="kpi-delta neutral">por autorizar / liberar</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Tasa de comprobación</div>
          <div className="kpi-value" style={{color:compRate>=80?"var(--success)":compRate>=60?"var(--warn)":"var(--danger)"}}>{compRate}%</div>
          <div className={`kpi-delta ${compRate>=80?"up":"down"}`}>objetivo: 85%</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Ticket promedio</div>
          <div className="kpi-value">{window.fmtMXN(avgTicket)}</div>
          <div className="kpi-delta neutral">por solicitud</div>
        </div>
      </div>

      {/* ── Fila de gráficas ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>

        {/* Gráfica: Gasto por tipo de gasto (barras horizontales) */}
        <div className="card">
          <div className="card-head">
            <h3 className="card-title">Por tipo de gasto</h3>
            <div className="card-sub">distribución de conceptos</div>
          </div>
          {Object.keys(porTipoGasto).length===0
            ? <div className="muted" style={{fontSize:12.5,padding:"8px 0"}}>Sin datos para este filtro</div>
            : Object.entries(porTipoGasto).sort((a,b)=>b[1]-a[1]).map(([tipo,monto])=>{
                const pct=Math.round(monto/tipoTotal*100);
                const colors={"Pasajes Nacionales":"#378ADD","Alojamiento Nacional":"#9b59b6",
                  "Comidas":"#1d9e75","Gasolina":"#e24b4a","Peaje":"#ef9f27",
                  "Estacionamiento":"#888780","Renta de Vehículos":"#5ec8e6",
                  "Otros Impuestos (TUA)":"#c5f24d","No Deducibles":"#aaaaaa"};
                const color=colors[tipo]||"var(--accent)";
                return (
                  <div key={tipo} style={{marginBottom:10}}>
                    <div className="spread" style={{marginBottom:4}}>
                      <span style={{fontSize:12,display:"flex",alignItems:"center",gap:6}}>
                        <span style={{width:8,height:8,borderRadius:"50%",background:color,display:"inline-block",flexShrink:0}}/>
                        {tipo}
                      </span>
                      <div style={{display:"flex",gap:10,alignItems:"baseline"}}>
                        <span className="mono" style={{fontSize:11,color:"var(--text-3)"}}>{pct}%</span>
                        <strong className="mono" style={{fontSize:12}}>{window.fmtMXN(monto)}</strong>
                      </div>
                    </div>
                    <div style={{height:6,background:"var(--surface-3,rgba(255,255,255,.08))",borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",width:pct+"%",background:color,borderRadius:3,transition:"width .4s"}}/>
                    </div>
                  </div>
                );
              })
          }

        {/* Gráfica: Por área / centro de beneficio */}
        <div className="card">

                  <div key={nombre} style={{marginBottom:10}}>

      {/* ── Gráfica de barras mensual ── */}
      <div className="card" style={{marginBottom:14}}>
        <div className="card-head">

        <div style={{display:"flex",alignItems:"flex-end",gap:4,height:BAR_H,padding:"0 4px"}}>

        {/* Status — clickable bars → filtran por status */}
        <div className="card">
          <div className="card-head">
            <h3 className="card-title">Status de solicitudes</h3>
            <div className="card-sub">{solicsFilt.length} total</div>

            {k:"autorizado", label:"Autorizadas",  color:"#378ADD"},
            {k:"liberado",   label:"Liberadas",    color:"#1d9e75"},
            {k:"comprobado", label:"Comprobadas",  color:"#c5f24d"},
            {k:"rechazado",  label:"Rechazadas",   color:"#e24b4a"},
          ].map(({k,label,color})=>{
            const cnt=byStatus[k]||0;
            const total=solicsFilt.length||1;
            const pct=Math.round(cnt/total*100);

            return (
              <div key={k} style={{marginBottom:10,cursor:"pointer",
                opacity:statusFiltro&&!isSelected?0.45:1,transition:"opacity .2s"}}
                onClick={()=>setStatusFiltro(statusFiltro===k?null:k)}>
                <div className="spread" style={{marginBottom:4}}>

        {/* Resumen por tipo — clickable rows → filtran por tipo */}

          <div className="card-head" style={{padding:"14px 16px 10px"}}>
            <h3 className="card-title">Resumen por tipo</h3>

                const colors={anticipo:"#378ADD",comprobacion:"#c5f24d",reembolso:"#9b59b6"};
                const isSelected=tipoFiltro===tipo;
                return (
                  <tr key={tipo} onClick={()=>setTipoFiltro(tipoFiltro===tipo?null:tipo)}
                    style={{cursor:"pointer",

      {/* ── Lista detallada filtrada ── */}
      {(statusFiltro||tipoFiltro)&&(()=>{

          (!statusFiltro||s.status===statusFiltro)&&
          (!tipoFiltro||s.tipo===tipoFiltro)
        );
        const titulo=statusFiltro
          ? `Solicitudes "${statusFiltro}"${tipoFiltro?" · "+tipoFiltro:""}`
          : `${tipoFiltro} ${mesFiltro!==null?"· "+meses[mesFiltro]:""}`;
        return (

                {titulo}
                <span className="muted" style={{fontWeight:400,fontSize:12,marginLeft:8}}>

                  padding:"3px 8px",fontSize:11,cursor:"pointer",color:"var(--text-3)",fontFamily:"inherit"}}>

            <table className="t">

                <th>Tipo</th><th>Status</th><th className="right">Monto</th></tr></thead>

                {lista.length===0
                  ? <tr><td colSpan={6} style={{textAlign:"center",padding:"20px",color:"var(--text-3)"}}>Sin solicitudes para este filtro</td></tr>
                  : lista.sort((a,b)=>b.fecha-a.fecha).map(s=>{
                      const u=window.findUser(s.usuario);
                      return (
                        <tr key={s.id}>
                          <td className="id-cell">{s.id}</td>
                          <td style={{maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.concepto}</td>

                      );

              </tbody>
            </table>

        );
      })()}

  );
}


function ContadorPolizas() {
  const PROVEEDOR_UNICO = "6000000";

  const hoy = window.HOY;
  // Default: últimos 90 días para asegurar datos en el demo
  const fmt = d => d.toISOString().split("T")[0];
  const hace90 = new Date(hoy); hace90.setDate(hace90.getDate() - 90);

  const [fechaIni, setFechaIni] = React.useState(fmt(hace90));
  const [fechaFin, setFechaFin] = React.useState(fmt(hoy));
  const [centro,   setCentro]   = React.useState("todos");
  const [polizas,       setPolizas]       = React.useState([]);
  const [liquidaciones, setLiquidaciones] = React.useState([]);
  const [generado,      setGenerado]      = React.useState(false);

  // Genera las líneas de póliza — SOLO comprobaciones y reembolsos
  const generarPolizas = () => {
    const desde = new Date(fechaIni + "T00:00:00");
    const hasta  = new Date(fechaFin + "T23:59:59");

    const solicitudes = window.SOLICITUDES.filter(s => {
      // Anticipos: solo liberados (Bancos vs Deudor)
      // Comprobaciones y reembolsos: liberados, autorizados o comprobados (Gastos vs Proveedor único)
      if (s.tipo === "anticipo") {
        if (s.status !== "liberado") return false;
      } else if (s.tipo === "comprobacion" || s.tipo === "reembolso") {
        if (s.status === "rechazado" || s.status === "solicitado") return false;
      } else {
        return false;
      }
      if (s.fecha < desde || s.fecha > hasta) return false;
      if (centro !== "todos") {
        const u = window.findUser(s.usuario);
        if (!u || u.centro !== centro) return false;
      }
      return true;
    });

    // Por cada solicitud generar movimientos contables
    const lineas = [];
    let numPoliza = 1;

    solicitudes.forEach(s => {
      const u = window.findUser(s.usuario);
      if (!u) return;
      const c = window.findCentro(u.centro);
      const centroId = c ? c.id : u.centro;

      const fechaFmt = window.fmtFecha(s.fecha);
      const polRef = `POL-${String(numPoliza).padStart(4,"0")}`;

      if (s.tipo === "anticipo") {
        // ── Póliza de ANTICIPO: Bancos vs Deudor ──────────────────────────
        // El número de deudor en SAP es el ID del usuario
        const division    = u.division || "4105";
        const cuentaBanco = window.getBancosAccount(division);
        const cuentaBancoNombre = window.CATALOGO_GASTOS.find(cg => cg.cuenta === cuentaBanco)?.nombre || `Bancos ${division}`;

        // Cargo: cuenta deudor = ID del usuario (número de deudor SAP)
        lineas.push({
          poliza: polRef, folio: s.id, fecha: fechaFmt,
          centro: centroId, area: c ? c.nombre : centroId,
          division,
          cuenta: u.id,        // ID usuario = número deudor SAP
          nombreCuenta: `Deudor ${u.nombre} (${u.id})`,
          tipo: "C", debe: s.monto, haber: 0,
          concepto: `Anticipo viáticos · ${u.nombre} · ${s.concepto}`,
          proveedor: u.nombre, usuario: u.nombre, ref: s.id, _archivos: [],
        });
        // Abono: cuenta de bancos según división del usuario
        lineas.push({
          poliza: polRef, folio: s.id, fecha: fechaFmt,
          centro: centroId, area: c ? c.nombre : centroId,
          division,
          cuenta: cuentaBanco,
          nombreCuenta: cuentaBancoNombre,
          tipo: "A", debe: 0, haber: s.monto,
          concepto: `Anticipo viáticos · ${u.nombre} · ${s.concepto}`,
          proveedor: "—", usuario: u.nombre, ref: s.id,
          _archivos: [],
        });

      } else {
        // ── Póliza de COMPROBACIÓN / REEMBOLSO: Gastos vs Proveedor 6000000 ─

        // Obtener desglose real o estimado
        const items = (() => {
          if (s.cfdi && s.cfdi.length > 0) {
            return s.cfdi.map(cf => ({
              cuenta: cf.cuenta || "6121200001",
              desc:   cf.concepto || cf.emisor || s.concepto,
              monto:  cf.total || 0,
              emisor: cf.emisor || "—",
            }));
          }
          if (s.items && s.items.length > 0) {
            return s.items.map(it => ({
              cuenta: it.cuenta || "6121200001",
              desc:   it.desc || s.concepto,
              monto:  it.monto || 0,
              emisor: "—",
            }));
          }
          return [{ cuenta:"6121200001", desc: s.concepto, monto: s.monto, emisor:"—" }];
        })();

        const totalMov = items.reduce((a,i) => a+i.monto, 0);

        // Cargos: una línea por tipo de gasto
        const divisionComp = u.division || "4105";
        items.forEach(it => {
          if (it.monto <= 0) return;
          const meta = window.findCuenta(it.cuenta) || { nombre: it.cuenta };
          lineas.push({
            poliza: polRef, folio: s.id, fecha: fechaFmt,
            centro: centroId, area: c ? c.nombre : centroId,
            division: divisionComp,
            cuenta: it.cuenta, nombreCuenta: meta.nombre,
            tipo: "C", debe: it.monto, haber: 0,
            concepto: it.desc,
            proveedor: it.emisor !== "—" ? it.emisor : "—",
            usuario: u.nombre, ref: s.id,
          });
        });

        // Abono: proveedor único 6000000
        lineas.push({
          poliza: polRef, folio: s.id, fecha: fechaFmt,
          centro: centroId, area: c ? c.nombre : centroId,
          division: divisionComp,
          cuenta: PROVEEDOR_UNICO, nombreCuenta: "Proveedor Único Viáticos",
          tipo: "A", debe: 0, haber: totalMov,
          concepto: `Viáticos ${u.nombre} · ${s.concepto}`,
          proveedor: `${u.nombre} · ${u.correo}`,
          usuario: u.nombre, ref: s.id,
          _archivos: s.cfdi && s.cfdi.length > 0
            ? s.cfdi.map((cf,i) => ({
                nombre: `${s.id}_${(cf.emisor||"factura").replace(/[^a-zA-Z0-9]/g,"_").slice(0,20)}_${i+1}`,
                uuid: cf.uuid || cf.uuidFull || null,
                emisor: cf.emisor || null,
                total: cf.total || 0,
              }))
            : s.comprobantes > 0
              ? Array.from({length: s.comprobantes}, (_,i) => ({
                  nombre: `${s.id}_comprobante_${i+1}`,
                  uuid: null, emisor: null, total: null,
                }))
              : [],
        });
      }

      numPoliza++;
    });

    setPolizas(lineas);

    // Generar también las pólizas de liquidación para comprobaciones
    const liquidaciones = solicitudes
      .filter(s => s.tipo === "comprobacion" && s.anticipoRef)
      .map(s => window.generarPolizaLiquidacion(s))
      .filter(Boolean);
    setLiquidaciones(liquidaciones);
    setGenerado(true);
  };

  // ── Layout SAP FB50 / RFBIBL00 ─────────────────────────────────────────────
  // El programa RFBIBL00 lee un archivo de texto con posiciones fijas.
  // Cada registro empieza con un identificador de tipo:
  //   BSE = cabecera del documento
  //   BSP = posición individual (línea de asiento)
  //
  // Campos BSE (cabecera):
  //   Col 1-3:   BSEG (tipo "BSE")
  //   Col 5-14:  BUKRS  Sociedad (4 chars)
  //   Col 16-21: BLDAT  Fecha doc  DDMMYY
  //   Col 23-28: BUDAT  Fecha contab DDMMYY
  //   Col 30-31: BLART  Tipo doc (KR=prov, SA=contabilidad gral)
  //   Col 33-37: WAERS  Moneda
  //   Col 39-98: BKTXT  Texto cabecera (60 chars)
  //   Col 100-109: XBLNR Referencia externa (10 chars)
  //
  // Campos BSP (posición):
  //   Col 1-3:   "BSP"
  //   Col 5-14:  HKONT  Cuenta GL (10 chars)
  //   Col 16:    SHKZG  D=Debe / H=Haber
  //   Col 18-32: WRBTR  Importe (15.2, sin punto, último 2=decimales)
  //   Col 34-43: KOSTL  Centro de costo (10 chars)
  //   Col 45-104: SGTXT Texto posición (60 chars)
  //   Col 106-115: ZUONR Asignación (10 chars)

  const getSociedad = () => {
    const el = document.getElementById("sap-bukrs");
    return (el ? el.value.trim().toUpperCase() : "") || "CZAP";
  };

  const padR = (s, n) => String(s||"").substring(0,n).padEnd(n);
  const padL = (s, n) => String(s||"").substring(0,n).padStart(n);
  const fmtFechaSAP = d => {
    const dt = d instanceof Date ? d : new Date(d);
    const dd = String(dt.getDate()).padStart(2,"0");
    const mm = String(dt.getMonth()+1).padStart(2,"0");
    const yy = String(dt.getFullYear()).slice(-2);
    return `${dd}${mm}${yy}`;
  };
  const fmtImporte = n => {
    const abs = Math.abs(Math.round(n * 100));
    return String(abs).padStart(15,"0").replace(/(\d{2})$/, ".$1");
  };

  const exportarSAP = () => {
    const SOCIEDAD = getSociedad();
    // Agrupar todas las lineas (pólizas + liquidaciones) por número de póliza
    const todasLineas = [
      ...polizas,
      ...liquidaciones.flatMap((liq, li) =>
        liq.lineas.map(l => ({
          poliza:    `LIQ-${String(li+1).padStart(4,"0")}`,
          folio:     liq.comprobacionId,
          fecha:     window.fmtFecha(liq.fecha),
          _fechaObj: liq.fecha,
          centro:    polizas.find(p=>p.folio===liq.comprobacionId)?.centro || "",
          cuenta:    l.cuenta,
          tipo:      l.tipo,
          debe:      l.debe || 0,
          haber:     l.haber || 0,
          concepto:  l.concepto,
        }))
      ),
    ];

    const grupos = {};
    todasLineas.forEach(l => {
      if (!grupos[l.poliza]) grupos[l.poliza] = [];
      grupos[l.poliza].push(l);
    });

    const lineasSAP = [];
    lineasSAP.push("* Layout generado por Sistema de Viáticos ZAPATA CAMIONES");
    lineasSAP.push(`* Sociedad: ${SOCIEDAD}  Rango: ${fechaIni} al ${fechaFin}`);
    lineasSAP.push(`* Pólizas: ${Object.keys(grupos).length}  Fecha: ${new Date().toISOString().slice(0,10)}`);
    lineasSAP.push("");

    Object.entries(grupos).forEach(([numPol, movs]) => {
      const ref = movs[0];
      // Obtener fecha como objeto Date
      // Get fecha from SOLICITUDES — _fechaObj may not be on all lines
      const _sol = window.SOLICITUDES.find(x => x.id === ref.folio);
      const fechaDoc = _sol ? _sol.fecha : (ref._fechaObj || new Date());
      const tipoDoc = numPol.startsWith("LIQ") ? "SA" :
                      ref.cuenta === "1125" || ref.cuenta === "1101" ? "SA" : "KR";
      const fechaSAP = fmtFechaSAP(fechaDoc);
      const textoCab = padR(`Viaticos ${ref.folio} ${ref.area||""}`, 60);
      const refExterna = padR(ref.folio, 10);

      const divisionSAP = movs.find(m => m.division)?.division || "";
      // BSE — cabecera del documento
      // Col adicional: división (referencia interna)
      lineasSAP.push(
        `BSE  ${padR(SOCIEDAD,4)}  ${fechaSAP}  ${fechaSAP}  ${tipoDoc}  MXN  ${textoCab}  ${refExterna}  ${padR(divisionSAP,6)}`
      );

      // BSP — una línea por movimiento
      movs.forEach(m => {
        const cuenta  = padR(m.cuenta, 10);
        const dc      = m.tipo === "C" ? "D" : "H";
        const importe = fmtImporte(m.tipo === "C" ? m.debe : m.haber);
        const kostl   = padR(m.centro || ref.centro, 10);
        const texto   = padR(m.concepto, 60);
        const asign   = padR(m.folio, 10);
        lineasSAP.push(
          `BSP  ${cuenta}  ${dc}  ${importe}  ${kostl}  ${texto}  ${asign}`
        );
      });

      lineasSAP.push(""); // línea en blanco entre documentos
    });

    const content = lineasSAP.join('\n');
    const a = document.createElement("a");
    a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(content);
    a.download = `SAP_FB50_${fechaIni}_${fechaFin}.txt`;
    a.click();
  };

  const exportarPolizas = () => {
    if (!polizas.length) return;
    const rows = [["Póliza","Folio","Fecha","Centro","Área","Cuenta","Nombre cuenta","D/A","Debe","Haber","Concepto","Proveedor / Emisor","Registrado por"]];
    polizas.forEach(p => rows.push([
      p.poliza, p.folio, p.fecha, p.centro, p.area,
      p.cuenta, p.nombreCuenta, p.tipo,
      p.debe || "", p.haber || "",
      p.concepto, p.proveedor, p.usuario,
    ]));
    const csv = rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(",")).join('\n');
    const a = document.createElement("a");
    a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
    a.download = `polizas_${fechaIni}_${fechaFin}.csv`;
    a.click();
  };

  const totalDebe  = polizas.reduce((a,p)=>a+(p.debe||0),0);
  const totalHaber = polizas.reduce((a,p)=>a+(p.haber||0),0);
  const polizasUnicas = [...new Set(polizas.map(p=>p.poliza))].length;

  return (
    <>
      <div className="page-head">
        <div>
          <h1 className="page-title">Pólizas contables</h1>
          <div className="page-sub">Generación de movimientos contables por rango de fecha y centro de beneficio</div>
        </div>
        {generado && polizas.length > 0 && (
          <div style={{display:"flex",gap:8}}>
            <button className="btn" onClick={exportarPolizas}>
              <Icon name="download" size={13}/> CSV resumen · {polizasUnicas} pólizas
            </button>
            <button className="btn primary" onClick={exportarSAP}>
              <Icon name="download" size={13}/> Layout SAP (FB50)
            </button>
          </div>
        )}
      </div>

      {/* Filtros */}
      <div className="card" style={{marginBottom:16}}>
        <h3 className="card-title" style={{marginBottom:14}}>Parámetros de generación</h3>
        <div className="form-grid cols-2" style={{marginBottom:16}}>
          <div className="field">
            <label>Fecha inicial</label>
            <input className="input" type="date" value={fechaIni}
              onChange={e=>{setFechaIni(e.target.value);setGenerado(false);}}/>
          </div>
          <div className="field">
            <label>Fecha final</label>
            <input className="input" type="date" value={fechaFin}
              onChange={e=>{setFechaFin(e.target.value);setGenerado(false);}}/>
          </div>
          <div className="field">
            <label>Centro de beneficio</label>
            <select className="select" value={centro}
              onChange={e=>{setCentro(e.target.value);setGenerado(false);}}>
              <option value="todos">Todos los centros</option>
              {window.CENTROS.map(c=><option key={c.id} value={c.id}>{c.id} · {c.nombre}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Proveedor acreedor</label>
            <input className="input mono" value={`${PROVEEDOR_UNICO} — Proveedor Único Viáticos`} disabled/>
          </div>
          <div className="field">
            <label>Sociedad SAP (BUKRS)</label>
            <input className="input mono" defaultValue="CZAP"
              placeholder="Ej: CZAP, 1000, MXSA"
              id="sap-bukrs"
              style={{textTransform:"uppercase"}}/>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn primary" onClick={generarPolizas}>
            <Icon name="sparkle" size={13}/> Generar pólizas
          </button>
          {generado && (
            <button className="btn" onClick={()=>{setPolizas([]);setLiquidaciones([]);setGenerado(false);}}>
              Limpiar
            </button>
          )}
        </div>
      </div>

      {/* Resultado */}
      {generado && polizas.length === 0 && (
        <div className="card">
          <div className="empty">
            <div className="empty-ic"><Icon name="search" size={20}/></div>
            <div style={{fontWeight:600,fontSize:14,color:"var(--text)"}}>Sin movimientos</div>
            <div style={{marginTop:4}}>No hay solicitudes liberadas en el rango y filtro seleccionado</div>
          </div>
        </div>
      )}

      {generado && polizas.length > 0 && (
        <>
          <div className="kpi-grid">
            <div className="kpi">
              <div className="kpi-label">Pólizas generadas</div>
              <div className="kpi-value">{polizasUnicas}</div>
              <div className="kpi-delta neutral">{polizas.length} movimientos</div>
            </div>
            <div className="kpi">
              <div className="kpi-label">Total debe</div>
              <div className="kpi-value">{window.fmtMXN(totalDebe)}</div>
            </div>
            <div className="kpi">
              <div className="kpi-label">Total haber</div>
              <div className="kpi-value">{window.fmtMXN(totalHaber)}</div>
            </div>
            <div className="kpi">
              <div className="kpi-label">Cuadre</div>
              <div className="kpi-value" style={{color:Math.abs(totalDebe-totalHaber)<0.01?"var(--success)":"var(--danger)"}}>
                {Math.abs(totalDebe-totalHaber)<0.01 ? "✓ Cuadra" : window.fmtMXN(Math.abs(totalDebe-totalHaber))}
              </div>
            </div>
          </div>

          {/* Tabla de pólizas agrupada por póliza */}
          {[...new Set(polizas.map(p=>p.poliza))].map(numPol => {
            const movs = polizas.filter(p=>p.poliza===numPol);
            const ref  = movs[0];
            const totD = movs.reduce((a,p)=>a+(p.debe||0),0);
            const totH = movs.reduce((a,p)=>a+(p.haber||0),0);
            return (
              <div key={numPol} className="card" style={{marginBottom:14,padding:0}}>
                {/* Header de póliza */}
                {(() => {
                  const s = window.SOLICITUDES.find(x=>x.id===ref.folio);

                    : s && s.tipo==="reembolso" ? "Reembolso · Gastos vs Prov. 6000000"

                  const tipoColor = s && s.tipo==="anticipo" ? "var(--info)" : "var(--accent)";

                    <div style={{padding:"12px 16px",borderBottom:"1px solid var(--border)",
                      display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",
                      background:"var(--surface-2,rgba(255,255,255,.04))",
                      borderRadius:"var(--r-lg) var(--r-lg) 0 0"}}>
                      <span className="mono" style={{fontWeight:700,fontSize:14}}>{numPol}</span>
                      <span className="badge tipo">{ref.folio}</span>
                      <span style={{fontSize:11,padding:"2px 8px",borderRadius:20,
                        background:`${tipoColor}22`,color:tipoColor,fontWeight:500}}>
                        {tipoLabel}
                      </span>

                      <span className="muted" style={{fontSize:12}}>{ref.area} · {ref.centro}</span>

                    <tr>

                      <td className="num" style={{fontWeight:700}}>{window.fmtMXN(totD)}</td>
                      <td className="num" style={{fontWeight:700,color:"var(--info)"}}>{window.fmtMXN(totH)}</td>
                    </tr>
                  </tfoot>
                </table>

                {/* ── Archivos adjuntos de la póliza ── */}
                {(() => {
                  const abonoLine = movs.find(m => m._archivos);
                  const archivos  = abonoLine ? abonoLine._archivos : [];
                  if (!archivos.length) return null;
                  return (
                    <div style={{padding:"12px 16px",borderTop:"1px solid var(--border)",

<Comprobante xmlns="http://www.sat.gob.mx/cfd/4"

<Comprobante Folio="${ref.folio}" Archivo="${i+1}"/>`;

                                  padding:"6px 11px",borderRadius:"var(--r-md,8px)",

                                  padding:"6px 11px",borderRadius:"var(--r-md,8px)",
                                  border:"1px solid var(--border)",
                                  background:"var(--surface-1,rgba(255,255,255,.06))",
                                  cursor:"pointer",fontFamily:"inherit",color:"var(--text)",
                                  fontSize:12,transition:"border-color .12s",

                              </button>
                            </React.Fragment>
                          );
                        })}
                      </div>
                      <div style={{fontSize:10,color:"var(--text-3)",marginTop:8,fontStyle:"italic"}}>
                        Los XML contienen los datos del CFDI. En producción el PDF real se descarga del servidor de almacenamiento.
                      </div>
                    </div>
                  );
                })()}
              </div>
            );
          })}
          {/* ── Pólizas de liquidación de anticipos ── */}
          {liquidaciones.length > 0 && (
            <>
              <div style={{margin:"24px 0 12px",padding:"10px 16px",
                background:"var(--info-soft,rgba(55,138,221,.1))",
                border:"1px solid var(--info,#378ADD)",borderRadius:"var(--r-md,8px)",

                  <div key={li} className="card" style={{marginBottom:14,padding:0,
                    border:"1px solid var(--info,#378ADD)44"}}>

                      display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",
                      background:"var(--info-soft,rgba(55,138,221,.06))",
                      borderRadius:"var(--r-lg) var(--r-lg) 0 0"}}>
                      <span className="mono" style={{fontWeight:700,fontSize:14}}>

                    <div style={{padding:"10px 16px",borderBottom:"1px solid var(--border)",
                      display:"flex",gap:24,flexWrap:"wrap",fontSize:12,

                        <span className="mono muted" style={{marginLeft:6}}>{liq.anticipoId}</span>
                      </span>
                      <span><span className="muted">Comprobado: </span>
                        <strong className="mono">{window.fmtMXN(liq.totalComp)}</strong>
                      </span>
                      <span><span className="muted">Diferencia: </span>
                        <strong className="mono" style={{color:liq.diff>0?"var(--success)":liq.diff<0?"var(--warn)":"inherit"}}>
                          {liq.diff>=0?"+":""}{window.fmtMXN(liq.diff)}
                        </strong>
                      </span>
                    </div>

                    <table className="t">
                      <thead>
                        <tr>
                          <th>Cuenta</th><th>Nombre cuenta</th><th>D/A</th>
                          <th>Concepto</th><th className="right">Debe</th><th className="right">Haber</th>
                        </tr>
                      </thead>
                      <tbody>
                        {liq.lineas.map((l,i) => (
                          <tr key={i} style={{
                            background: l.nota ? "var(--warn-soft,#faeeda)" :
                              l.tipo==="A" ? "var(--surface-2,rgba(255,255,255,.03))" : "transparent"
                          }}>
                            <td className="mono" style={{fontWeight:600,
                              color:l.cuenta==="1125"?"var(--info)":l.cuenta==="1101"?"var(--success)":"var(--text)"}}>
                              {l.cuenta}
                            </td>
                            <td style={{fontSize:12}}>{l.nombre}</td>
                            <td>
                              <span className={`badge ${l.tipo==="C"?"solicitado":"autorizado"}`}>
                                <span className="dot"></span>{l.tipo==="C"?"Cargo":"Abono"}
                              </span>
                            </td>
                            <td style={{fontSize:12,maxWidth:220,overflow:"hidden",
                              textOverflow:"ellipsis",whiteSpace:"nowrap",
                              fontStyle:l.nota?"italic":"normal"}}>{l.concepto}</td>
                            <td className="num" style={{fontFamily:"var(--f-mono,monospace)"}}>
                              {l.debe ? window.fmtMXN(l.debe) : "—"}
                            </td>
                            <td className="num" style={{fontFamily:"var(--f-mono,monospace)",color:"var(--info)"}}>
                              {l.haber ? window.fmtMXN(l.haber) : "—"}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                      <tfoot>
                        <tr style={{borderTop:"1.5px solid var(--border)"}}>
                          <td colSpan={4} style={{padding:"8px 10px",textAlign:"right",fontWeight:600,fontSize:12}}>Totales</td>
                          <td className="num" style={{fontWeight:700}}>{window.fmtMXN(totD)}</td>
                          <td className="num" style={{fontWeight:700,color:"var(--info)"}}>{window.fmtMXN(totH)}</td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                );
              })}
            </>
          )}
        </>
      )}
    </>
  );
}

// Campo editable inline para el nombre del proveedor en pólizas
function EditableCell({ value, placeholder, onChange }) {
  const [editing, setEditing] = React.useState(false);
  const [val, setVal]         = React.useState(value || "");
  if (editing) {
    return (
      <input
        autoFocus
        className="input"
        style={{padding:"3px 6px",fontSize:12,height:28,minWidth:180}}
        value={val}
        placeholder={placeholder}
        onChange={e => setVal(e.target.value)}
        onBlur={() => { onChange(val); setEditing(false); }}
        onKeyDown={e => { if(e.key==="Enter"){onChange(val);setEditing(false);} if(e.key==="Escape")setEditing(false); }}
      />
    );
  }
  return (
    <span
      onClick={() => setEditing(true)}
      title="Clic para editar el nombre del proveedor"
      style={{cursor:"pointer",fontSize:12,
        color: val && val!=="—" ? "var(--text)" : "var(--text-3)",
        borderBottom:"1px dashed var(--border)",paddingBottom:1}}>
      {val && val!=="—" ? val : <span style={{fontStyle:"italic",opacity:.6}}>+ Agregar proveedor</span>}
    </span>
  );
}


// ── Descarga todos los adjuntos de una solicitud ────────────────────────────
function descargarTodosAdjuntos(solicitudId, folio) {
  const s = window.SOLICITUDES.find(x => x.id === (solicitudId || folio));
  const archivos = s && s.cfdi && s.cfdi.length > 0
    ? s.cfdi.map((cf, i) => ({
        nombre: `${(s||{}).id||folio}_${(cf.emisor||"factura").replace(/[^a-zA-Z0-9]/g,"_").slice(0,20)}_${i+1}`,
        uuid: cf.uuid || cf.uuidFull || null, emisor: cf.emisor || null, total: cf.total || 0,
      }))
    : s && s.comprobantes > 0
      ? Array.from({length: s.comprobantes}, (_,i) => ({
          nombre: `${(s||{}).id||folio}_comprobante_${i+1}`,
          uuid: null, emisor: null, total: null,
        }))
      : [];
  if (!archivos.length) { alert("No hay comprobantes adjuntos registrados en esta solicitud."); return; }
  archivos.forEach((f, i) => {
    setTimeout(() => {
      const xmlContent = f.uuid
        ? `<?xml version="1.0" encoding="UTF-8"?><Comprobante UUID="${f.uuid}" Emisor="${f.emisor||""}" Total="${f.total||0}" Folio="${folio}"/>`
        : `<?xml version="1.0" encoding="UTF-8"?><Comprobante Folio="${folio}" Archivo="${i+1}"/>`;
      const ax = document.createElement("a");
      ax.href = "data:application/xml;charset=utf-8," + encodeURIComponent(xmlContent);
      ax.download = `${f.nombre}.xml`; ax.click();
      setTimeout(() => {
        const pdfText = [`%PDF-1.4`,`% UUID: ${f.uuid||"—"}`,`% Emisor: ${f.emisor||"—"}`,`% Total: $${f.total||0}`].join("\n");
        const ap = document.createElement("a");
        ap.href = "data:application/pdf;charset=utf-8," + encodeURIComponent(pdfText);
        ap.download = `${f.nombre}.pdf`; ap.click();
      }, 300);
    }, i * 800);
  });
}

function GerenteHistorial({ openDetail, userId }) {
  const gerenteId = userId || "U101";
  const teamIds = window.USUARIOS.filter(u => u.gerente === gerenteId).map(u => u.id);
  const [, forceH] = React.useReducer(x=>x+1, 0);

  React.useEffect(() => {
    if (!window.sb || !teamIds.length) return;
    window.sb.from("solicitudes")
      .select("*")
      .in("usuario_id", teamIds)
      .in("status", ["autorizado","liberado","comprobado","rechazado","parcial"])
      .order("fecha", { ascending: false })
      .limit(200)
      .then(({data}) => {
        if (!data) return;
        data.forEach(s => {
          const m = { id:s.id, tipo:s.tipo, concepto:s.concepto, usuario:s.usuario_id,

          const ix = window.SOLICITUDES.findIndex(x => x.id === m.id);
          if (ix>=0) Object.assign(window.SOLICITUDES[ix], m);
          else window.SOLICITUDES.unshift(m);
        });
        forceH();

  const historial = window.SOLICITUDES.filter(s =>

  return (

// ── MobileScan — lector CFDI real para la vista móvil ────────────────────────
function MobileScan({ userId, onDone }) {
  const [facturas, setFacturas] = React.useState([]);
  const [enviado, setEnviado]   = React.useState(false);
  const [concepto, setConcepto] = React.useState("");
  const [toast, setToast]       = React.useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

  const handleFile = (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      if (!file.name.toLowerCase().endsWith(".xml")) {
        // Non-XML: add as plain attachment
        setFacturas(prev => [...prev, {
          nombre: file.name, emisor: file.name, concepto: file.name,
          total: 0, cuenta: "6121200001", confianza: 0, isCFDI: false
        }]);
        return;
      }
      const reader = new FileReader();
      reader.onload = (ev) => {
        const txt = ev.target.result;
        // Use the parseCFDI logic inline (simplified, same as CompUploader)
        try {
          const doc = new DOMParser().parseFromString(txt, "application/xml");
          if (doc.querySelector("parsererror")) { showToast("XML inválido: " + file.name); return; }
          const qn = (parent, localName) => {
            let el = parent.querySelector(localName);
            if (el) return el;
            const all = parent.getElementsByTagName("*");
            for (let i = 0; i < all.length; i++) if (all[i].localName === localName) return all[i];
            return null;
          };
          const attr = (el, ...names) => {
            if (!el) return "";
            for (const n of names) {
              const v = el.getAttribute(n) || el.getAttribute(n.toLowerCase()) || el.getAttribute(n[0].toUpperCase()+n.slice(1));
              if (v) return v;
            }
            return "";
          };
          const comp = qn(doc, "Comprobante") || doc.documentElement;
          const total    = parseFloat(attr(comp, "Total", "total") || "0");
          const subtotal = parseFloat(attr(comp, "SubTotal","Subtotal","subtotal") || "0");
          const emisorEl = qn(doc, "Emisor");
          const emisor   = attr(emisorEl, "Nombre","nombre") || attr(emisorEl, "Rfc","rfc") || "";
          const conceptoEls = Array.from(doc.getElementsByTagName("*")).filter(e => e.localName === "Concepto");
          const conceptoStr = conceptoEls.map(c => attr(c,"Descripcion","descripcion")).filter(Boolean).join(" · ").slice(0,80) || "—";
          const tfd  = Array.from(doc.getElementsByTagName("*")).find(e => e.localName === "TimbreFiscalDigital");
          const uuid = tfd ? (attr(tfd,"UUID","uuid") || "").toUpperCase() : "";
          let iva = 0;
          Array.from(doc.getElementsByTagName("*")).filter(e=>e.localName==="Traslado").forEach(t=>{
            const imp = attr(t,"Impuesto","impuesto");
            if (imp==="002"||imp.toUpperCase()==="IVA") iva += parseFloat(attr(t,"Importe","importe")||"0")||0;
          });
          if (!iva && total && subtotal) iva = Math.round((total-subtotal)*100)/100;

          // Classify
          const text = (emisor+" "+conceptoStr).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
          let cuenta = "6121200001", confianza = 0.5;
          if (/(pemex|gasolina|magna|premium|diesel|combustible)/.test(text)) { cuenta="6120800001"; confianza=0.96; }
          else if (/(aeromexico|volaris|vivaaerobus|vuelo|pasaje aereo|boleto)/.test(text)) { cuenta="6122900001"; confianza=0.96; }
          else if (/(tua|asur|aifa|oma|gap aeropuertos)/.test(text)) { cuenta="6122700001"; confianza=0.95; }
          else if (/(hotel|hospedaje|marriott|fiesta inn|holiday|city express|camino real|hilton)/.test(text)) { cuenta="6122900003"; confianza=0.95; }
          else if (/(restaurante|comida|alimento|cafeteria|cena|desayuno)/.test(text)) { cuenta="6122900005"; confianza=0.93; }
          else if (/(caseta|peaje|capufe|autopista)/.test(text)) { cuenta="6122900002"; confianza=0.95; }
          else if (/(estacionamiento|parking)/.test(text)) { cuenta="6122900004"; confianza=0.94; }
          else if (/(hertz|sixt|avis|alamo|renta de auto|renta vehicular)/.test(text)) { cuenta="6122900006"; confianza=0.94; }

          const meta = window.findCuenta(cuenta) || { nombre: cuenta };
          setFacturas(prev => [...prev, {
            nombre: file.name, uuid: uuid.slice(0,18)+(uuid.length>18?"…":""),
            emisor, concepto: conceptoStr, subtotal: Math.round(subtotal*100)/100,
            iva: Math.round(iva*100)/100, total: Math.round(total*100)/100,
            cuenta, nombreCuenta: meta.nombre, confianza, isCFDI: true,
          }]);
        } catch(err) { showToast("Error al leer: " + file.name); }
      };
      reader.readAsText(file, "utf-8");
    });
    e.target.value = "";
  };

  const enviarReembolso = async () => {
    if (!facturas.length) { showToast("Sube al menos una factura"); return; }
    const total = facturas.reduce((a,f)=>a+(f.total||0),0);
    const id = "REM-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-4);
    const conceptoFinal = concepto.trim() || facturas.map(f=>f.emisor).filter(Boolean).join(", ").slice(0,80);
    const u = window.findUser(userId);

    // Persistir en Supabase
    if (window.sb) {
      const { error } = await window.sb.from("solicitudes").insert({
        id, tipo:"reembolso", concepto: conceptoFinal,
        usuario_id: userId, monto: total,
        status:"solicitado", saldo_pendiente: 0,
        centro_id: u && u.centro ? u.centro : null,
        comprobantes: facturas.length,
        fecha: new Date().toISOString(),
      });
      if (error) { showToast("⚠ Error: " + error.message); return; }
      if (facturas.length > 0) {
        await window.sb.from("comprobantes_cfdi").insert(
          facturas.map(it=>({
            solicitud_id: id,
            uuid: it.uuidFull || it.uuid || ("SIN-UUID-"+Date.now()),
            emisor: it.emisor, concepto: it.concepto,
            subtotal: it.subtotal||0, iva: it.iva||0, total: it.total||0,
            cuenta: it.cuenta, confianza: it.confianza||0.9,
          }))
        );
      }
    }

    window.SOLICITUDES.unshift({
      id, tipo:"reembolso",
      concepto: conceptoFinal,
      usuario: userId, monto: total, fecha: new Date(),
      status:"solicitado", comprobantes: facturas.length, cfdi: facturas,
      saldoPendiente: 0,
    });
    showToast("✓ Reembolso " + id + " enviado");
    setEnviado(true);
    setTimeout(() => onDone && onDone(), 1500);
  };

  const labelStyle = {fontSize:10,fontWeight:600,letterSpacing:"0.07em",textTransform:"uppercase",
    color:"var(--text-3,rgba(255,255,255,.4))",display:"block",marginBottom:6};
  const chipStyle  = (ok) => ({padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:500,
    background:ok?"var(--success-soft,#e1f5ee)":"var(--warn-soft,#faeeda)",
    color:ok?"var(--success,#1d9e75)":"var(--warn,#ef9f27)"});

  return (
    <div>
      {toast && (
        <div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",zIndex:500,
          background:"var(--accent,#c5f24d)",color:"var(--accent-fg,#0a0b0f)",
          padding:"8px 16px",borderRadius:20,fontSize:12,fontWeight:500,whiteSpace:"nowrap"}}>
          {toast}
        </div>
      )}

      {/* Drop zone / selector */}
      <div className="dropzone" style={{padding:24,marginBottom:14,cursor:"pointer"}}
        onClick={() => document.getElementById("m-file-input").click()}>
        <div className="dropzone-icon"><Icon name="upload" size={22}/></div>
        <div className="dropzone-title">Toca para seleccionar XML o foto</div>
        <div className="dropzone-sub">XML · PDF · JPG — detectamos RFC, monto e IVA</div>
      </div>
      <input id="m-file-input" type="file" multiple accept=".xml,.pdf,.jpg,.jpeg,.png"
        style={{display:"none"}} onChange={handleFile}/>

      {/* Facturas procesadas */}
      {facturas.map((f, i) => (
        <div key={i} className="m-card" style={{marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
            <div style={{fontSize:12,fontWeight:600,flex:1,marginRight:8,
              overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.nombre}</div>
            <button onClick={()=>setFacturas(prev=>prev.filter((_,j)=>j!==i))}
              style={{background:"none",border:"none",color:"var(--text-3)",cursor:"pointer",
                fontSize:16,lineHeight:1,padding:"0 2px"}}>×</button>
          </div>

          {f.isCFDI ? (
            <>
              <div className="spread" style={{padding:"3px 0"}}>
                <span className="muted" style={{fontSize:11}}>Emisor</span>
                <strong style={{fontSize:12}}>{f.emisor||"—"}</strong>
              </div>
              <div className="spread" style={{padding:"3px 0"}}>
                <span className="muted" style={{fontSize:11}}>Total</span>
                <strong className="mono" style={{fontSize:13}}>{window.fmtMXN(f.total)}</strong>
              </div>
              <div className="spread" style={{padding:"3px 0"}}>
                <span className="muted" style={{fontSize:11}}>IVA</span>
                <strong className="mono" style={{fontSize:12}}>{window.fmtMXN(f.iva)}</strong>
              </div>
              <div style={{marginTop:8,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div>
                  <div style={{fontSize:11,fontWeight:600}}>{f.nombreCuenta}</div>
                  <div style={{fontFamily:"monospace",fontSize:10,color:"var(--text-3)"}}>{f.cuenta}</div>
                </div>
                <span style={chipStyle(f.confianza>=0.85)}>
                  {Math.round(f.confianza*100)}% {f.confianza>=0.85?"✓":"revisar"}
                </span>
              </div>
              {/* Selector de cuenta si confianza baja */}
              {f.confianza < 0.85 && (
                <select style={{width:"100%",marginTop:8,padding:"6px 8px",fontSize:12,
                  border:"1px solid var(--border)",borderRadius:8,
                  background:"var(--surface-2)",color:"var(--text)",fontFamily:"inherit"}}
                  value={f.cuenta}
                  onChange={e=>{
                    const updated=[...facturas];
                    const meta=window.findCuenta(e.target.value)||{nombre:e.target.value};
                    updated[i]={...updated[i],cuenta:e.target.value,nombreCuenta:meta.nombre,confianza:1};
                    setFacturas(updated);
                  }}>
                  {window.CATALOGO_GASTOS.filter(c=>c.grupo!=="Activo").map(c=>(
                    <option key={c.cuenta} value={c.cuenta}>{c.cuenta} · {c.nombre}</option>
                  ))}
                </select>
              )}
            </>
          ) : (
            <div className="muted" style={{fontSize:12}}>Archivo adjunto (no XML)</div>
          )}
        </div>
      ))}

      {facturas.length > 0 && (
        <>
          <div style={{marginBottom:12}}>
            <span style={labelStyle}>Concepto del reembolso</span>
            <input style={{width:"100%",padding:"8px 10px",fontSize:13,
              border:"1px solid var(--border)",borderRadius:8,
              background:"var(--surface-2)",color:"var(--text)",
              fontFamily:"inherit",boxSizing:"border-box"}}
              placeholder="Descripción breve del gasto…"
              value={concepto} onChange={e=>setConcepto(e.target.value)}/>
          </div>
          <div style={{padding:"10px 14px",background:"var(--surface-2,rgba(255,255,255,.06))",
            borderRadius:8,marginBottom:12,display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:13}}>Total a reembolsar</span>
            <strong className="mono">{window.fmtMXN(facturas.reduce((a,f)=>a+(f.total||0),0))}</strong>
          </div>
          <button className="btn primary"
            style={{width:"100%",justifyContent:"center",opacity:enviado?0.5:1,
              pointerEvents:enviado?"none":"auto"}}
            onClick={enviarReembolso}>
            <Icon name="arrowR" size={14}/> {enviado ? "Enviado ✓" : "Enviar como reembolso"}
          </button>
          <button className="btn" style={{width:"100%",justifyContent:"center",marginTop:8}}
            onClick={() => setFacturas([])}>
            Limpiar
          </button>
        </>
      )}
    </div>
  );
}

// ───────────────────────── Gerente ─────────────────────────

function MGerenteBandeja({ userId, push, showSnack }) {
  const me = window.findUser(userId);
  const esAdmin = me && me.rol === "admin";
  const [, forceMGB] = React.useReducer(x=>x+1, 0);
  React.useEffect(() => {
    if (!window.sb) return;
    let query = window.sb.from("solicitudes").select("*").eq("status","solicitado");
    if (!esAdmin) {
      const teamIds = window.USUARIOS.filter(u => u.gerente === userId).map(u => u.id);
      if (!teamIds.length) return;
      query = query.in("usuario_id", teamIds);
    }
    query.order("fecha",{ascending:false})
      .then(({data})=>{
        if (!data) return;
        data.forEach(s=>{
          const m={id:s.id,tipo:s.tipo,concepto:s.concepto,usuario:s.usuario_id,
            monto:parseFloat(s.monto)||0,fecha:new Date(s.fecha),status:s.status,
            saldoPendiente:parseFloat(s.saldo_pendiente)||0};
          const ix=window.SOLICITUDES.findIndex(x=>x.id===m.id);
          if(ix>=0) Object.assign(window.SOLICITUDES[ix],m);
          else window.SOLICITUDES.unshift(m);
        });
        forceMGB();
      });
  }, [userId]);
  const teamIds = window.USUARIOS.filter(u => u.gerente === userId).map(u => u.id);
  const all = window.SOLICITUDES.filter(s => s.status === "solicitado" && (esAdmin || teamIds.includes(s.usuario)));
  const [, force] = React.useReducer(x => x + 1, 0);
  const aprobar = async (s) => {

function MTesoreriaLiberar({ push, showSnack }) {
  const [, forceMTL] = React.useReducer(x=>x+1, 0);
  React.useEffect(() => {
    if (!window.sb) return;
    window.sb.from("solicitudes").select("*").eq("status","autorizado")
      .order("fecha",{ascending:false}).then(({data})=>{
        if (!data) return;
        data.forEach(s=>{
          const m={id:s.id,tipo:s.tipo,concepto:s.concepto,usuario:s.usuario_id,
            monto:parseFloat(s.monto)||0,fecha:new Date(s.fecha),status:s.status,
            saldoPendiente:parseFloat(s.saldo_pendiente)||0,
            anticipoRef:s.anticipo_ref||null};
          const ix=window.SOLICITUDES.findIndex(x=>x.id===m.id);
          if(ix>=0) Object.assign(window.SOLICITUDES[ix],m);
          else window.SOLICITUDES.unshift(m);
        });
        forceMTL();
      });
  }, []);
  const [items, setItems] = React.useState(() => window.SOLICITUDES.filter(s => s.status === "autorizado"));
  const liberar = async (id) => {
    const s = window.SOLICITUDES.find(x => x.id === id);
    if (!s) return;
    const newStatus = s.tipo === "comprobacion" ? "comprobado" : "liberado";
    if (window.sb) {
      const updateData = { status: newStatus };
      if (s.tipo === "anticipo") updateData.saldo_pendiente = s.monto;
      if (s.tipo === "comprobacion") updateData.saldo_pendiente = 0;
      const { error } = await window.sb.from("solicitudes").update(updateData).eq("id", id);
      if (error) { showSnack("Error: " + error.message); return; }
      // Si es comprobación, actualizar anticipo padre
      if (s.tipo === "comprobacion" && s.anticipoRef) {
        const ant = window.SOLICITUDES.find(x => x.id === s.anticipoRef);
        if (ant) await window.sb.from("solicitudes").update({
          status: ant.status, saldo_pendiente: ant.saldoPendiente
        }).eq("id", s.anticipoRef);
      }
    }
    s.status = newStatus;
    if (s.tipo === "anticipo") s.saldoPendiente = s.monto;
    if (s.tipo === "comprobacion") s.saldoPendiente = 0;
    setItems(items.filter(i => i.id !== id));
    showSnack(`✓ ${id} dispersado vía SPEI`);
  };
  return (
    <div className="m-pad">
      <div style={{paddingTop:4, marginBottom:14}}>
        <div style={{fontSize:11, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.06em"}}>Tesorería</div>
        <div style={{fontFamily:"var(--f-display)", fontSize:22, fontWeight:600, letterSpacing:"-0.02em"}}>Por liberar</div>
      </div>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12}}>
        <div className="m-card" style={{margin:0, padding:"10px 12px"}}>
          <div style={{fontSize:10.5, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600}}>Pendientes</div>
          <div style={{fontFamily:"var(--f-display)", fontSize:19, fontWeight:600}}>{items.length}</div>
        </div>
        <div className="m-card" style={{margin:0, padding:"10px 12px"}}>
          <div style={{fontSize:10.5, color:"var(--text-3)", textTransform:"uppercase", letterSpacing:"0.05em", fontWeight:600}}>Monto</div>
          <div style={{fontFamily:"var(--f-display)", fontSize:15, fontWeight:600, marginTop:2}}>{window.fmtMXN(items.reduce((a,s)=>a+s.monto,0))}</div>
        </div>
      </div>
      {items.length > 0 && <button className="btn primary" style={{width:"100%", justifyContent:"center", marginBottom:12}}><Icon name="download" size={13}/> Generar layout SPEI ({items.length})</button>}
      {items.length === 0 && <M_Empty icon="check" title="Todo liberado" sub="No hay solicitudes pendientes de dispersión"/>}
      {items.map(s => {
        const u = window.findUser(s.usuario);
        return (
          <div key={s.id} className="m-card">
            <div style={{display:"flex", gap:10, marginBottom:6}}>
              <div className="avatar sm">{u.iniciales}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13, fontWeight:500}}>{u.nombre}</div>
                <div className="muted mono" style={{fontSize:11}}>•••• 4392 · BBVA</div>
              </div>
            </div>
            <div className="muted" style={{fontSize:12}}>{s.concepto}</div>
            <div className="spread" style={{marginTop:10}}>
              <span className="mono" style={{fontSize:16, fontWeight:600}}>{window.fmtMXN(s.monto)}</span>
              <div style={{display:"flex", gap:6}}>
                <button className="btn sm ghost" onClick={() => push({name:"detalle", id:s.id})}>Ver</button>
                <button className="btn sm primary" onClick={() => liberar(s.id)}><Icon name="cash" size={11}/> Liberar</button>

function MContadorCatalogo() {
  const [cuentas, setCuentas] = React.useState(window.CATALOGO_GASTOS);
  const [editing, setEditing] = React.useState(null);

  const openEdit = (c) => setEditing(c || { cuenta:"", nombre:"", grupo:"Transporte", _isNew:true });

  const save = (vals) => {
    if (!vals.cuenta?.trim()) { alert("Falta el número de cuenta"); return; }
    if (!vals.nombre?.trim()) { alert("Falta el nombre de la cuenta"); return; }
    const isNew = !!editing._isNew;
    const record = { cuenta: vals.cuenta.trim(), nombre: vals.nombre.trim(), grupo: vals.grupo };
    if (isNew) record.activo = true;
    const updated = isNew
      ? [...cuentas, record]
      : cuentas.map(c => c.cuenta === editing.cuenta ? { ...c, ...record } : c);
    setCuentas(updated);
    window.CATALOGO_GASTOS = updated;
    setEditing(null);
  };

  const toggleBlock = (block) => {
    const updated = cuentas.map(c => c.cuenta === editing.cuenta ? { ...c, activo: !block } : c);
    setCuentas(updated);
    window.CATALOGO_GASTOS = updated;
  };

  const deleteCuenta = () => {
    const updated = cuentas.filter(c => c.cuenta !== editing.cuenta);
    setCuentas(updated);
    window.CATALOGO_GASTOS = updated;
  };

  return (
    <div className="m-pad">
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", margin:"4px 4px 10px"}}>
        <div style={{fontSize:11, textTransform:"uppercase", letterSpacing:"0.08em", color:"var(--text-3)", fontWeight:600}}>Catálogo de gastos</div>
        <button className="btn sm primary" onClick={() => openEdit(null)}><Icon name="plus" size={11}/> Nueva</button>
      </div>
      {cuentas.map(c => (
        <div key={c.cuenta} className="m-card" style={{display:"flex", alignItems:"center", gap:12, cursor:"pointer", opacity: c.activo === false ? 0.55 : 1}} onClick={() => openEdit(c)}>
          <div style={{width:36, height:36, borderRadius:10, background:"var(--accent-soft)", color:"var(--accent)", display:"grid", placeItems:"center"}}><Icon name="book" size={15}/></div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:13, fontWeight:500, display:"flex", alignItems:"center", gap:6}}>
              {c.nombre}
              {c.activo === false && <span style={{background:"var(--warn-soft)",color:"var(--warn)",fontSize:9,padding:"1px 5px",borderRadius:6,textTransform:"uppercase",letterSpacing:"0.05em",fontWeight:600}}>Bloq</span>}
            </div>
            <div className="muted mono" style={{fontSize:11, marginTop:2}}>{c.cuenta} · {c.grupo}</div>
          </div>
          <Icon name="chevR" size={14} style={{color:"var(--text-3)"}}/>
        </div>
      ))}

      {editing && (
        <EditModal
          title={editing._isNew ? "Nueva cuenta" : "Editar cuenta"}
          isNew={!!editing._isNew}
          blocked={editing.activo === false}
          onBlock={toggleBlock}
          onDelete={deleteCuenta}
          fields={[
            { key:"cuenta", label:"Número de cuenta", value:editing.cuenta },
            { key:"nombre", label:"Nombre",            value:editing.nombre, full:true },
            { key:"grupo",  label:"Grupo",             value:editing.grupo, full:true, type:"select",
              options:["Transporte","Hospedaje","Alimentos","Impuestos","Otros"].map(g=>({value:g,label:g})) },
          ]}
          onClose={() => setEditing(null)}
          onSave={save}
        />
      )}
    </div>
  );
}
